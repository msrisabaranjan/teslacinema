<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>

  <script>
  /* ── TESLA 2026.26+ BROWSER-ZOOM COMPAT ── */
  (function(){
    try{
      var ua = navigator.userAgent || '';
      if(!/Tesla/i.test(ua)) return;
      var w = window.innerWidth, h = window.innerHeight;
      var zoomed = w >= 680 && w <= 900 && h >= 520 && h <= 720;
      if(!zoomed) return;
      var physW = Math.round(w * (window.devicePixelRatio || 1));
      var meta = document.querySelector('meta[name="viewport"]');
      if(meta){
        meta.setAttribute('content',
          'width=' + physW +
          ', initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0' +
          ', user-scalable=no, viewport-fit=cover');
      }
      document.documentElement.setAttribute('data-tesla-zoomed','');
    }catch(e){/* never break page boot on compat failure */}
  })();
  </script>

  <script>
  /* ── AMBIENT MODE PRE-PAINT RESTORE ──
     Applies the saved mode (html[data-mode]) and its accent hue before
     the stylesheet paints, so the cockpit never flashes the default.
     Mirrors the MODE_HUES map in the accent-panel script below. */
  (function(){
    try{
      var HUES = {personal:141,efficient:178,sport:8,silent:214,theater:32,white:0};
      var raw = localStorage.getItem('tcinema.mode');
      var m = (raw && HUES.hasOwnProperty(raw)) ? raw : null;
      var v = parseInt(localStorage.getItem('tcinema.accentHue'), 10);
      if(!m) m = (Number.isFinite(v) && v !== 141) ? 'custom' : 'personal';
      document.documentElement.setAttribute('data-mode', m);
      var h = (m === 'custom' && Number.isFinite(v)) ? v : HUES[m];
      document.documentElement.style.setProperty('--h', h);
    }catch(e){/* never break page boot on compat failure */}
  })();
  </script>

  <title>T / Cinema</title>
  <link rel="icon" href="images/miff4.png"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="vendor/gridstack.min.css"/>

  <style>
    :root{
      /* --h is the single accent-hue knob (T logo → slider recolors it).
         141 is the default Spotify green: #1DB954 = hsl(141 73% 42%),
         #1ED760 ≈ hsl(141 75% 48%). Every UI green derives from it. */
      --h:141;
      /* Accent saturation/lightness: modes can desaturate + brighten
         the whole accent system (White mode = monochrome glow). */
      --acc-sat:73%;--acc-lum:42%;
      --bg:#0B0B0E;
      --bg-raised:#111114;
      --surface:#18181D;
      --surface-em:#22222A;
      --surface-active:hsl(var(--h) var(--acc-sat) var(--acc-lum) / .14);
      --border:rgba(255,255,255,.08);
      --border-em:rgba(255,255,255,.16);
      --accent:hsl(var(--h) var(--acc-sat) var(--acc-lum));
      --accent-soft:hsl(var(--h) var(--acc-sat) var(--acc-lum) / .16);
      --accent-2:#8B5CF6;
      --accent-3:#3B82F6;
      --text:#FFFFFF;
      --muted:rgba(255,255,255,.62);
      --muted2:rgba(255,255,255,.34);
      --green:hsl(var(--h) var(--acc-sat) calc(var(--acc-lum) + 6%));
      --red:#FF453A;
      --yellow:#FFD166;
      --ease-out:cubic-bezier(.16,.84,.44,1);
      --ease-spring:cubic-bezier(.34,1.4,.64,1);
      --ease-smooth:cubic-bezier(.22,.61,.36,1);
      --ease-fluid:cubic-bezier(.4,0,.2,1);
      --ease-duo:cubic-bezier(.32,.72,0,1);
      --accent-glow:0 10px 30px -8px hsl(var(--h) var(--acc-sat) var(--acc-lum) / .42),0 0 0 1px hsl(var(--h) var(--acc-sat) var(--acc-lum) / .28);
      --tile-shadow:0 1px 0 rgba(255,255,255,.04) inset,0 -1px 0 rgba(0,0,0,.32) inset;
      --boot-delay:1.7s;
      --speed-glow:0;
      /* Ambient mode (iDrive X "My Modes"): aurora field hues/alphas +
         glow strength, overridden per html[data-mode] further below.
         --h (the accent knob) is set inline by JS to the mode's hue. */
      --amb-h1:var(--h);--amb-h2:265;--amb-h3:200;
      --amb-sat:73%;
      --amb-a1:.10;--amb-a2:.08;--amb-a3:.02;
      --amb-glow:.42;
    }

    *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}

    /* Background lives on <html> only: body must stay transparent so
       the z-index:-1 ambient layers (body::before, .amb-field) paint
       above the canvas but below all content. */
    html{
      background:var(--bg);
    }
    body{
      color:var(--text);
      font-family:'Inter',system-ui,sans-serif;
      min-height:100vh;
      overflow-x:hidden;
    }

    body::before{
      content:'';
      position:fixed;inset:-20%;
      z-index:-1;pointer-events:none;
      background:
        radial-gradient(60% 50% at 18% 22%,hsl(var(--amb-h1) var(--amb-sat) 42% / var(--amb-a1)),transparent 60%),
        radial-gradient(50% 40% at 82% 78%,hsl(var(--amb-h2) var(--amb-sat) 45% / var(--amb-a2)),transparent 65%),
        radial-gradient(40% 30% at 50% 50%,hsl(var(--amb-h3) var(--amb-sat) 50% / var(--amb-a3)),transparent 70%);
      animation:ambientDrift 22s var(--ease-smooth) infinite alternate;
      will-change:transform,opacity;
    }

    @keyframes ambientDrift{
      0%   {transform:translate3d(0,0,0) scale(1);opacity:.85;}
      50%  {transform:translate3d(2%,-1.5%,0) scale(1.04);opacity:1;}
      100% {transform:translate3d(-1.5%,2%,0) scale(1.02);opacity:.9;}
    }

    body::after{
      content:'';
      position:fixed;inset:0;
      z-index:-1;
      pointer-events:none;
      background:
        radial-gradient(55% 45% at 50% 28%, hsl(var(--h) var(--acc-sat) var(--acc-lum) /.18), transparent 68%),
        radial-gradient(35% 30% at 50% 70%, hsl(var(--h) var(--acc-sat) var(--acc-lum) /.08), transparent 70%);
      opacity:var(--speed-glow,0);
      transition:opacity 1.2s var(--ease-smooth);
    }

    @media (prefers-reduced-motion:reduce){
      body::before{animation:none;}
      .amb-field i{animation:none;}
      *,*::before,*::after{
        animation-duration:.001ms !important;
        animation-iteration-count:1 !important;
        transition-duration:.05s !important;
      }
    }

    /* Shared pulsing dot for the LIVE status chips. */
    @keyframes livePulse{
      0%   {box-shadow:0 0 0 0 hsl(var(--h) var(--acc-sat) var(--acc-lum) /.55);transform:scale(1);}
      70%  {box-shadow:0 0 0 7px hsl(var(--h) var(--acc-sat) var(--acc-lum) /0);transform:scale(1.12);}
      100% {box-shadow:0 0 0 0 hsl(var(--h) var(--acc-sat) var(--acc-lum) /0);transform:scale(1);}
    }
    /* ── STOCKS TILE (live, best performer floats to the top) ── */
    .stock-tile{
      --row-h:52px;
      --row-gap:4px;
      --col-gap:8px;
      --list-pad:10px;
      display:flex;flex-direction:column;
      border:1px solid var(--border);
      border-radius:18px;
      overflow:hidden;
      background:
        linear-gradient(180deg,hsl(var(--h) var(--acc-sat) var(--acc-lum) /.08),transparent 42%),
        var(--surface);
      box-shadow:var(--tile-shadow);
    }
    .stock-head{
      display:flex;align-items:center;gap:8px;
      padding:11px 14px 11px 16px;border-bottom:1px solid var(--border);
    }
    .stock-head-label{
      font-size:10px;font-weight:800;letter-spacing:.14em;
      text-transform:uppercase;color:var(--accent);
    }
    .stock-status{display:inline-flex;align-items:center;gap:6px;margin-left:2px;}
    .stock-status-dot{
      width:7px;height:7px;border-radius:50%;
      background:var(--muted2);
      box-shadow:0 0 0 0 transparent;
    }
    .stock-status.live .stock-status-dot{
      background:var(--green);
      animation:livePulse 1.8s var(--ease-smooth) infinite;
    }
    .stock-status-label{font-size:10px;font-weight:800;letter-spacing:.1em;}
    .stock-status.live .stock-status-label{color:var(--green);}
    .stock-status.closed .stock-status-label{color:var(--muted);}
    .stock-status-sub{
      font-size:10px;font-weight:600;color:var(--muted2);
      font-variant-numeric:tabular-nums;
    }
    /* Rows are absolutely positioned slots; JS fits the list to the
       tile (columns by width, row height by available space, worst
       performers hidden when even that runs out) and assigns each a
       translate(x,y) for its rank — the CSS transition animates
       re-ranking whenever data refreshes. */
    .stock-list{position:relative;flex:1 1 auto;min-height:0;margin:6px 0 8px;padding:0 var(--list-pad);}
    .stock-row{
      position:absolute;left:0;top:0;
      height:var(--row-h);
      display:flex;align-items:center;gap:7px;
      padding:0 8px;border-radius:12px;
      transition:transform .55s var(--ease-smooth),background .35s var(--ease-smooth);
      will-change:transform;
    }
    .stock-row.best{background:var(--accent-soft);}
    .stock-rank{
      flex-shrink:0;
      width:9px;text-align:center;
      font-size:11px;font-weight:800;color:var(--muted2);
      font-variant-numeric:tabular-nums;
    }
    .stock-row.best .stock-rank{color:var(--green);}
    /* Brand-colored fill + subtle glow, one class per symbol.
       --ink flips dark on the light fills for legibility. */
    .stock-badge{
      flex-shrink:0;
      width:34px;height:34px;border-radius:50%;
      display:flex;align-items:center;justify-content:center;
      font-size:8.5px;font-weight:800;letter-spacing:.02em;
      --c:rgba(255,255,255,.16);
      --ink:#fff;
      color:var(--ink);
      background:var(--c);
      box-shadow:
        0 0 7px -1px var(--c),
        0 0 18px -4px var(--c),
        inset 0 0 0 1px rgba(255,255,255,.16);
    }
    .b-tsla {--c:#E82127;}                       /* Tesla red    */
    .b-amd  {--c:#FF8A00;--ink:#1A1204;}         /* orange       */
    .b-nvda {--c:#76B900;--ink:#10200A;}         /* NVIDIA green */
    .b-amzn {--c:#FFB300;--ink:#201400;}         /* gold         */
    .b-googl{--c:#FBBC04;--ink:#201900;}         /* Google yellow*/
    .b-meta {--c:#0866FF;}                       /* Meta blue    */
    .b-nio  {--c:#00B8D9;--ink:#00323A;}         /* NIO teal     */
    .b-btc  {--c:#9B5CF6;}                       /* purple       */
    .b-ltc  {--c:#4CC3F7;--ink:#002533;}         /* light blue   */
    .stock-info{min-width:0;flex:1;}
    .stock-name{
      font-size:13px;font-weight:700;color:#fff;
      white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    }
    .stock-price-line{
      margin-top:2px;
      font-size:12px;font-weight:600;color:var(--muted);
      font-variant-numeric:tabular-nums;
      white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    }
    .sp-cur{font-size:9px;font-weight:700;letter-spacing:.04em;color:var(--muted2);margin:0 4px 0 2px;}
    .sp-chg{font-size:12px;font-weight:800;}
    .sp-chg.up{color:var(--green);}
    .sp-chg.dn{color:var(--red);}
    @media (max-height:700px){
      .stock-tile{--row-h:46px;--row-gap:3px;}
      .stock-badge{width:32px;height:32px;font-size:8px;}
    }
    /* Tight rows (small tile): shrink badge + type so rows never
       collide — JS sets --row-h and toggles this class to fit. */
    .stock-tile.tight .stock-badge{width:28px;height:28px;font-size:7.5px;}
    .stock-tile.tight .stock-name{font-size:12px;}
    .stock-tile.tight .stock-price-line{font-size:11px;}
    .stock-tile.tight .sp-cur{font-size:8px;}
    .stock-tile.tight .sp-chg{font-size:11px;}

    /* ── RIGHT ISLAND BAR (replaces the old top header) ──
       A borderless floating stack pinned to the top-right:
       logo → time + date → year-progress ring.
       The fullscreen button floats alone in the bottom-right corner. */
    @keyframes slideDown{
      from{opacity:0;transform:translateY(-8px);}
      to  {opacity:1;transform:translateY(0);}
    }
    /* Ungrouped floating stack — borderless, each element sized like
       the nav rail's 40px buttons and aligned with it. */
    .island-bar{
      position:fixed;top:28px;right:8px;z-index:600;
      display:flex;flex-direction:column;align-items:center;
      gap:8px;width:58px;
      user-select:none;
      animation:islandIn .7s var(--ease-out) var(--boot-delay) both;
    }
    @keyframes islandIn{
      from{opacity:0;transform:translateX(12px);}
      to  {opacity:1;transform:translateX(0);}
    }
    .logo-t{
      width:36px;height:36px;background:var(--accent);border-radius:11px;
      display:flex;align-items:center;justify-content:center;
      font-weight:800;font-size:15px;color:#07110C;letter-spacing:-.02em;
      box-shadow:0 0 0 0 hsl(var(--h) var(--acc-sat) var(--acc-lum) /.4),0 8px 20px hsl(var(--h) var(--acc-sat) var(--acc-lum) /.18);
      animation:logoBreathe 4.5s var(--ease-smooth) infinite;
      flex-shrink:0;
      cursor:pointer; /* tap → accent hue panel */
      margin-bottom:10px; /* extra breathing room between logo and time */
    }
    @keyframes logoBreathe{
      0%,100% {box-shadow:0 0 0 0 hsl(var(--h) var(--acc-sat) var(--acc-lum) /0),0 2px 8px hsl(var(--h) var(--acc-sat) var(--acc-lum) /.18);}
      50%     {box-shadow:0 0 0 5px hsl(var(--h) var(--acc-sat) var(--acc-lum) /.06),0 8px 18px hsl(var(--h) var(--acc-sat) var(--acc-lum) /.32);}
    }
    #clock-wrap{display:flex;flex-direction:column;align-items:center;gap:3px;}
    #clock{
      font-size:15px;font-weight:700;letter-spacing:-.02em;line-height:1;
      font-variant-numeric:tabular-nums;
      transition:color .3s var(--ease-smooth);
    }
    #clock.tick{animation:clockTick .55s var(--ease-smooth);}
    @keyframes clockTick{
      0%   {opacity:.4;transform:translateY(-2px);}
      60%  {opacity:1;}
      100% {opacity:1;transform:translateY(0);}
    }
    #date-display{
      font-size:9px;font-weight:600;
      color:var(--muted);
      letter-spacing:.02em;
      white-space:nowrap;
      max-width:58px;overflow:hidden;text-overflow:ellipsis;
    }
    .fs-btn{
      width:36px;height:36px;border-radius:999px;
      border:1px solid var(--border);
      background:rgba(255,255,255,.04);
      color:var(--muted);cursor:pointer;
      display:flex;align-items:center;justify-content:center;
      transition:
        background .25s var(--ease-smooth),
        border-color .25s var(--ease-smooth),
        color .25s var(--ease-smooth),
        transform .35s var(--ease-spring);
      flex-shrink:0;
    }
    .fs-btn:hover{
      color:var(--text);
      border-color:rgba(255,255,255,.28);
      background:rgba(255,255,255,.07);
    }
    .fs-btn:active{
      background:var(--accent-soft);border-color:var(--accent);color:#fff;
      transform:scale(.92);
    }
    .fs-btn svg{
      width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;
      transition:transform .35s var(--ease-spring);
    }
    .fs-btn:hover svg{transform:scale(1.08);}
    #fsBtn{
      position:fixed;bottom:16px;right:14px;z-index:600;
      animation:islandIn .7s var(--ease-out) calc(var(--boot-delay) + .45s) both;
    }

    /* ── ACCENT PANEL (tap the T logo → hue slider recolors every UI green) ── */
    .accent-panel{
      position:fixed;top:28px;right:76px;z-index:650;
      width:232px;padding:14px 16px 12px;
      background:rgba(15,15,19,.92);
      backdrop-filter:blur(22px) saturate(1.5);
      -webkit-backdrop-filter:blur(22px) saturate(1.5);
      border:1px solid var(--border-em);
      border-radius:16px;
      box-shadow:0 18px 40px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.08);
      opacity:0;visibility:hidden;transform:translateY(-6px) scale(.97);
      transform-origin:top right;
      transition:opacity .22s var(--ease-out),transform .26s var(--ease-spring),visibility .22s;
    }
    .accent-panel.open{opacity:1;visibility:visible;transform:none;}
    .accent-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
    .accent-title{font-size:10px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);}
    .accent-close{
      width:24px;height:24px;border:none;border-radius:999px;background:transparent;
      color:var(--muted2);cursor:pointer;
      display:flex;align-items:center;justify-content:center;
      transition:background .15s var(--ease-smooth),color .15s var(--ease-smooth);
    }
    .accent-close:hover{background:rgba(255,255,255,.08);color:#fff;}
    .accent-close svg{width:12px;height:12px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;}
    .accent-hue{
      -webkit-appearance:none;appearance:none;
      width:100%;height:22px;background:transparent;cursor:pointer;margin:0;
    }
    .accent-hue::-webkit-slider-runnable-track{
      height:10px;border-radius:999px;
      background:linear-gradient(90deg,hsl(0 73% 42%),hsl(60 73% 42%),hsl(120 73% 42%),hsl(180 73% 42%),hsl(240 73% 42%),hsl(300 73% 42%),hsl(360 73% 42%));
      border:1px solid rgba(255,255,255,.14);
    }
    .accent-hue::-moz-range-track{
      height:10px;border-radius:999px;
      background:linear-gradient(90deg,hsl(0 73% 42%),hsl(60 73% 42%),hsl(120 73% 42%),hsl(180 73% 42%),hsl(240 73% 42%),hsl(300 73% 42%),hsl(360 73% 42%));
      border:1px solid rgba(255,255,255,.14);
    }
    .accent-hue::-webkit-slider-thumb{
      -webkit-appearance:none;appearance:none;
      width:18px;height:18px;border-radius:50%;margin-top:-5px;
      background:var(--accent);
      border:2px solid #fff;
      box-shadow:0 2px 8px rgba(0,0,0,.5),0 0 10px hsl(var(--h) var(--acc-sat) var(--acc-lum) /.55);
    }
    .accent-hue::-moz-range-thumb{
      width:14px;height:14px;border-radius:50%;
      background:var(--accent);
      border:2px solid #fff;
      box-shadow:0 2px 8px rgba(0,0,0,.5),0 0 10px hsl(var(--h) var(--acc-sat) var(--acc-lum) /.55);
    }
    .accent-foot{display:flex;align-items:center;justify-content:space-between;margin-top:10px;}
    .accent-hex{font-size:11px;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums;letter-spacing:.04em;}
    .accent-reset{
      border:1px solid var(--border-em);border-radius:999px;background:rgba(255,255,255,.04);
      color:var(--muted);font-family:inherit;font-size:10px;font-weight:700;letter-spacing:.06em;
      padding:5px 12px;cursor:pointer;
      transition:background .15s var(--ease-smooth),color .15s var(--ease-smooth),border-color .15s var(--ease-smooth);
    }
    .accent-reset:hover{background:rgba(255,255,255,.08);color:#fff;}
    .accent-reset:active{background:var(--accent-soft);border-color:var(--accent);color:#fff;}
    @media (max-width:640px){
      .accent-panel{top:24px;right:68px;width:212px;}
    }

    /* Year progress: a ring with the days-left number inside it. */
    .yr-ring{
      cursor:default;display:flex;flex-direction:column;
      align-items:center;gap:5px;flex-shrink:0;
    }
    .yr-arc{display:block;width:36px;height:36px;}
    .yr-arc-track{stroke:rgba(255,255,255,0.08);fill:none;stroke-linecap:round;}
    .yr-arc-fill{fill:none;stroke-linecap:round;transition:stroke-dashoffset 1.2s var(--ease-smooth),stroke .6s var(--ease-smooth);}
    .yr-arc-days{
      font-size:15px;font-weight:800;fill:#fff;
      text-anchor:middle;dominant-baseline:central;
      font-family:'Inter',sans-serif;
      font-variant-numeric:tabular-nums;
    }
    .yr-ring-cap{
      font-size:7px;font-weight:800;letter-spacing:.16em;
      text-transform:uppercase;color:var(--muted);line-height:1;
    }

    /* ── HOME TILES (hold a tile to rearrange) ── */
    @keyframes cardReveal{
      from{opacity:0;transform:translateY(8px) scale(.99);}
      to  {opacity:1;transform:translateY(0) scale(1);}
    }

    /* Grid placement (Gridstack): the item shells carry the geometry
       (absolute left/top/width/height, set inline by the library); the
       .home-tile content fills its shell, inset by --gs-item-margin-*.
       The grid box covers the content area (origin --hx/--hy, right
       margin --hxr); JS keeps --cell-w/--cell-h in sync with the live
       grid metrics for the placement overlay. */
    #pageHome{
      /* position:relative would override .page's absolute;inset:0 and
         collapse the page to its padding height — keep .page's box.
         No scrolling: fitHomeGrid() scales the row pitch so every
         occupied row stays inside the viewport. */
      padding:0 0 140px 0;
      overflow:hidden;
      --hx:24px;--hy:16px;--hxr:104px;
    }
    #homeGrid{
      position:absolute;
      top:var(--hy);left:var(--hx);right:var(--hxr);
      /* Gridstack sizes the container to the occupied rows, but its
         droppable rect IS the container box — a tile dragged below it
         is treated as "left the grid" and snaps back. fitHomeGrid()
         stretches the box (px min-height — the engine parseHeight()s
         it, so no calc() here) over the whole usable area so the
         empty rows under the layout stay reachable for drags/resizes. */
    }
    /* Safety net: the engine normally writes inline calc() geometry on
       each shell; if that is ever momentarily absent (drag-end style
       restore, container var churn) the shell would collapse to a
       point. Fall back to the per-item --gs-x/y/w/h vars the engine
       always keeps, at the px cell pitch (--cell-w/--cell-h are set by
       JS on #pageHome). Inline styles still win over this rule.
       NOTE: left needs the same :not(.grid-stack-rtl) selector the
       vendored left:0 rule uses — a plain 2-class selector loses that
       specificity fight and the shell collapses to the left edge. */
    .grid-stack>.grid-stack-item{
      top:calc(var(--gs-y,0) * var(--cell-h,90px));
      width:calc(var(--gs-w,1) * var(--cell-w,90px));
      height:calc(var(--gs-h,1) * var(--cell-h,90px));
    }
    .grid-stack:not(.grid-stack-rtl)>.grid-stack-item{
      left:calc(var(--gs-x,0) * var(--cell-w,90px));
    }
    /* Tiles fill their cell — the shell dictates the size. (Same
       selector as the vendored content rule, later in source order,
       so it wins: the app's cards clip, they never scroll inside.) */
    .grid-stack>.grid-stack-item>.grid-stack-item-content{overflow:hidden;}
    .home-tile{min-width:0;}
    #newsStrip{
      animation:cardReveal .7s var(--ease-out) calc(var(--boot-delay) + .15s) backwards;}
    #avatarPanel{
      animation:cardReveal .7s var(--ease-out) calc(var(--boot-delay) + .22s) backwards;}
    #navSection{
      animation:cardReveal .7s var(--ease-out) calc(var(--boot-delay) + .3s) backwards;}
    #stockTile{
      animation:cardReveal .7s var(--ease-out) calc(var(--boot-delay) + .38s) backwards;}
    #streamWidget{
      animation:cardReveal .7s var(--ease-out) calc(var(--boot-delay) + .46s) backwards;}

    /* arrange mode: drag grips + placement affordances */
    #pageHome.arranging{overflow:hidden;}
    #pageHome.arranging .home-tile{
      touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab;
      outline:1px dashed rgba(255,255,255,.22);outline-offset:4px;
    }
    #pageHome.arranging .home-tile>*{pointer-events:none;}
    #pageHome.arranging .tile-grip{pointer-events:auto;cursor:grab;}
    body.home-arranging{cursor:grabbing;}
    body.home-arranging *{user-select:none;-webkit-user-select:none;}

    /* Drag grip — Gridstack's drag handle (handle:'.tile-grip'),
       revealed only while arranging. */
    .tile-grip{
      position:absolute;top:8px;left:50%;transform:translateX(-50%);
      z-index:8;width:44px;height:20px;border-radius:999px;
      display:none;align-items:center;justify-content:center;gap:4px;
      background:rgba(10,10,12,.66);border:1px solid rgba(255,255,255,.24);
      backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
      cursor:grab;touch-action:none;
    }
    .tile-grip i{width:3px;height:3px;border-radius:50%;background:rgba(255,255,255,.8);}
    #pageHome.arranging .tile-grip{display:flex;}

    /* Light placement grid — visible only while arranging. Covers the
       content area; --cell-w/--cell-h are set by JS from the live grid
       metrics so the lines sit on the cell edges. */
    #pageHome::after{
      content:'';position:absolute;
      top:var(--hy);left:var(--hx);right:var(--hxr);bottom:var(--hb,140px);
      pointer-events:none;z-index:5;
      background-image:
        linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px),
        linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px);
      background-size:var(--cell-w,96px) var(--cell-h,90px);
      opacity:0;transition:opacity .25s var(--ease-out);
    }
    #pageHome.arranging::after{opacity:1;}

    /* Gridstack chrome restyled to the app's look: the landing slot
       (replaces the old drop ghost), the lifted tile, and the corner
       resize handle. */
    .grid-stack-placeholder>.placeholder-content{
      background:hsl(var(--h) var(--acc-sat) var(--acc-lum) /.06);
      border:2px dashed hsl(var(--h) var(--acc-sat) var(--acc-lum) /.6);
      border-radius:18px;
    }
    .grid-stack-item.ui-draggable-dragging>.grid-stack-item-content{
      box-shadow:0 24px 48px rgba(0,0,0,.5),var(--tile-shadow);
      outline:1px dashed rgba(255,255,255,.55);outline-offset:6px;
      opacity:1;
    }
    .grid-stack-item>.ui-resizable-se{
      width:26px;height:26px;
      bottom:calc(var(--gs-item-margin-bottom) + 4px);
      right:calc(var(--gs-item-margin-right) + 4px);
      background-image:none;transform:none;
      border-right:2px solid rgba(255,255,255,.55);
      border-bottom:2px solid rgba(255,255,255,.55);
      border-bottom-right-radius:14px;
      opacity:.75;
    }
    .arrange-done{
      /* Right edge, centered in the vertical gap between the page rail
         (bottom edge at 50% + 76px) and the fullscreen button (top edge
         52px up) — midpoint = 25% of viewport height minus half the
         gap; translateY(50%) centers the button on that point.
         "DONE" spelled vertically; frosted glass + corner radius match
         the rail, muted→bright text and press feedback match fs-btn.
         36px wide = fs-btn diameter; flex centers the letter stack.
         z above gridstack's .ui-draggable-dragging (10000) so dragged
         tiles pass UNDER it. */
      position:fixed;right:14px;bottom:calc(25% - 12px);
      transform:translateY(50%);
      z-index:10001;pointer-events:none;opacity:0;
      width:36px;box-sizing:border-box;
      display:flex;align-items:center;justify-content:center;
      border:1px solid rgba(255,255,255,.10);border-radius:20px;
      padding:14px 0;
      background:rgba(20,20,26,.32);
      backdrop-filter:blur(12px) saturate(1.2);
      -webkit-backdrop-filter:blur(12px) saturate(1.2);
      box-shadow:0 10px 26px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.06);
      color:var(--muted);font-size:12px;font-weight:700;letter-spacing:.14em;
      text-transform:uppercase;cursor:pointer;
      writing-mode:vertical-rl;text-orientation:upright;
      transition:
        background .25s var(--ease-smooth),
        border-color .25s var(--ease-smooth),
        color .25s var(--ease-smooth),
        transform .35s var(--ease-spring),
        opacity .18s var(--ease-out);
    }
    .arrange-done:hover{
      color:var(--text);
      border-color:rgba(255,255,255,.28);
      background:rgba(255,255,255,.07);
    }
    .arrange-done:active{
      background:var(--accent-soft);border-color:var(--accent);color:#fff;
      transform:translateY(50%) scale(.92);
    }
    .arrange-done.show{opacity:1;pointer-events:auto;}

    /* ── NEWS — full-bleed story carousel ──
       The active story's photo fills the whole tile; a left-weighted
       scrim keeps the overlaid copy readable. Source chip top-left,
       headline block bottom-left, segmented progress along the bottom
       edge, hover arrows on the sides. fitNewsTile() feeds --npad/--nt/
       --ncpt/--ntl from the live tile size. */
    .news-strip{
      --npad:20px;
      position:relative;
      min-width:0;
      margin:0;
      border:1px solid var(--border);
      border-radius:18px;
      overflow:hidden;
      background:#0d0e12;
    }
    .news-track{
      position:absolute;inset:0;
      touch-action:pan-y;
    }
    /* while a touch-drag is in flight the cards follow the finger
       directly instead of running their snap transition */
    .news-strip.news-dragging .news-slide{
      transition:opacity .5s var(--ease-smooth),visibility 0s;
    }
    /* Multi-card carousel: the active story sits large on the left,
       the next two peek beside it — several stories visible at once.
       Click a side card to bring it forward. fitNewsTile() steps down
       to featured + one peek (peek-1) on medium tiles and only drops
       to a single full-bleed card (no-side) on tiny ones. */
    .news-slide{
      position:absolute;top:0;bottom:0;left:0;width:100%;
      opacity:0;visibility:hidden;
      transform:translateX(26px) scale(.94);
      transition:opacity .5s var(--ease-smooth),transform .6s var(--ease-spring),
        left .6s var(--ease-spring),width .6s var(--ease-spring),visibility 0s linear .5s;
      pointer-events:none;
      border-radius:10px;
      overflow:hidden;
    }
    .news-slide.pos-0{
      left:0;width:54%;
      opacity:1;visibility:visible;transform:none;
      pointer-events:auto;cursor:pointer;z-index:2;
      transition:opacity .5s var(--ease-smooth),transform .6s var(--ease-spring),
        left .6s var(--ease-spring),width .6s var(--ease-spring),visibility 0s;
    }
    .news-slide.pos-1{
      left:56.5%;width:21%;
      opacity:1;visibility:visible;transform:none;
      pointer-events:auto;cursor:pointer;z-index:1;
      transition:opacity .5s var(--ease-smooth),transform .6s var(--ease-spring),
        left .6s var(--ease-spring),width .6s var(--ease-spring),visibility 0s;
    }
    .news-slide.pos-2{
      left:79.5%;width:20.5%;
      opacity:1;visibility:visible;transform:none;
      pointer-events:auto;cursor:pointer;z-index:1;
      transition:opacity .5s var(--ease-smooth),transform .6s var(--ease-spring),
        left .6s var(--ease-spring),width .6s var(--ease-spring),visibility 0s;
    }
    /* medium tiles: featured + one peek card */
    .news-strip.peek-1 .news-slide.pos-0{left:0;width:64%;}
    .news-strip.peek-1 .news-slide.pos-1{left:68%;width:32%;}
    .news-strip.peek-1 .news-slide.pos-2{opacity:0;pointer-events:none;}
    /* tiny tiles: one full-bleed story, no side cards */
    .news-strip.no-side .news-slide.pos-0{left:0;width:100%;}
    .news-strip.no-side .news-slide.pos-1,
    .news-strip.no-side .news-slide.pos-2{opacity:0;pointer-events:none;}
    /* ken-burns drift on the featured photo */
    @keyframes newsDrift{from{transform:scale(1.07);}to{transform:scale(1);}}
    .news-slide.pos-0 .news-img{animation:newsDrift 9s linear forwards;}
    /* side cards: photo + title only */
    .news-slide.pos-1 .news-chip,
    .news-slide.pos-2 .news-chip,
    .news-slide.pos-1 .news-desc,
    .news-slide.pos-2 .news-desc,
    .news-slide.pos-1 .news-cta,
    .news-slide.pos-2 .news-cta{display:none;}
    .news-slide.pos-1 .news-shade,
    .news-slide.pos-2 .news-shade{
      background:linear-gradient(to top,rgba(6,8,12,.92) 0%,rgba(6,8,12,.28) 55%,transparent 100%);
    }
    .news-slide.pos-1 .news-body,
    .news-slide.pos-2 .news-body{
      left:10px;right:10px;bottom:10px;gap:0;
    }
    .news-slide.pos-1 .news-title,
    .news-slide.pos-2 .news-title{
      font-size:12px;font-weight:700;line-height:1.3;
      -webkit-line-clamp:3;
    }
    .news-slide.pos-1:hover,
    .news-slide.pos-2:hover{filter:brightness(1.15);}
    .news-img{
      position:absolute;inset:0;width:100%;height:100%;
      object-fit:cover;display:block;
    }
    /* scrims: left-weighted wash for the copy, top band for the chip,
       bottom band for the progress bar */
    .news-shade{
      position:absolute;inset:0;pointer-events:none;
      background:
        linear-gradient(100deg,rgba(6,8,12,.94) 0%,rgba(6,8,12,.8) 32%,rgba(6,8,12,.32) 58%,rgba(6,8,12,.16) 76%,rgba(6,8,12,.5) 100%),
        linear-gradient(180deg,rgba(6,8,12,.5) 0%,transparent 24%),
        linear-gradient(to top,rgba(6,8,12,.66) 0%,transparent 30%);
    }
    /* source + age chip */
    .news-chip{
      position:absolute;top:var(--npad);left:var(--npad);z-index:3;
      display:inline-flex;align-items:center;gap:7px;
      max-width:calc(100% - var(--npad) * 2);
      height:26px;padding:0 12px;border-radius:999px;
      background:rgba(8,10,14,.42);
      border:1px solid rgba(255,255,255,.16);
      backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
      font-size:10px;font-weight:700;letter-spacing:.09em;
      text-transform:uppercase;color:rgba(255,255,255,.92);
      white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    }
    .news-chip::before{
      content:'';flex:0 0 auto;
      width:6px;height:6px;border-radius:50%;
      background:var(--accent);
      box-shadow:0 0 10px hsl(var(--h) var(--acc-sat) var(--acc-lum) /.55);
    }
    /* headline block */
    .news-body{
      position:absolute;left:var(--npad);right:var(--npad);
      bottom:calc(var(--npad) + 16px);z-index:2;
      display:flex;flex-direction:column;align-items:flex-start;gap:9px;
    }
    .news-title{
      margin:0;
      font-size:var(--nt,22px);font-weight:800;line-height:1.16;letter-spacing:-.025em;
      color:#fff;
      text-shadow:0 2px 18px rgba(0,0,0,.6),0 1px 2px rgba(0,0,0,.5);
      display:-webkit-box;-webkit-line-clamp:var(--ntl,2);-webkit-box-orient:vertical;
      overflow:hidden;
    }
    .news-desc{
      margin:0;max-width:min(62ch,100%);
      font-size:var(--ncpt,13px);font-weight:400;line-height:1.45;
      color:rgba(238,242,250,.78);
      text-shadow:0 1px 10px rgba(0,0,0,.65);
      display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
      overflow:hidden;
    }
    .news-cta{
      margin-top:2px;
      display:inline-flex;align-items:center;gap:6px;
      height:32px;padding:0 15px;border-radius:999px;
      background:rgba(255,255,255,.13);
      border:1px solid rgba(255,255,255,.22);
      backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
      font-family:inherit;font-size:12px;font-weight:700;color:#fff;
      cursor:pointer;
      transition:background .25s var(--ease-smooth),gap .3s var(--ease-spring),transform .2s var(--ease-spring);
    }
    .news-cta svg{width:13px;height:13px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;}
    .news-slide.pos-0:hover .news-cta{background:rgba(255,255,255,.24);gap:9px;}
    .news-cta:active{transform:scale(.95);}
    /* Small tiles: drop the desc / CTA / arrows / progress rather than
       let the copy crush (fitNewsTile toggles these). */
    .news-strip.no-desc .news-desc{display:none;}
    .news-strip.no-cta .news-cta{display:none;}
    .news-strip.no-nav .news-nav{display:none;}
    .news-strip.no-progress .news-progress{display:none;}
    /* edge arrows — revealed on hover (always visible on touch) */
    .news-nav{
      position:absolute;top:50%;z-index:4;
      width:36px;height:36px;border-radius:999px;
      transform:translateY(-50%) scale(.8);
      display:flex;align-items:center;justify-content:center;
      appearance:none;border:1px solid rgba(255,255,255,.18);cursor:pointer;
      background:rgba(8,10,14,.5);color:#fff;
      backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
      opacity:0;pointer-events:none;
      transition:opacity .3s var(--ease-smooth),transform .35s var(--ease-spring),background .2s var(--ease-smooth);
    }
    .news-nav svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
    .news-prev{left:12px;}
    .news-next{right:12px;}
    .news-strip:hover .news-nav,
    .news-nav:focus-visible{opacity:1;pointer-events:auto;transform:translateY(-50%) scale(1);}
    .news-nav:hover{background:rgba(255,255,255,.16);}
    .news-nav:active{transform:translateY(-50%) scale(.9);}
    @media (hover:none){
      .news-nav{opacity:1;pointer-events:auto;transform:translateY(-50%) scale(1);}
    }
    /* segmented progress — sits under the featured card; the active
       segment fills over the dwell time */
    .news-progress{
      position:absolute;left:var(--npad);bottom:var(--npad);
      width:calc(54% - var(--npad) * 2);
      z-index:3;display:flex;align-items:center;gap:5px;pointer-events:none;
    }
    .news-strip.peek-1 .news-progress{width:calc(64% - var(--npad) * 2);}
    .news-strip.no-side .news-progress{width:calc(100% - var(--npad) * 2);}
    .news-pip{
      flex:1 1 0;min-width:0;height:3px;border-radius:999px;
      background:rgba(255,255,255,.22);overflow:hidden;
    }
    .news-pip i{display:block;height:100%;width:0;border-radius:999px;background:#fff;}
    .news-pip.done i{width:100%;}
    .news-idx{color:var(--accent);font-variant-numeric:tabular-nums;letter-spacing:.04em;}
    .news-time{font-variant-numeric:tabular-nums;color:var(--muted2);text-transform:none;letter-spacing:0;font-weight:500;}
    /* loading skeleton — same shape as a slide (photo + copy block) */
    .news-skeleton{position:absolute;inset:0;}
    .news-skel-img{
      position:absolute;inset:0;
      background:rgba(255,255,255,0.06);
      animation:pulse .9s ease infinite;
    }
    .news-skel-copy{
      position:absolute;left:var(--npad);right:var(--npad);
      bottom:calc(var(--npad) + 16px);
      display:flex;flex-direction:column;gap:12px;
    }
    .news-skel-bar{
      height:11px;border-radius:999px;
      background:rgba(255,255,255,0.10);
      animation:pulse .9s ease infinite;
    }
    @keyframes pulse{0%,100%{opacity:.35}50%{opacity:.8}}
    .news-error{
      position:absolute;inset:0;z-index:5;
      display:flex;flex-direction:column;
      align-items:center;justify-content:center;
      gap:12px;padding:20px;text-align:center;
      background:
        radial-gradient(60% 60% at 50% 30%,hsl(var(--h) var(--acc-sat) var(--acc-lum) /.10),transparent 65%),
        #0d0e12;
    }
    .news-error p{font-size:12px;color:var(--muted);max-width:300px;line-height:1.6;margin:0;}
    .news-retry-btn{
      padding:9px 16px;border:1px solid var(--border-em);
      border-radius:999px;background:rgba(255,255,255,.04);cursor:pointer;
      font-family:'Inter',sans-serif;font-size:11px;font-weight:700;
      color:var(--muted);transition:background .15s,color .15s,border-color .15s;
    }
    .news-retry-btn:active{background:var(--accent-soft);border-color:var(--accent);color:#fff;}
    .news-ph{
      position:absolute;inset:0;
      display:flex;align-items:center;justify-content:center;
      font-size:34px;font-weight:800;letter-spacing:.06em;
      color:rgba(255,255,255,.20);
      background:
        radial-gradient(140px 90px at 72% 28%,hsl(var(--h) var(--acc-sat) var(--acc-lum) /.28),transparent 70%),
        linear-gradient(160deg,hsl(var(--h) var(--acc-sat) var(--acc-lum) /.10),rgba(0,0,0,.42));
    }
    @media (prefers-reduced-motion:reduce){
      .news-slide,.news-slide.pos-0,.news-slide.pos-1,.news-slide.pos-2{
        transition:opacity .3s linear;transform:none;
      }
      .news-slide.pos-0 .news-img{animation:none;}
    }

    /* ── AVATAR PANEL ── */
    .avatar-panel{
      flex:0 0 200px;
      min-height:230px;
      border:1px solid var(--border);
      border-radius:18px;
      background:
        linear-gradient(180deg,hsl(var(--h) var(--acc-sat) var(--acc-lum) /.08),transparent 42%),
        var(--surface);
      box-shadow:var(--tile-shadow);
      display:flex;
      flex-direction:column;
      overflow:hidden;
      position:relative;
    }
    .avatar-panel::before{
      content:'';
      position:absolute;
      top:0;left:0;right:0;height:1px;
      background:rgba(255,255,255,.08);
      z-index:2;
      pointer-events:none;
    }
    .avatar-panel-head{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:8px;
      padding:11px 14px;
      border-bottom:1px solid var(--border);
      font-size:10px;
      font-weight:800;
      letter-spacing:.14em;
      text-transform:uppercase;
      color:var(--accent);
      background:var(--surface);
    }
    .avatar-head-dot{
      width:8px;height:8px;border-radius:50%;
      background:var(--muted2);
      box-shadow:0 0 0 0 hsl(var(--h) var(--acc-sat) var(--acc-lum) /0);
      transition:background .3s var(--ease-smooth),box-shadow .3s var(--ease-smooth);
    }
    .avatar-head-dot.ok{
      background:var(--accent);
      box-shadow:0 0 12px hsl(var(--h) var(--acc-sat) var(--acc-lum) /.5);
      animation:ping 1.4s ease-out infinite;
    }
    .avatar-stage{
      flex:1;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:12px 12px 4px;
      position:relative;
      background:
        radial-gradient(60% 50% at 50% 35%, hsl(var(--h) var(--acc-sat) var(--acc-lum) /.12), transparent 65%),
        radial-gradient(50% 40% at 75% 75%, rgba(139,92,246,.08), transparent 70%),
        var(--surface-em);
      overflow:hidden;
    }
    .avatar-sprite{
      /* fluid: grows with the resizable tile, capped so pixel art stays crisp */
      width:min(100%,240px);
      height:auto;
      aspect-ratio:1;
      max-width:100%;
      max-height:100%;
      overflow:visible;
      display:block;
    }
    .avatar-meta{
      padding:10px 14px 12px;
      border-top:1px solid var(--border);
      display:flex;
      flex-direction:column;
      gap:4px;
      background:var(--surface);
    }
    .avatar-mood{
      font-size:12px;
      font-weight:800;
      color:#fff;
      letter-spacing:.02em;
    }
    .avatar-info{
      font-size:10px;
      color:var(--muted);
      font-variant-numeric:tabular-nums;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    /* ── NEW SPRITE AVATAR ── */
    #avatarCanvas {
      width: min(100%, 240px);
      height: auto;
      aspect-ratio: 1;
      max-width: 100%;
      max-height: 100%;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      background: transparent;
    }

    .avatar-panel[data-speed="moving"] #avatarCanvas {
      filter: drop-shadow(0 0 8px hsl(var(--h) var(--acc-sat) var(--acc-lum) / 0.25));
    }

    .avatar-panel[data-speed="fast"] #avatarCanvas {
      filter: drop-shadow(0 0 14px hsl(var(--h) var(--acc-sat) var(--acc-lum) / 0.45));
    }

    .avatar-panel[data-weather="storm"] #avatarCanvas {
      filter: drop-shadow(0 0 10px rgba(255, 69, 58, 0.35));
    }

    .avatar-panel[data-weather="rain"] #avatarCanvas {
      filter: drop-shadow(0 0 8px rgba(59, 130, 246, 0.35));
    }

    .avatar-panel[data-weather="snow"] #avatarCanvas {
      filter: drop-shadow(0 0 8px rgba(255, 255, 255, 0.25));
    }

    .avatar-panel[data-weather="evolve"] #avatarCanvas {
      filter: drop-shadow(0 0 14px hsl(var(--h) var(--acc-sat) var(--acc-lum) / 0.65));
    }

    .avatar-stage.evolving {
      animation:evolveFlash .55s ease-out 3;
    }

    @keyframes evolveFlash {
      0%   { box-shadow: inset 0 0 0 0 hsl(var(--h) var(--acc-sat) var(--acc-lum) / 0); }
      35%  { box-shadow: inset 0 0 34px 8px hsl(var(--h) var(--acc-sat) var(--acc-lum) / 0.45); }
      100% { box-shadow: inset 0 0 0 0 hsl(var(--h) var(--acc-sat) var(--acc-lum) / 0); }
    }

    .avatar-panel[data-weather="hatch"] #avatarCanvas {
      filter: drop-shadow(0 0 14px rgba(255, 214, 90, 0.75));
    }

    /* Egg inside its pre-hatch window: gentle gold glow pulsing in the stage. */
    .avatar-stage.hatch-pulse {
      animation:hatchPulse 1.6s ease-in-out infinite;
    }

    @keyframes hatchPulse {
      0%   { box-shadow: inset 0 0 0 0 rgba(255, 214, 90, 0); }
      50%  { box-shadow: inset 0 0 30px 6px rgba(255, 214, 90, 0.4); }
      100% { box-shadow: inset 0 0 0 0 rgba(255, 214, 90, 0); }
    }

    /* One big gold burst the moment the egg hatches. */
    .avatar-stage.hatching {
      animation:hatchBurst 1.1s ease-out 1;
    }

    @keyframes hatchBurst {
      0%   { box-shadow: inset 0 0 0 0 rgba(255, 244, 200, 0); }
      40%  { box-shadow: inset 0 0 60px 24px rgba(255, 214, 90, 0.9); }
      100% { box-shadow: inset 0 0 0 0 rgba(255, 244, 200, 0); }
    }

    /* Retire burst: the final form leaves the stage for the nav rail. */
    .avatar-stage.retiring {
      animation:retireBurst 1.1s ease-out 1;
    }

    @keyframes retireBurst {
      0%   { box-shadow: inset 0 0 0 0 hsl(var(--h) var(--acc-sat) var(--acc-lum) / 0); }
      40%  { box-shadow: inset 0 0 60px 24px hsl(var(--h) var(--acc-sat) var(--acc-lum) / 0.6); }
      100% { box-shadow: inset 0 0 0 0 hsl(var(--h) var(--acc-sat) var(--acc-lum) / 0); }
    }

    /* ── AVATAR RAIL — its own frosted card above the page rail, holding
       the collected final forms. Tap a slot to swap it with the stage. ── */
    .avatar-rail{
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:8px;
      padding:6px;
      max-height:45vh;
      overflow-y:auto;
      overflow-x:hidden;
      touch-action:pan-y;
      scrollbar-width:thin;
      scrollbar-color:hsl(var(--h) var(--acc-sat) var(--acc-lum) /.4) transparent;
      background:rgba(20,20,26,.32);
      backdrop-filter:blur(12px) saturate(1.2);
      -webkit-backdrop-filter:blur(12px) saturate(1.2);
      border:1px solid rgba(255,255,255,.10);
      border-radius:20px;
      box-shadow:0 10px 26px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.06);
    }
    .avatar-rail[hidden]{display:none;}
    .avatar-rail::-webkit-scrollbar{width:4px;}
    .avatar-rail::-webkit-scrollbar-thumb{background:hsl(var(--h) var(--acc-sat) var(--acc-lum) /.4);border-radius:2px;}
    .rail-avatar-slot{
      position:relative;
      flex:0 0 auto;
      width:40px;height:40px;
      padding:2px;
      border:1px solid rgba(255,255,255,.14);
      border-radius:12px;
      background:rgba(255,255,255,.05);
      display:flex;align-items:center;justify-content:center;
      cursor:pointer;
      transition:border-color .2s var(--ease-smooth),box-shadow .2s var(--ease-smooth),transform .2s var(--ease-smooth);
    }
    .rail-avatar-slot canvas{
      width:34px;height:34px;
      display:block;
      image-rendering:pixelated;
      image-rendering:crisp-edges;
    }
    .rail-avatar-slot.newest{border-color:hsl(var(--h) var(--acc-sat) var(--acc-lum) /.55);}
    .rail-avatar-slot.selected{
      border-color:var(--accent);
      box-shadow:0 0 10px hsl(var(--h) var(--acc-sat) var(--acc-lum) /.45);
      transform:scale(1.08);
    }
    /* Slot whose sprite is mid-flight to/from the widget. */
    .rail-avatar-slot.ghost{
      border-style:dashed;
      border-color:rgba(255,255,255,.28);
      background:transparent;
    }
    .rail-avatar-slot.ghost canvas{visibility:hidden;}
    @keyframes slotPop{
      0%{transform:scale(.4);opacity:0;}
      70%{transform:scale(1.12);opacity:1;}
      100%{transform:scale(1);opacity:1;}
    }
    .rail-avatar-slot.pop canvas{animation:slotPop .35s var(--ease-spring) 1;}
    .avatar-hold-count{
      font-size:9px;
      color:var(--muted);
      letter-spacing:.08em;
    }

    /* Widget stage cleared while an avatar is in flight to/from the rail. */
    .avatar-stage.stage-empty .avatar-sprite{opacity:0;transition:opacity .12s ease-out;}
    @keyframes stagePop{
      0%{transform:scale(.5);opacity:0;}
      70%{transform:scale(1.08);opacity:1;}
      100%{transform:scale(1);opacity:1;}
    }
    .avatar-stage.stage-pop .avatar-sprite{animation:stagePop .4s var(--ease-spring) 1;}

    /* ── COMET TRAILS — white streak flights between widget and rail ── */
    #trailLayer{position:fixed;inset:0;z-index:700;pointer-events:none;}
    .trail-comet{
      position:absolute;left:0;top:0;
      width:34px;height:34px;
      will-change:transform;
    }
    .trail-comet canvas{
      width:34px;height:34px;
      display:block;
      image-rendering:pixelated;
      image-rendering:crisp-edges;
      filter:drop-shadow(0 0 6px rgba(255,255,255,.85));
    }
    /* White streak laid behind the sprite, rotated to the flight heading. */
    .trail-comet i.trail-tail{
      position:absolute;right:50%;top:50%;
      width:var(--trail-len,70px);height:6px;
      margin-top:-3px;
      transform:rotate(var(--trail-angle,180deg));
      transform-origin:100% 50%;
      border-radius:3px;
      background:linear-gradient(to left,rgba(255,255,255,.8),rgba(255,255,255,0));
      filter:blur(2px);
    }

    @media (max-width:1100px){
      .avatar-panel{min-height:210px;}
      .avatar-sprite,#avatarCanvas{width:min(100%,160px);}
    }
    @media (max-width:720px){
      #pageHome{--hx:16px;--hy:14px;--hxr:100px;}
      .avatar-panel{min-height:190px;}
      .avatar-sprite,#avatarCanvas{width:min(100%,130px);}
    }
    @media (max-width:520px){
      .avatar-panel{min-height:160px;}
    }

    /* ── NAV MAP TILE (live TeslaNav map — seamless, no chrome) ── */
    /* Register the framing vars so they can transition. Unregistered,
       toggling .expanded snaps them instantly while the tile box
       animates — and since the iframe derives its size/transform from
       these vars + the tile's 100%, the map content jumped 2.7× in a
       single frame before the tile started moving. Registered, they
       interpolate on the same 180ms clock as the box (transition
       below), so the morph is one continuous zoom/reveal.
       Needs Chromium 85+ / Safari 16.4+ / Firefox 128+; older
       browsers ignore @property and get the previous snap behavior. */
    @property --nav-zoom{syntax:"<number>";inherits:true;initial-value:.7;}
    @property --crop-l{syntax:"<length>";inherits:true;initial-value:410px;}
    @property --crop-r{syntax:"<length>";inherits:true;initial-value:250px;}
    @property --crop-t{syntax:"<length>";inherits:true;initial-value:110px;}
    @property --crop-b{syntax:"<length>";inherits:true;initial-value:120px;}
    .nav-section{
      --nav-zoom:.7;
      /* Collapsed: the app's edge UI is cropped out — map only.
         Crop values are in the app's own px, measured from its layout
         (github.com/R44VC0RP/teslanav.com, app/page.tsx):
         l = bottom control row (brand + settings/feedback/satellite, ~385px)
         r = zoom + theme cluster (~232px)
         t = support button + compass (~90px)
         b = control row height (~88px)
         Retune if the upstream app's chrome changes. */
      --crop-l:410px;
      --crop-r:250px;
      --crop-t:110px;
      --crop-b:120px;
      border:1px solid var(--border);
      border-radius:18px;
      overflow:hidden;
      background:var(--bg-raised);
      /* The map framing vars ride the same 180ms clock as the shell
         box (see @property above + setNavExpanded's JS pins). The box
         itself is Gridstack's (the shell animates via
         .grid-stack-animate); only the vars transition here. */
      transition:--nav-zoom .18s var(--ease-out),--crop-l .18s var(--ease-out),--crop-r .18s var(--ease-out),--crop-t .18s var(--ease-out),--crop-b .18s var(--ease-out);
    }
    /* While the JS morph (setNavExpanded) is running, the shell box and
       framing vars are pinned inline per frame — CSS transitions must
       stay out of the way so the two never fight over the same props. */
    .nav-section.nav-morphing{transition:none;}
    #navItem.nav-morphing{transition:none!important;}
    /* The wrapper carries the zoom as a pure-GPU transform during the
       morph. The cross-origin map re-renders on every iframe resize,
       so resizing the iframe ~12 times mid-animation was what made the
       morph choppy — instead the iframe is frozen at a fixed size and
       this wrapper scales/pans the already-rasterized layer. */
    .nav-frame-wrap{
      position:absolute;inset:0;
      transform-origin:top left;
    }
    /* TeslaNav is a full-screen app: render a virtual viewport bigger
       than the tile and show only the map's center, so the edge UI
       falls outside the visible window (the map stays pannable).
       Same family of trick as the chat panel's iframe scaling.
       Tune: --nav-zoom (lower = smaller UI) and --crop-* (hide more). */
    .nav-section iframe{
      position:absolute;top:0;left:0;
      width:calc((100% + var(--nav-zoom) * (var(--crop-l) + var(--crop-r))) / var(--nav-zoom));
      height:calc((100% + var(--nav-zoom) * (var(--crop-t) + var(--crop-b))) / var(--nav-zoom));
      border:none;display:block;
      transform:translate(
        calc(-1 * var(--nav-zoom) * var(--crop-l)),
        calc(-1 * var(--nav-zoom) * var(--crop-t))
      ) scale(var(--nav-zoom));
      transform-origin:top left;
      /* NOTE: no transition here — this browser sticks width/transform
         transitions on var()-derived targets. During the expand/collapse
         morph the JS driver (setNavExpanded) freezes this iframe at a
         fixed size and animates the .nav-frame-wrap transform instead —
         the map never resizes mid-animation. The registered
         --nav-zoom/--crop-* transitions on the tile remain as the
         fallback for any path that toggles .expanded without the JS
         morph (the iframe then recomputes size/transform per frame). */
    }
    /* Expanded: the nav SHELL grows to fill the whole grid box in place —
       one iframe instance, it never reloads. The grid slot itself is
       untouched (the shell's inline left/top/width/height are overridden
       while .expanded), so collapsing hands the original cell right back. */
    #navItem.expanded{
      left:0 !important;
      top:0 !important;
      width:100% !important;
      height:100% !important;
      z-index:40 !important;
    }
    .nav-section.expanded{
      /* 0.65×: the whole app (map + its UI) renders 35% smaller while
         filling the content area — a wider map view when expanded.
         Crops stay 0 so the app's controls
         remain in frame (top-left framing; the JS morph picks these
         values up automatically). */
      --nav-zoom:.65;
      --crop-l:0px;
      --crop-r:0px;
      --crop-t:0px;
      --crop-b:0px;
    }
    /* Corner control: hover-reveal on pointer devices, always tappable
       on touch (the car). */
    .nav-expand{
      position:absolute;top:12px;right:12px;z-index:6;
      width:34px;height:34px;border-radius:999px;
      border:1px solid rgba(255,255,255,.18);
      background:rgba(10,10,12,.66);
      backdrop-filter:blur(10px);
      -webkit-backdrop-filter:blur(10px);
      color:#fff;cursor:pointer;
      display:flex;align-items:center;justify-content:center;
      opacity:0;transform:scale(.85);
      pointer-events:none;
      transition:opacity .18s var(--ease-out),transform .22s var(--ease-spring),
                 background .15s,border-color .15s;
    }
    .nav-section:hover .nav-expand,
    .nav-section.expanded .nav-expand{
      opacity:1;transform:scale(1);
      pointer-events:auto;
    }
    @media (hover:none){
      .nav-expand{opacity:.75;transform:scale(1);pointer-events:auto;}
    }
    .nav-expand:hover{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.32);}
    .nav-expand:active{transform:scale(.9);}
    .nav-expand svg{
      width:15px;height:15px;fill:none;stroke:currentColor;
      stroke-width:2;stroke-linecap:round;stroke-linejoin:round;
    }
    .nav-expand .ic-collapse{display:none;}
    .nav-section.expanded .ic-expand{display:none;}
    .nav-section.expanded .ic-collapse{display:block;}
    /* Transparent grab surface: the cross-origin iframe swallows every
       pointer event, so without it the tile could never be held/dragged.
       Collapsed: the layer is ALWAYS live — the 420ms hold that starts
       arrange mode must reach the tile (the iframe would eat it).
       Trade-off: the small map can't be panned while collapsed —
       expand it to pan.
       Expanded: the layer steps aside so the full-size map is fully
       pannable; collapse it (corner button) to move the tile. */
    .nav-drag-layer{
      position:absolute;inset:0;z-index:5;
      pointer-events:auto;
      cursor:grab;
    }
    .nav-section.expanded .nav-drag-layer{
      pointer-events:none;cursor:default;
    }
    #pageHome.arranging #navSection>.nav-drag-layer{
      pointer-events:auto;
      cursor:grab;
    }

    /* ── NEWS POPUP ── */
    .news-pop{
      position:fixed;inset:0;z-index:420;
      display:flex;align-items:center;justify-content:center;
      padding:28px;
      background:rgba(0,0,0,.72);
      -webkit-backdrop-filter:blur(14px);
      backdrop-filter:blur(14px);
      opacity:0;visibility:hidden;pointer-events:none;
      transition:opacity .32s var(--ease-smooth),visibility .32s var(--ease-smooth);
    }
    .news-pop.open{opacity:1;visibility:visible;pointer-events:auto;}
    .news-pop-card{
      width:min(720px,100%);
      max-height:min(86vh,780px);
      background:#121216;
      border:1px solid var(--border-em);
      border-radius:22px;
      overflow:hidden;
      display:flex;flex-direction:column;
      box-shadow:0 30px 80px rgba(0,0,0,.58),var(--tile-shadow);
      transform:translateY(18px) scale(.96);
      opacity:.7;
      transition:transform .42s var(--ease-spring),opacity .32s var(--ease-out);
    }
    .news-pop.open .news-pop-card{transform:none;opacity:1;}
    .news-pop-img{
      position:relative;flex:0 0 260px;min-height:190px;
      background:
        linear-gradient(160deg,hsl(var(--h) var(--acc-sat) var(--acc-lum) /.22),rgba(0,0,0,.35)),
        var(--surface-em);
      overflow:hidden;
    }
    .news-pop-img img{
      width:100%;height:100%;object-fit:cover;display:block;
    }
    .news-pop-img::after{
      content:'';position:absolute;left:0;right:0;bottom:0;height:72px;
      background:linear-gradient(to top,#121216,transparent);
      pointer-events:none;
    }
    .news-pop-body{
      padding:10px 26px 24px;
      display:flex;flex-direction:column;gap:12px;
      overflow:auto;
      min-height:0;
    }
    .news-pop-meta{
      display:flex;align-items:center;gap:8px;
      font-size:11px;font-weight:700;letter-spacing:.08em;
      text-transform:uppercase;color:var(--muted);
    }
    .news-pop-meta .news-idx{color:var(--accent);}
    .news-pop-title{
      font-size:26px;font-weight:800;line-height:1.2;letter-spacing:-.03em;
      color:var(--text);
    }
    .news-pop-desc{
      font-size:15px;font-weight:400;line-height:1.55;
      color:rgba(255,255,255,.68);
    }
    .news-pop-actions{display:flex;gap:12px;margin-top:8px;}
    .news-pop-open{
      appearance:none;border:none;cursor:pointer;
      height:44px;padding:0 20px;border-radius:999px;
      background:var(--accent);color:#062B12;
      font-family:inherit;font-size:13px;font-weight:800;letter-spacing:.02em;
      box-shadow:var(--accent-glow);
      transition:transform .3s var(--ease-spring),filter .2s var(--ease-smooth);
    }
    .news-pop-open:hover{filter:brightness(1.05);}
    .news-pop-open:active{transform:scale(.96);}
    .news-pop-hint{
      margin-left:auto;align-self:center;
      font-size:11px;color:var(--muted2);
    }

    /* ── STREAM WIDGET (Twitch / YouTube category tiles) ── */
    .stream-tile{
      display:flex;flex-direction:column;
      border:1px solid var(--border);
      border-radius:18px;
      overflow:hidden;
      background:
        linear-gradient(180deg,hsl(var(--h) var(--acc-sat) var(--acc-lum) /.08),transparent 42%),
        var(--surface);
      box-shadow:var(--tile-shadow);
    }
    .sw-head{
      display:flex;align-items:center;gap:8px;
      padding:8px 12px 8px 14px;border-bottom:1px solid var(--border);
    }
    /* Category pills (All / Twitch / YouTube) — mock's chip row */
    .sw-pills{display:flex;align-items:center;gap:6px;min-width:0;}
    .sw-pill{
      appearance:none;border:none;cursor:pointer;
      height:26px;padding:0 12px;border-radius:999px;
      background:transparent;color:var(--muted);
      font-family:inherit;font-size:11px;font-weight:700;letter-spacing:.01em;
      white-space:nowrap;
      transition:background .25s var(--ease-smooth),color .25s var(--ease-smooth),transform .3s var(--ease-spring);
    }
    .sw-pill:hover{color:var(--text);}
    .sw-pill:active{transform:scale(.94);}
    .sw-pill.active{background:#fff;color:#111;}
    .sw-updated{
      margin-left:auto;
      font-size:10px;font-weight:600;color:var(--muted2);
      font-variant-numeric:tabular-nums;white-space:nowrap;
    }
    .stream-tile.sw-narrow .sw-updated{display:none;}
    /* 2-col card grid (mock's layout); auto-fill keeps 1 col on
       narrow tiles. fitStreamWidget() hides cards past capacity. */
    .sw-grid{
      position:relative;flex:1 1 auto;min-height:0;
      display:grid;
      grid-template-columns:repeat(auto-fill,minmax(200px,1fr));
      grid-auto-rows:minmax(56px,1fr);
      gap:6px;padding:8px 10px 10px;
    }
    .sw-card{
      appearance:none;border:none;cursor:pointer;
      display:flex;align-items:center;gap:9px;
      min-width:0;min-height:0;padding:6px;border-radius:8px;
      background:rgba(255,255,255,.025);
      text-align:left;font-family:inherit;color:var(--text);
      transition:background .3s var(--ease-smooth),transform .3s var(--ease-spring);
      animation:cardReveal .5s var(--ease-out) backwards;
    }
    .sw-card:hover{background:rgba(255,255,255,.06);}
    .sw-card:active{transform:scale(.97);}
    .sw-thumb{
      position:relative;flex-shrink:0;
      width:64px;height:36px;border-radius:6px;
      overflow:hidden;background:var(--surface-em);
    }
    .sw-thumb img{
      width:100%;height:100%;object-fit:cover;display:block;
      transition:opacity .3s var(--ease-smooth);
    }
    .sw-thumb img.bad{opacity:0;}
    /* placeholder thumbs (YouTube stubs): brand-tinted gradient */
    .sw-thumb.stub::after{
      content:'';position:absolute;inset:0;
      background:linear-gradient(150deg,hsl(263 70% 55% /.35),transparent 60%),var(--surface-em);
    }
    .sw-info{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;}
    .sw-title{
      font-size:12px;font-weight:600;line-height:1.25;letter-spacing:-.01em;
      color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    }
    .sw-meta{
      display:flex;align-items:center;gap:8px;min-width:0;
      font-size:10px;font-weight:600;color:var(--muted);
    }
    .sw-name{
      min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    }
    .sw-views{
      margin-left:auto;flex-shrink:0;
      display:inline-flex;align-items:center;gap:4px;
      color:var(--muted2);font-variant-numeric:tabular-nums;
    }
    .sw-views svg{width:9px;height:9px;fill:var(--accent-2);}
    .sw-views.live{color:var(--red);}
    .sw-views.live svg{fill:var(--red);}
    .sw-soon{
      flex-shrink:0;font-size:8px;font-weight:800;letter-spacing:.08em;
      text-transform:uppercase;color:var(--muted2);
    }
    /* loading skeletons (same family as the news tile's) */
    .sw-skel{
      display:flex;align-items:center;gap:9px;padding:6px;border-radius:8px;
    }
    .sw-skel-thumb{
      width:64px;height:36px;border-radius:6px;flex-shrink:0;
      background:var(--surface-em);
      animation:pulse .9s ease infinite;
    }
    .sw-skel-lines{flex:1;display:flex;flex-direction:column;gap:5px;min-width:0;}
    .sw-skel-bar{
      height:9px;border-radius:5px;background:var(--surface-em);
      animation:pulse .9s ease infinite;
    }
    .sw-empty{
      grid-column:1/-1;align-self:center;text-align:center;
      font-size:12px;font-weight:600;color:var(--muted2);
    }

    /* ── STREAM POPUP (player + chat side by side) ── */
    .sw-pop{
      /* above the page rail (600) + island bar (650) — the modal
         dims the chrome instead of colliding with it. */
      position:fixed;inset:0;z-index:700;
      display:flex;align-items:center;justify-content:center;
      padding:20px;
      background:rgba(0,0,0,.76);
      -webkit-backdrop-filter:blur(14px);
      backdrop-filter:blur(14px);
      opacity:0;visibility:hidden;pointer-events:none;
      transition:opacity .32s var(--ease-smooth),visibility .32s var(--ease-smooth);
    }
    .sw-pop.open{opacity:1;visibility:visible;pointer-events:auto;}
    .sw-pop-card{
      width:min(1180px,100%);
      height:min(88vh,820px);
      background:#121216;
      border:1px solid var(--border-em);
      border-radius:22px;
      overflow:hidden;
      display:flex;flex-direction:column;
      box-shadow:0 30px 80px rgba(0,0,0,.58),var(--tile-shadow);
      transform:translateY(18px) scale(.96);
      opacity:.7;
      transition:transform .42s var(--ease-spring),opacity .32s var(--ease-out);
    }
    .sw-pop.open .sw-pop-card{transform:none;opacity:1;}
    .sw-pop-head{
      display:flex;align-items:center;gap:12px;
      padding:12px 16px;border-bottom:1px solid var(--border);
      flex-shrink:0;min-width:0;
    }
    .sw-pop-live{
      display:inline-flex;align-items:center;gap:6px;flex-shrink:0;
      font-size:10px;font-weight:800;letter-spacing:.1em;color:var(--red);
    }
    .sw-pop-live i{
      width:7px;height:7px;border-radius:50%;background:var(--red);
      animation:swRedPulse 1.8s var(--ease-smooth) infinite;
    }
    @keyframes swRedPulse{
      0%   {box-shadow:0 0 0 0 rgba(255,69,58,.55);transform:scale(1);}
      70%  {box-shadow:0 0 0 7px rgba(255,69,58,0);transform:scale(1.12);}
      100% {box-shadow:0 0 0 0 rgba(255,69,58,0);transform:scale(1);}
    }
    .sw-pop-title{
      min-width:0;flex:1;
      font-size:15px;font-weight:700;color:#fff;
      white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    }
    .sw-pop-views{
      flex-shrink:0;display:inline-flex;align-items:center;gap:5px;
      font-size:12px;font-weight:700;color:var(--muted);
      font-variant-numeric:tabular-nums;
    }
    .sw-pop-views svg{width:12px;height:12px;fill:var(--red);}
    /* teslurk jump-out: teslurk.com itself refuses iframing (X-Frame-Options:
       DENY), so the popup hands off to it in a new tab — that's the pipe that
       keeps working in the Tesla browser while driving. */
    .sw-pop-teslurk{
      flex-shrink:0;display:inline-flex;align-items:center;gap:7px;
      padding:7px 13px;border-radius:999px;text-decoration:none;
      font-size:12px;font-weight:700;white-space:nowrap;
      border:1px solid hsl(var(--h) var(--acc-sat) var(--acc-lum) / .55);
      background:hsl(var(--h) var(--acc-sat) var(--acc-lum) / .14);
      color:var(--accent);
      transition:background .25s var(--ease-smooth),box-shadow .25s var(--ease-smooth);
    }
    .sw-pop-teslurk:hover{
      background:hsl(var(--h) var(--acc-sat) var(--acc-lum) / .26);
      box-shadow:0 0 14px hsl(var(--h) var(--acc-sat) var(--acc-lum) / .35);
    }
    .sw-pop-teslurk img{width:15px;height:15px;border-radius:4px;}
    .sw-pop-close{
      appearance:none;border:none;cursor:pointer;flex-shrink:0;
      width:36px;height:36px;border-radius:50%;
      background:rgba(255,255,255,.07);color:#fff;
      display:flex;align-items:center;justify-content:center;
      transition:background .25s var(--ease-smooth),transform .3s var(--ease-spring);
    }
    .sw-pop-close:hover{background:rgba(255,255,255,.14);}
    .sw-pop-close:active{transform:scale(.9);}
    .sw-pop-close svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;}
    .sw-pop-body{
      flex:1 1 auto;min-height:0;
      display:flex;gap:1px;background:var(--border);
    }
    .sw-pop-player{
      flex:1.8 1 0;min-width:0;background:#000;
      display:flex;align-items:center;justify-content:center;
    }
    .sw-pop-player iframe{width:100%;height:100%;border:0;display:block;}
    .sw-pop-chat{
      flex:1 1 0;min-width:260px;background:#0e0e12;
    }
    .sw-pop-chat iframe{width:100%;height:100%;border:0;display:block;}
    @media (max-width:860px){
      .sw-pop-body{flex-direction:column;}
      .sw-pop-chat{min-width:0;min-height:220px;}
    }

    /* ── SECTIONS ── */
    /* Page viewport: three stacked full-screen pages (home / streams / filler) */
    main.page-viewport{
      position:fixed;top:0;left:0;right:0;bottom:0;
      padding:0;z-index:1;overflow:hidden;
    }
    .page{
      position:absolute;inset:0;
      overflow-y:auto;overscroll-behavior:contain;
      padding:16px 104px 140px 24px;
      scrollbar-width:none;
      will-change:transform,filter;
      transition:transform .62s var(--ease-duo),filter .62s var(--ease-duo);
    }
    .page::-webkit-scrollbar{display:none;}
    .page.pos-above{transform:translateY(-101.5%);}
    .page.pos-active{transform:translateY(0);}
    .page.pos-below{transform:translateY(101.5%);}
    /* leaving page on tap: fog builds in fast (~90ms) then melts with
       the slide — one animation, so no whole-screen flash frame */
    .page.fog-out{animation:fogOut .62s both;}
    @keyframes fogOut{
      0%  {filter:none;animation-timing-function:linear;}
      14% {filter:blur(8px) brightness(.7);animation-timing-function:var(--ease-duo);}
      100%{filter:none;}
    }
    /* hover previews: current page nudges + frosts, target peeks in */
    .page-viewport.preview-down .page.pos-active{transform:translateY(-5%);filter:blur(3px) brightness(.8);transition-duration:.38s;}
    .page-viewport.preview-down .page.pos-below{transform:translateY(94.5%);transition-duration:.38s;}
    .page-viewport.preview-up .page.pos-active{transform:translateY(5%);filter:blur(3px) brightness(.8);transition-duration:.38s;}
    .page-viewport.preview-up .page.pos-above{transform:translateY(-94.5%);transition-duration:.38s;}
    section{
      margin:24px 24px;
      animation:sectionReveal .8s var(--ease-out) both;
    }
    section:nth-of-type(1){animation-delay:calc(var(--boot-delay) + .05s);}
    section:nth-of-type(2){animation-delay:calc(var(--boot-delay) + .12s);}
    section:nth-of-type(3){animation-delay:calc(var(--boot-delay) + .19s);}
    section:nth-of-type(4){animation-delay:calc(var(--boot-delay) + .26s);}
    @keyframes sectionReveal{
      from{opacity:0;transform:translateY(10px);}
      to  {opacity:1;transform:translateY(0);}
    }
    .sec-head{
      display:flex;align-items:center;gap:10px;
      padding:0 2px 12px;
    }
    .sec-head::before{
      content:'';width:3px;height:16px;
      background:var(--accent);border-radius:999px;flex-shrink:0;
      box-shadow:0 0 10px hsl(var(--h) var(--acc-sat) var(--acc-lum) /.45);
      animation:accentBarBreathe 3.5s var(--ease-smooth) infinite;
    }
    @keyframes accentBarBreathe{
      0%,100% {opacity:.85;transform:scaleY(1);}
      50%     {opacity:1;transform:scaleY(1.15);}
    }
    .sec-head span{
      font-size:18px;font-weight:800;letter-spacing:-.01em;
      color:#fff;
    }
    .sec-head::after{content:'';flex:1;height:1px;background:var(--border);}

    /* ── HORIZONTAL SCROLL ROW ── */
    .row{
      display:flex;
      gap:14px;
      padding:0 2px 8px;
      overflow-x:auto;
      overflow-y:visible;
      scroll-snap-type:x mandatory;
      scroll-padding-left:2px;
      -webkit-overflow-scrolling:touch;
      scrollbar-width:none;
    }
    .row::-webkit-scrollbar{display:none;}

    /* ── CARD ── */
    .card{
      flex:0 0 auto;
      width:172px;
      height:200px;
      border-radius:16px;
      background:
        linear-gradient(155deg,rgba(255,255,255,.03) 0%,transparent 45%),
        var(--surface);
      border:1px solid var(--border);
      box-shadow:var(--tile-shadow);
      display:flex;
      flex-direction:column;
      gap:10px;
      padding:12px;
      cursor:pointer;
      scroll-snap-align:start;
      transition:
        background .25s var(--ease-smooth),
        border-color .25s var(--ease-smooth),
        transform .35s var(--ease-spring),
        box-shadow .25s var(--ease-smooth);
      opacity:0;
      animation:fadeUp .65s var(--ease-out) forwards;
      user-select:none;
      position:relative;
      overflow:hidden;
    }
    .card::before{
      content:'';position:absolute;
      top:0;left:0;right:0;height:1px;
      background:rgba(255,255,255,0.08);
      z-index:2;
    }
    .card::after{
      content:'';position:absolute;
      top:0;left:-60%;width:50%;height:100%;
      background:linear-gradient(115deg,
        transparent 0%,
        rgba(255,255,255,.035) 45%,
        rgba(255,255,255,.08) 50%,
        rgba(255,255,255,.035) 55%,
        transparent 100%);
      transform:skewX(-18deg);
      pointer-events:none;
      animation:sheen 9s var(--ease-smooth) infinite;
      animation-delay:var(--sheen-delay,0s);
    }
    @keyframes sheen{
      0%,70%   {left:-60%;opacity:0;}
      75%      {opacity:1;}
      100%     {left:130%;opacity:0;}
    }
    .card:hover{
      border-color:var(--border-em);
      transform:translateY(-4px);
      background:
        linear-gradient(155deg,rgba(255,255,255,.045) 0%,transparent 45%),
        var(--surface-em);
      box-shadow:0 18px 34px rgba(0,0,0,.26),var(--tile-shadow);
    }
    .card:active{
      transform:scale(0.955);
      background:var(--surface-active);
      border-color:hsl(var(--h) var(--acc-sat) var(--acc-lum) /.55);
      box-shadow:var(--accent-glow),var(--tile-shadow);
    }
    .card-media{
      width:100%;
      height:118px;
      border-radius:12px;
      background:
        linear-gradient(145deg,rgba(255,255,255,.045),rgba(0,0,0,.22)),
        #101014;
      display:flex;
      align-items:center;
      justify-content:center;
      overflow:hidden;
      position:relative;
    }
    .card-media img{
      max-width:70%;
      max-height:70%;
      object-fit:contain;
      pointer-events:none;
      transition:opacity .2s var(--ease-smooth),transform .35s var(--ease-spring);
      position:relative;z-index:1;
    }
    .card:hover .card-media img{transform:scale(1.06);}
    .card:active .card-media img{opacity:.85;transform:scale(.96);}
    .card-name{
      font-size:13px;
      font-weight:700;
      color:#fff;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }
    .card-sub{
      font-size:10px;
      font-weight:600;
      color:var(--muted2);
      text-transform:uppercase;
      letter-spacing:.08em;
    }

    @keyframes fadeUp{
      0%   {opacity:0;transform:translateY(14px) scale(.97);filter:blur(4px);}
      60%  {filter:blur(0);}
      100% {opacity:1;transform:translateY(0) scale(1);filter:blur(0);}
    }
    .row .card{transform:translateY(14px);}
    .row .card:nth-child(1) {animation-delay:calc(var(--boot-delay) + .04s);--sheen-delay:0s;}
    .row .card:nth-child(2) {animation-delay:calc(var(--boot-delay) + .09s);--sheen-delay:1.1s;}
    .row .card:nth-child(3) {animation-delay:calc(var(--boot-delay) + .14s);--sheen-delay:2.3s;}
    .row .card:nth-child(4) {animation-delay:calc(var(--boot-delay) + .19s);--sheen-delay:3.5s;}
    .row .card:nth-child(5) {animation-delay:calc(var(--boot-delay) + .24s);--sheen-delay:4.7s;}
    .row .card:nth-child(6) {animation-delay:calc(var(--boot-delay) + .29s);--sheen-delay:5.9s;}
    .row .card:nth-child(7) {animation-delay:calc(var(--boot-delay) + .34s);--sheen-delay:7.1s;}
    .row .card:nth-child(8) {animation-delay:calc(var(--boot-delay) + .39s);--sheen-delay:8.3s;}
    .row .card:nth-child(9) {animation-delay:calc(var(--boot-delay) + .44s);--sheen-delay:.5s;}
    .row .card:nth-child(10){animation-delay:calc(var(--boot-delay) + .49s);--sheen-delay:1.7s;}
    .row .card:nth-child(11){animation-delay:calc(var(--boot-delay) + .54s);--sheen-delay:2.9s;}
    .row .card:nth-child(12){animation-delay:calc(var(--boot-delay) + .59s);--sheen-delay:4.1s;}

    /* ── RADIO CARDS ── */
    .radio-card{
      flex:0 0 auto;
      width:172px;
      height:200px;
      border-radius:16px;
      background:
        linear-gradient(155deg,rgba(255,255,255,.03) 0%,transparent 45%),
        var(--surface);
      border:1px solid var(--border);
      box-shadow:var(--tile-shadow);
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      gap:10px;
      padding:14px;
      cursor:pointer;
      scroll-snap-align:start;
      transition:
        background .25s var(--ease-smooth),
        border-color .25s var(--ease-smooth),
        transform .35s var(--ease-spring),
        box-shadow .35s var(--ease-smooth);
      opacity:0;
      animation:fadeUp .65s var(--ease-out) forwards;
      user-select:none;
      position:relative;
      overflow:hidden;
    }
    .radio-card::before{
      content:'';position:absolute;
      top:0;left:0;right:0;height:1px;
      background:rgba(255,255,255,.08);
      z-index:2;
    }
    .radio-card:hover{
      border-color:var(--border-em);
      transform:translateY(-4px);
      background:
        linear-gradient(155deg,rgba(255,255,255,.045) 0%,transparent 45%),
        var(--surface-em);
      box-shadow:0 18px 34px rgba(0,0,0,.26),var(--tile-shadow);
    }
    .radio-card.playing{
      border-color:hsl(var(--h) var(--acc-sat) var(--acc-lum) /.55);
      background:
        radial-gradient(120% 80% at 50% 0%,hsl(var(--h) var(--acc-sat) var(--acc-lum) /.18),transparent 60%),
        hsl(var(--h) var(--acc-sat) var(--acc-lum) /.06);
      box-shadow:var(--accent-glow),var(--tile-shadow);
      animation:fadeUp .65s var(--ease-out) forwards,playingPulse 3.2s var(--ease-smooth) infinite;
    }
    @keyframes playingPulse{
      0%,100% {box-shadow:0 6px 22px -8px hsl(var(--h) var(--acc-sat) var(--acc-lum) /.35),0 0 0 1px hsl(var(--h) var(--acc-sat) var(--acc-lum) /.28),var(--tile-shadow);}
      50%     {box-shadow:0 10px 32px -6px hsl(var(--h) var(--acc-sat) var(--acc-lum) /.55),0 0 0 1px hsl(var(--h) var(--acc-sat) var(--acc-lum) /.45),var(--tile-shadow);}
    }
    .radio-card:active{transform:scale(0.955);}
    .radio-icon{
      width:64px;height:64px;border-radius:50%;
      display:flex;align-items:center;justify-content:center;
      font-size:16px;font-weight:800;letter-spacing:.04em;
      flex-shrink:0;
      position:relative;
      box-shadow:0 10px 24px rgba(0,0,0,.25);
    }
    .radio-card.playing .radio-icon::after{
      content:'';
      position:absolute;inset:-6px;border-radius:50%;
      border:2px solid var(--accent);
      opacity:.5;
      animation:ping 1.4s ease-out infinite;
    }
    @keyframes ping{
      0%{transform:scale(1);opacity:.5}
      100%{transform:scale(1.35);opacity:0}
    }
    .radio-name{
      font-size:13px;font-weight:700;
      color:#fff;text-align:center;
      max-width:92%;white-space:nowrap;
      overflow:hidden;text-overflow:ellipsis;
      pointer-events:none;
    }
    .radio-genre{
      font-size:10px;font-weight:500;
      color:var(--muted);text-align:center;
      pointer-events:none;
    }

    /* ── NOW PLAYING BAR ── */
    .now-playing{
      position:fixed;
      bottom:0;left:0;right:0;
      z-index:300;
      background:
        linear-gradient(180deg,rgba(255,255,255,.025) 0%,transparent 30%),
        var(--bg-raised);
      border-top:1px solid var(--border);
      display:none;
      align-items:center;
      gap:14px;
      padding:12px 22px;
      min-height:66px;
      transition:right .35s var(--ease-fluid),left .35s var(--ease-fluid);
      box-shadow:0 -10px 28px rgba(0,0,0,.3);
    }
    .now-playing.visible{
      display:flex;
      right:64px;
      animation:npSlideUp .55s var(--ease-spring) both;
    }
    @keyframes npSlideUp{
      from{transform:translateY(100%);opacity:.4;}
      to  {transform:translateY(0);opacity:1;}
    }
    .now-playing.has-frame{
      align-items:flex-start;
      padding:12px 22px;
      gap:16px;
    }
    .now-playing.chat-open{left:360px;}
    .now-playing.chat-mini{left:52px;}
    .np-pulse{
      width:10px;height:10px;border-radius:50%;
      background:var(--accent);flex-shrink:0;
