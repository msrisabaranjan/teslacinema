<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>

  <script>
  /* ── TESLA 2026.26+ BROWSER-ZOOM COMPAT ── */
  (function(){
    try{
      var ua = navigator.userAgent || '';
      if(!/Tesla/i.test(ua)) return;
      var w = window.innerWidth, h = window.innerHeight;
      var zoomed = w >= 680 && w <= 900 && h >= 520 && h <= 720;
      if(!zoomed) return;
      var physW = Math.round(w * (window.devicePixelRatio || 1));
      var meta = document.querySelector('meta[name="viewport"]');
      if(meta){
        meta.setAttribute('content',
          'width=' + physW +
          ', initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0' +
          ', user-scalable=no, viewport-fit=cover');
      }
      document.documentElement.setAttribute('data-tesla-zoomed','');
    }catch(e){/* never break page boot on compat failure */}
  })();
  </script>

  <title>T / Cinema</title>
  <link rel="icon" href="images/miff4.png"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>

  <style>
    :root{
      /* --h is the single accent-hue knob (T logo → slider recolors it).
         141 is the default Spotify green: #1DB954 = hsl(141 73% 42%),
         #1ED760 ≈ hsl(141 75% 48%). Every UI green derives from it. */
      --h:141;
      --bg:#0B0B0E;
      --bg-raised:#111114;
      --surface:#18181D;
      --surface-em:#22222A;
      --surface-active:hsl(var(--h) 73% 42% / .14);
      --border:rgba(255,255,255,.08);
      --border-em:rgba(255,255,255,.16);
      --accent:hsl(var(--h) 73% 42%);
      --accent-soft:hsl(var(--h) 73% 42% / .16);
      --accent-2:#8B5CF6;
      --accent-3:#3B82F6;
      --text:#FFFFFF;
      --muted:rgba(255,255,255,.62);
      --muted2:rgba(255,255,255,.34);
      --green:hsl(var(--h) 75% 48%);
      --red:#FF453A;
      --yellow:#FFD166;
      --ease-out:cubic-bezier(.16,.84,.44,1);
      --ease-spring:cubic-bezier(.34,1.4,.64,1);
      --ease-smooth:cubic-bezier(.22,.61,.36,1);
      --ease-fluid:cubic-bezier(.4,0,.2,1);
      --ease-duo:cubic-bezier(.32,.72,0,1);
      --accent-glow:0 10px 30px -8px hsl(var(--h) 73% 42% / .42),0 0 0 1px hsl(var(--h) 73% 42% / .28);
      --tile-shadow:0 1px 0 rgba(255,255,255,.04) inset,0 -1px 0 rgba(0,0,0,.32) inset;
      --boot-delay:1.7s;
      --speed-glow:0;
    }

    *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}

    html,body{
      background:var(--bg);
      color:var(--text);
      font-family:'Inter',system-ui,sans-serif;
      min-height:100vh;
      overflow-x:hidden;
    }

    body::before{
      content:'';
      position:fixed;inset:-20%;
      z-index:-1;pointer-events:none;
      background:
        radial-gradient(60% 50% at 18% 22%,hsl(var(--h) 73% 42% /.10),transparent 60%),
        radial-gradient(50% 40% at 82% 78%,rgba(139,92,246,.08),transparent 65%),
        radial-gradient(40% 30% at 50% 50%,rgba(255,255,255,.02),transparent 70%);
      animation:ambientDrift 22s var(--ease-smooth) infinite alternate;
      will-change:transform,opacity;
    }

    @keyframes ambientDrift{
      0%   {transform:translate3d(0,0,0) scale(1);opacity:.85;}
      50%  {transform:translate3d(2%,-1.5%,0) scale(1.04);opacity:1;}
      100% {transform:translate3d(-1.5%,2%,0) scale(1.02);opacity:.9;}
    }

    body::after{
      content:'';
      position:fixed;inset:0;
      z-index:-1;
      pointer-events:none;
      background:
        radial-gradient(55% 45% at 50% 28%, hsl(var(--h) 73% 42% /.18), transparent 68%),
        radial-gradient(35% 30% at 50% 70%, hsl(var(--h) 73% 42% /.08), transparent 70%);
      opacity:var(--speed-glow,0);
      transition:opacity 1.2s var(--ease-smooth);
    }

    @media (prefers-reduced-motion:reduce){
      body::before{animation:none;}
      *,*::before,*::after{
        animation-duration:.001ms !important;
        animation-iteration-count:1 !important;
        transition-duration:.05s !important;
      }
    }

    /* ── TICKER ── */
    .ticker-bar{
      position:fixed;top:0;left:0;right:0;z-index:200;
      background:rgba(10,10,12,.92);
      backdrop-filter:blur(14px);
      -webkit-backdrop-filter:blur(14px);
      border-bottom:1px solid var(--border);
      overflow:hidden;
      height:44px;
      display:flex;align-items:center;
      animation:slideDown .6s var(--ease-out) var(--boot-delay) both;
    }
    .ticker-label{
      flex-shrink:0;
      padding:0 16px;
      font-size:11px;font-weight:800;letter-spacing:.14em;
      color:var(--accent);
      border-right:1px solid var(--border);
      height:100%;display:flex;align-items:center;
      background:rgba(10,10,12,.92);
      min-width:76px;justify-content:center;
      position:relative;
    }
    .ticker-label::before{
      content:'';
      width:7px;height:7px;border-radius:50%;
      background:var(--accent);
      margin-right:7px;
      box-shadow:0 0 0 0 hsl(var(--h) 73% 42% /.55);
      animation:livePulse 1.8s var(--ease-smooth) infinite;
    }
    @keyframes livePulse{
      0%   {box-shadow:0 0 0 0 hsl(var(--h) 73% 42% /.55);transform:scale(1);}
      70%  {box-shadow:0 0 0 7px hsl(var(--h) 73% 42% /0);transform:scale(1.12);}
      100% {box-shadow:0 0 0 0 hsl(var(--h) 73% 42% /0);transform:scale(1);}
    }
    .ticker-mask{flex:1;overflow:hidden;position:relative;}
    .ticker-mask::before,.ticker-mask::after{
      content:'';position:absolute;top:0;bottom:0;width:28px;z-index:10;pointer-events:none;
    }
    .ticker-mask::before{left:0;background:linear-gradient(to right,rgba(10,10,12,.92),transparent);}
    .ticker-mask::after{right:0;background:linear-gradient(to left,rgba(10,10,12,.92),transparent);}
    .ticker-track{
      display:flex;white-space:nowrap;
      will-change:transform;
    }
    .ticker-track:hover{animation-play-state:paused;}
    .t-item{
      display:inline-flex;align-items:center;gap:8px;
      padding:0 22px;
    }
    .t-sym{font-weight:800;font-size:13px;letter-spacing:.04em;color:rgba(255,255,255,.62);}
    .t-price{font-size:13px;font-weight:600;color:#fff;}
    .t-chg{font-size:12px;font-weight:700;}
    .t-chg.up{color:var(--green);}
    .t-chg.dn{color:var(--red);}
    .t-dot{color:var(--muted2);font-size:10px;}

    /* ── RIGHT ISLAND BAR (replaces the old top header) ──
       A borderless floating stack pinned to the top-right:
       logo → time + date → year-progress ring.
       The fullscreen button floats alone in the bottom-right corner. */
    @keyframes slideDown{
      from{opacity:0;transform:translateY(-8px);}
      to  {opacity:1;transform:translateY(0);}
    }
    /* Ungrouped floating stack — borderless, each element sized like
       the nav rail's 40px buttons and aligned with it. */
    .island-bar{
      position:fixed;top:60px;right:14px;z-index:600;
      display:flex;flex-direction:column;align-items:center;
      gap:8px;width:58px;
      user-select:none;
      animation:islandIn .7s var(--ease-out) var(--boot-delay) both;
    }
    @keyframes islandIn{
      from{opacity:0;transform:translateX(12px);}
      to  {opacity:1;transform:translateX(0);}
    }
    .logo-t{
      width:36px;height:36px;background:var(--accent);border-radius:11px;
      display:flex;align-items:center;justify-content:center;
      font-weight:800;font-size:15px;color:#07110C;letter-spacing:-.02em;
      box-shadow:0 0 0 0 hsl(var(--h) 73% 42% /.4),0 8px 20px hsl(var(--h) 73% 42% /.18);
      animation:logoBreathe 4.5s var(--ease-smooth) infinite;
      flex-shrink:0;
      cursor:pointer; /* tap → accent hue panel */
      margin-bottom:10px; /* extra breathing room between logo and time */
    }
    @keyframes logoBreathe{
      0%,100% {box-shadow:0 0 0 0 hsl(var(--h) 73% 42% /0),0 2px 8px hsl(var(--h) 73% 42% /.18);}
      50%     {box-shadow:0 0 0 5px hsl(var(--h) 73% 42% /.06),0 8px 18px hsl(var(--h) 73% 42% /.32);}
    }
    #clock-wrap{display:flex;flex-direction:column;align-items:center;gap:3px;}
    #clock{
      font-size:15px;font-weight:700;letter-spacing:-.02em;line-height:1;
      font-variant-numeric:tabular-nums;
      transition:color .3s var(--ease-smooth);
    }
    #clock.tick{animation:clockTick .55s var(--ease-smooth);}
    @keyframes clockTick{
      0%   {opacity:.4;transform:translateY(-2px);}
      60%  {opacity:1;}
      100% {opacity:1;transform:translateY(0);}
    }
    #date-display{
      font-size:9px;font-weight:600;
      color:var(--muted);
      letter-spacing:.02em;
      white-space:nowrap;
      max-width:58px;overflow:hidden;text-overflow:ellipsis;
    }
    .fs-btn{
      width:36px;height:36px;border-radius:999px;
      border:1px solid var(--border);
      background:rgba(255,255,255,.04);
      color:var(--muted);cursor:pointer;
      display:flex;align-items:center;justify-content:center;
      transition:
        background .25s var(--ease-smooth),
        border-color .25s var(--ease-smooth),
        color .25s var(--ease-smooth),
        transform .35s var(--ease-spring);
      flex-shrink:0;
    }
    .fs-btn:hover{
      color:var(--text);
      border-color:rgba(255,255,255,.28);
      background:rgba(255,255,255,.07);
    }
    .fs-btn:active{
      background:var(--accent-soft);border-color:var(--accent);color:#fff;
      transform:scale(.92);
    }
    .fs-btn svg{
      width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;
      transition:transform .35s var(--ease-spring);
    }
    .fs-btn:hover svg{transform:scale(1.08);}
    #fsBtn{
      position:fixed;bottom:16px;right:14px;z-index:600;
      animation:islandIn .7s var(--ease-out) calc(var(--boot-delay) + .45s) both;
    }

    /* ── ACCENT PANEL (tap the T logo → hue slider recolors every UI green) ── */
    .accent-panel{
      position:fixed;top:60px;right:82px;z-index:650;
      width:232px;padding:14px 16px 12px;
      background:rgba(15,15,19,.92);
      backdrop-filter:blur(22px) saturate(1.5);
      -webkit-backdrop-filter:blur(22px) saturate(1.5);
      border:1px solid var(--border-em);
      border-radius:16px;
      box-shadow:0 18px 40px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.08);
      opacity:0;visibility:hidden;transform:translateY(-6px) scale(.97);
      transform-origin:top right;
      transition:opacity .22s var(--ease-out),transform .26s var(--ease-spring),visibility .22s;
    }
    .accent-panel.open{opacity:1;visibility:visible;transform:none;}
    .accent-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
    .accent-title{font-size:10px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);}
    .accent-close{
      width:24px;height:24px;border:none;border-radius:999px;background:transparent;
      color:var(--muted2);cursor:pointer;
      display:flex;align-items:center;justify-content:center;
      transition:background .15s var(--ease-smooth),color .15s var(--ease-smooth);
    }
    .accent-close:hover{background:rgba(255,255,255,.08);color:#fff;}
    .accent-close svg{width:12px;height:12px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;}
    .accent-hue{
      -webkit-appearance:none;appearance:none;
      width:100%;height:22px;background:transparent;cursor:pointer;margin:0;
    }
    .accent-hue::-webkit-slider-runnable-track{
      height:10px;border-radius:999px;
      background:linear-gradient(90deg,hsl(0 73% 42%),hsl(60 73% 42%),hsl(120 73% 42%),hsl(180 73% 42%),hsl(240 73% 42%),hsl(300 73% 42%),hsl(360 73% 42%));
      border:1px solid rgba(255,255,255,.14);
    }
    .accent-hue::-moz-range-track{
      height:10px;border-radius:999px;
      background:linear-gradient(90deg,hsl(0 73% 42%),hsl(60 73% 42%),hsl(120 73% 42%),hsl(180 73% 42%),hsl(240 73% 42%),hsl(300 73% 42%),hsl(360 73% 42%));
      border:1px solid rgba(255,255,255,.14);
    }
    .accent-hue::-webkit-slider-thumb{
      -webkit-appearance:none;appearance:none;
      width:18px;height:18px;border-radius:50%;margin-top:-5px;
      background:var(--accent);
      border:2px solid #fff;
      box-shadow:0 2px 8px rgba(0,0,0,.5),0 0 10px hsl(var(--h) 73% 42% /.55);
    }
    .accent-hue::-moz-range-thumb{
      width:14px;height:14px;border-radius:50%;
      background:var(--accent);
      border:2px solid #fff;
      box-shadow:0 2px 8px rgba(0,0,0,.5),0 0 10px hsl(var(--h) 73% 42% /.55);
    }
    .accent-foot{display:flex;align-items:center;justify-content:space-between;margin-top:10px;}
    .accent-hex{font-size:11px;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums;letter-spacing:.04em;}
    .accent-reset{
      border:1px solid var(--border-em);border-radius:999px;background:rgba(255,255,255,.04);
      color:var(--muted);font-family:inherit;font-size:10px;font-weight:700;letter-spacing:.06em;
      padding:5px 12px;cursor:pointer;
      transition:background .15s var(--ease-smooth),color .15s var(--ease-smooth),border-color .15s var(--ease-smooth);
    }
    .accent-reset:hover{background:rgba(255,255,255,.08);color:#fff;}
    .accent-reset:active{background:var(--accent-soft);border-color:var(--accent);color:#fff;}
    @media (max-width:640px){
      .accent-panel{top:56px;right:74px;width:212px;}
    }

    /* Year progress: a ring with the days-left number inside it. */
    .yr-ring{
      cursor:default;display:flex;flex-direction:column;
      align-items:center;gap:5px;flex-shrink:0;
    }
    .yr-arc{display:block;width:36px;height:36px;}
    .yr-arc-track{stroke:rgba(255,255,255,0.08);fill:none;stroke-linecap:round;}
    .yr-arc-fill{fill:none;stroke-linecap:round;transition:stroke-dashoffset 1.2s var(--ease-smooth),stroke .6s var(--ease-smooth);}
    .yr-arc-days{
      font-size:15px;font-weight:800;fill:#fff;
      text-anchor:middle;dominant-baseline:central;
      font-family:'Inter',sans-serif;
      font-variant-numeric:tabular-nums;
    }
    .yr-ring-cap{
      font-size:7px;font-weight:800;letter-spacing:.16em;
      text-transform:uppercase;color:var(--muted);line-height:1;
    }

    /* ── HOME TILES (hold a tile to rearrange) ── */
    @keyframes cardReveal{
      from{opacity:0;transform:translateY(8px) scale(.99);}
      to  {opacity:1;transform:translateY(0) scale(1);}
    }

    /* Free placement: tiles are absolutely positioned inside the content
       area (origin --hx/--hy, right margin --hxr). JS sets left/top/
       width; positions survive resizes (clamped, never reflowed). */
    #pageHome{
      /* position:relative would override .page's absolute;inset:0 and
         collapse the page to its padding height — keep .page's box. */
      padding:0 0 140px 0;
      --hx:24px;--hy:16px;--hxr:104px;
    }
    .home-tile{
      position:absolute;
      transition:left .18s var(--ease-out),top .18s var(--ease-out),width .18s var(--ease-out),min-height .18s var(--ease-out);
    }
    /* .news-strip / .avatar-panel declare position:relative later in
       this sheet (for their absolutely-positioned inner chrome); the
       id rules win the cascade so the tiles stay out of the flow. */
    #newsStrip,#avatarPanel,#navSection{position:absolute;}
    #newsStrip.dragging,#avatarPanel.dragging,#navSection.dragging{position:fixed;}
    #pageHome.home-no-trans .home-tile{transition:none;}
    /* Tiles keep their set size — they move, they never stretch to fill. */
    #newsStrip{min-width:0;
      animation:cardReveal .7s var(--ease-out) calc(var(--boot-delay) + .15s) backwards;}
    #avatarPanel{
      animation:cardReveal .7s var(--ease-out) calc(var(--boot-delay) + .22s) backwards;}
    #navSection{
      animation:cardReveal .7s var(--ease-out) calc(var(--boot-delay) + .3s) backwards;}

    /* arrange mode: jiggle + drag */
    #pageHome.arranging{overflow:hidden;}
    #pageHome.arranging .home-tile{
      touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab;
      outline:1px dashed rgba(255,255,255,.22);outline-offset:4px;
    }
    #pageHome.arranging .home-tile>*{pointer-events:none;}
    body.home-arranging{cursor:grabbing;}
    body.home-arranging *{user-select:none;-webkit-user-select:none;}
    .home-tile.jiggling{animation:tileJiggle .3s ease-in-out infinite alternate;}
    @keyframes tileJiggle{from{rotate:-.35deg;}to{rotate:.35deg;}}
    .home-tile.dragging{
      position:fixed;z-index:500;margin:0;
      pointer-events:none;will-change:transform;cursor:grabbing;
      box-shadow:0 24px 48px rgba(0,0,0,.5),var(--tile-shadow);
      outline:1px dashed rgba(255,255,255,.55);outline-offset:6px;
    }
    /* Light placement grid — visible only while arranging. Covers the
       content area (lines start at the content origin so tile edges
       sit on grid lines). */
    #pageHome::after{
      content:'';position:absolute;
      top:var(--hy);left:var(--hx);right:var(--hxr);bottom:0;
      pointer-events:none;z-index:5;
      background-image:
        linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px),
        linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px);
      background-size:48px 48px;
      opacity:0;transition:opacity .25s var(--ease-out);
    }
    #pageHome.arranging::after{opacity:1;}
    /* Drop ghost — the slot the dragged tile will snap to */
    .drop-ghost{
      position:absolute;z-index:6;
      border:2px dashed hsl(var(--h) 73% 42% /.6);
      background:hsl(var(--h) 73% 42% /.06);
      border-radius:18px;
      pointer-events:none;
      opacity:0;transition:opacity .12s var(--ease-out);
    }
    .drop-ghost.show{opacity:1;}
    .arrange-done{
      position:fixed;left:50%;bottom:26px;transform:translateX(-50%);
      z-index:510;pointer-events:none;opacity:0;
      border:1px solid var(--border);border-radius:999px;
      padding:9px 18px;background:rgba(255,255,255,.08);
      color:#fff;font-size:12px;font-weight:700;letter-spacing:.08em;
      text-transform:uppercase;cursor:pointer;
      transition:opacity .18s var(--ease-out),background .18s;
    }
    .arrange-done:hover{background:rgba(255,255,255,.14);}
    .arrange-done.show{opacity:1;pointer-events:auto;}

    .news-strip{
      flex:1;
      min-width:0;
      margin:0;
      border:1px solid var(--border);
      border-radius:18px;
      overflow:hidden;
      background:var(--surface);
    }

    .news-header{
      display:flex;align-items:center;gap:8px;
      padding:11px 14px 11px 16px;border-bottom:1px solid var(--border);
    }
    .news-label{
      font-size:10px;font-weight:800;letter-spacing:.14em;
      text-transform:uppercase;color:var(--accent);
    }
    .news-source{font-size:10px;font-weight:600;letter-spacing:.06em;color:var(--muted);}
    .news-dot{color:var(--muted2);font-size:9px;margin:0 1px;}
    .news-updated{margin-left:auto;font-size:10px;color:var(--muted2);font-variant-numeric:tabular-nums;}
    .news-nav-group{display:flex;align-items:center;gap:6px;margin-left:10px;flex-shrink:0;}
    .news-nav{
      width:36px;height:36px;border-radius:999px;
      border:1px solid var(--border-em);background:rgba(255,255,255,.04);
      color:var(--muted);cursor:pointer;
      display:flex;align-items:center;justify-content:center;
      transition:
        background .25s var(--ease-smooth),
        border-color .25s var(--ease-smooth),
        color .25s var(--ease-smooth),
        transform .35s var(--ease-spring);
    }
    .news-nav:hover{
      color:var(--text);
      border-color:rgba(255,255,255,.28);
      background:rgba(255,255,255,.07);
    }
    .news-nav:active{
      background:var(--accent-soft);border-color:var(--accent);color:#fff;
      transform:scale(.92);
    }
    .news-nav svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
    .news-items{overflow:hidden;position:relative;height:140px;touch-action:pan-y;}
    .news-slide{
      position:absolute;inset:0;
      display:flex;align-items:stretch;
      opacity:0;transform:translateX(28px);
      transition:opacity .5s var(--ease-out),transform .5s var(--ease-out);
      pointer-events:none;
    }
    .news-slide.active{opacity:1;transform:translateX(0);pointer-events:auto;cursor:pointer;}
    .news-slide.exit-left{opacity:0;transform:translateX(-28px);}
    .news-slide.exit-right{opacity:0;transform:translateX(28px);}
    .news-slide.from-left{transform:translateX(-28px);}
    .news-img-wrap{
      flex:0 0 260px;
      position:relative;overflow:hidden;
      background:
        linear-gradient(160deg,hsl(var(--h) 73% 42% /.22),rgba(0,0,0,.35)),
        var(--surface-em);
    }
    .news-img-wrap img{
      width:100%;height:100%;object-fit:cover;display:block;
      transition:transform .7s var(--ease-smooth);
    }
    .news-slide.active .news-img-wrap img{transform:scale(1.04);}
    .news-img-wrap::after{
      content:'';position:absolute;inset:0;
      background:linear-gradient(90deg,transparent 55%,var(--surface));
      pointer-events:none;
    }
    .news-copy{
      flex:1;min-width:0;
      display:flex;flex-direction:column;justify-content:center;
      padding:18px 20px 18px 16px;gap:9px;
    }
    .news-meta{
      display:flex;align-items:center;gap:8px;
      font-size:10px;font-weight:700;letter-spacing:.08em;
      text-transform:uppercase;color:var(--muted);
    }
    .news-idx{color:var(--accent);font-variant-numeric:tabular-nums;letter-spacing:.04em;}
    .news-time{font-variant-numeric:tabular-nums;color:var(--muted2);text-transform:none;letter-spacing:0;font-weight:500;}
    .news-title{
      font-size:20px;font-weight:700;line-height:1.22;letter-spacing:-.02em;
      color:var(--text);
      display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
      overflow:hidden;
    }
    .news-desc{
      font-size:13px;font-weight:400;line-height:1.45;
      color:rgba(255,255,255,.56);
      display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
      overflow:hidden;
    }
    .news-dots{
      display:flex;gap:6px;padding:10px 14px;
      border-top:1px solid var(--border);align-items:center;
      overflow-x:auto;scrollbar-width:none;
    }
    .news-dots::-webkit-scrollbar{display:none;}
    .news-pip{
      width:18px;height:4px;border-radius:999px;
      border:none;padding:0;appearance:none;
      background:rgba(255,255,255,.12);
      overflow:hidden;flex-shrink:0;
      transition:background .4s var(--ease-smooth),width .4s var(--ease-spring),box-shadow .4s var(--ease-smooth);
      cursor:pointer;
    }
    .news-pip.on{
      background:hsl(var(--h) 73% 42% /.25);
      width:40px;
      box-shadow:0 0 10px hsl(var(--h) 73% 42% /.25);
    }
    .news-pip.on::after{
      content:'';display:block;height:100%;width:0;
      background:var(--accent);
      border-radius:999px;
      animation:newsPipFill 7s linear forwards;
    }
    @keyframes newsPipFill{to{width:100%;}}
    .news-skeleton{
      height:140px;display:flex;align-items:stretch;
    }
    .news-skel-img{
      flex:0 0 260px;
      background:rgba(255,255,255,0.06);
      animation:pulse .9s ease infinite;
    }
    .news-skel-copy{
      flex:1;display:flex;flex-direction:column;justify-content:center;
      padding:0 20px;gap:12px;
    }
    .news-skel-bar{
      height:11px;border-radius:999px;
      background:rgba(255,255,255,0.07);
      animation:pulse .9s ease infinite;
    }
    @keyframes pulse{0%,100%{opacity:.35}50%{opacity:.8}}
    @media (max-width:720px){
      .news-img-wrap,.news-skel-img{flex-basis:170px;}
      .news-title{font-size:16px;}
      .news-desc{display:none;}
      .news-items,.news-skeleton{height:132px;}
    }
    .news-error{
      height:100%;display:flex;flex-direction:column;
      align-items:center;justify-content:center;
      gap:12px;padding:20px;text-align:center;
    }
    .news-error p{font-size:12px;color:var(--muted);max-width:300px;line-height:1.6;margin:0;}
    .news-retry-btn{
      padding:9px 16px;border:1px solid var(--border-em);
      border-radius:999px;background:rgba(255,255,255,.04);cursor:pointer;
      font-family:'Inter',sans-serif;font-size:11px;font-weight:700;
      color:var(--muted);transition:background .15s,color .15s,border-color .15s;
    }
    .news-retry-btn:active{background:var(--accent-soft);border-color:var(--accent);color:#fff;}
    .news-ph{
      width:100%;height:100%;
      display:flex;align-items:center;justify-content:center;
      font-size:34px;font-weight:800;letter-spacing:.06em;
      color:rgba(255,255,255,.20);
      background:
        radial-gradient(140px 90px at 72% 28%,hsl(var(--h) 73% 42% /.28),transparent 70%),
        linear-gradient(160deg,hsl(var(--h) 73% 42% /.10),rgba(0,0,0,.42));
    }

    /* ── AVATAR PANEL ── */
    .avatar-panel{
      flex:0 0 200px;
      min-height:230px;
      border:1px solid var(--border);
      border-radius:18px;
      background:
        linear-gradient(180deg,hsl(var(--h) 73% 42% /.08),transparent 42%),
        var(--surface);
      box-shadow:var(--tile-shadow);
      display:flex;
      flex-direction:column;
      overflow:hidden;
      position:relative;
    }
    .avatar-panel::before{
      content:'';
      position:absolute;
      top:0;left:0;right:0;height:1px;
      background:rgba(255,255,255,.08);
      z-index:2;
      pointer-events:none;
    }
    .avatar-panel-head{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:8px;
      padding:11px 14px;
      border-bottom:1px solid var(--border);
      font-size:10px;
      font-weight:800;
      letter-spacing:.14em;
      text-transform:uppercase;
      color:var(--accent);
      background:var(--surface);
    }
    .avatar-head-dot{
      width:8px;height:8px;border-radius:50%;
      background:var(--muted2);
      box-shadow:0 0 0 0 hsl(var(--h) 73% 42% /0);
      transition:background .3s var(--ease-smooth),box-shadow .3s var(--ease-smooth);
    }
    .avatar-head-dot.ok{
      background:var(--accent);
      box-shadow:0 0 12px hsl(var(--h) 73% 42% /.5);
      animation:ping 1.4s ease-out infinite;
    }
    .avatar-stage{
      flex:1;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:12px 12px 4px;
      position:relative;
      background:
        radial-gradient(60% 50% at 50% 35%, hsl(var(--h) 73% 42% /.12), transparent 65%),
        radial-gradient(50% 40% at 75% 75%, rgba(139,92,246,.08), transparent 70%),
        var(--surface-em);
      overflow:hidden;
    }
    .avatar-sprite{
      width:150px;
      height:150px;
      max-width:100%;
      overflow:visible;
      display:block;
    }
    .avatar-meta{
      padding:10px 14px 12px;
      border-top:1px solid var(--border);
      display:flex;
      flex-direction:column;
      gap:4px;
      background:var(--surface);
    }
    .avatar-mood{
      font-size:12px;
      font-weight:800;
      color:#fff;
      letter-spacing:.02em;
    }
    .avatar-info{
      font-size:10px;
      color:var(--muted);
      font-variant-numeric:tabular-nums;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    /* ── NEW SPRITE AVATAR ── */
    #avatarCanvas {
      width: 150px;
      height: 150px;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      background: transparent;
    }

    .avatar-panel[data-speed="moving"] #avatarCanvas {
      filter: drop-shadow(0 0 8px hsl(var(--h) 73% 42% / 0.25));
    }

    .avatar-panel[data-speed="fast"] #avatarCanvas {
      filter: drop-shadow(0 0 14px hsl(var(--h) 73% 42% / 0.45));
    }

    .avatar-panel[data-weather="storm"] #avatarCanvas {
      filter: drop-shadow(0 0 10px rgba(255, 69, 58, 0.35));
    }

    .avatar-panel[data-weather="rain"] #avatarCanvas {
      filter: drop-shadow(0 0 8px rgba(59, 130, 246, 0.35));
    }

    .avatar-panel[data-weather="snow"] #avatarCanvas {
      filter: drop-shadow(0 0 8px rgba(255, 255, 255, 0.25));
    }

    .avatar-panel[data-weather="evolve"] #avatarCanvas {
      filter: drop-shadow(0 0 14px hsl(var(--h) 73% 42% / 0.65));
    }

    .avatar-stage.evolving {
      animation:evolveFlash .55s ease-out 3;
    }

    @keyframes evolveFlash {
      0%   { box-shadow: inset 0 0 0 0 hsl(var(--h) 73% 42% / 0); }
      35%  { box-shadow: inset 0 0 34px 8px hsl(var(--h) 73% 42% / 0.45); }
      100% { box-shadow: inset 0 0 0 0 hsl(var(--h) 73% 42% / 0); }
    }

    .avatar-panel[data-weather="hatch"] #avatarCanvas {
      filter: drop-shadow(0 0 14px rgba(255, 214, 90, 0.75));
    }

    /* Egg inside its pre-hatch window: gentle gold glow pulsing in the stage. */
    .avatar-stage.hatch-pulse {
      animation:hatchPulse 1.6s ease-in-out infinite;
    }

    @keyframes hatchPulse {
      0%   { box-shadow: inset 0 0 0 0 rgba(255, 214, 90, 0); }
      50%  { box-shadow: inset 0 0 30px 6px rgba(255, 214, 90, 0.4); }
      100% { box-shadow: inset 0 0 0 0 rgba(255, 214, 90, 0); }
    }

    /* One big gold burst the moment the egg hatches. */
    .avatar-stage.hatching {
      animation:hatchBurst 1.1s ease-out 1;
    }

    @keyframes hatchBurst {
      0%   { box-shadow: inset 0 0 0 0 rgba(255, 244, 200, 0); }
      40%  { box-shadow: inset 0 0 60px 24px rgba(255, 214, 90, 0.9); }
      100% { box-shadow: inset 0 0 0 0 rgba(255, 244, 200, 0); }
    }

    @media (max-width:1100px){
      .avatar-panel{min-height:210px;}
      .avatar-sprite,#avatarCanvas{width:130px;height:130px;}
    }
    @media (max-width:720px){
      #pageHome{--hx:16px;--hy:14px;--hxr:100px;}
      .avatar-panel{min-height:190px;}
      .avatar-sprite,#avatarCanvas{width:110px;height:110px;}
    }
    @media (max-width:520px){
      .avatar-panel{min-height:160px;}
    }

    /* ── NAV MAP TILE (live TeslaNav map — seamless, no chrome) ── */
    /* Register the framing vars so they can transition. Unregistered,
       toggling .expanded snaps them instantly while the tile box
       animates — and since the iframe derives its size/transform from
       these vars + the tile's 100%, the map content jumped 2.7× in a
       single frame before the tile started moving. Registered, they
       interpolate on the same 180ms clock as the box (transition
       below), so the morph is one continuous zoom/reveal.
       Needs Chromium 85+ / Safari 16.4+ / Firefox 128+; older
       browsers ignore @property and get the previous snap behavior. */
    @property --nav-zoom{syntax:"<number>";inherits:true;initial-value:.7;}
    @property --crop-l{syntax:"<length>";inherits:true;initial-value:410px;}
    @property --crop-r{syntax:"<length>";inherits:true;initial-value:250px;}
    @property --crop-t{syntax:"<length>";inherits:true;initial-value:110px;}
    @property --crop-b{syntax:"<length>";inherits:true;initial-value:120px;}
    .nav-section{
      --nav-zoom:.7;
      /* Collapsed: the app's edge UI is cropped out — map only.
         Crop values are in the app's own px, measured from its layout
         (github.com/R44VC0RP/teslanav.com, app/page.tsx):
         l = bottom control row (brand + settings/feedback/satellite, ~385px)
         r = zoom + theme cluster (~232px)
         t = support button + compass (~90px)
         b = control row height (~88px)
         Retune if the upstream app's chrome changes. */
      --crop-l:410px;
      --crop-r:250px;
      --crop-t:110px;
      --crop-b:120px;
      border:1px solid var(--border);
      border-radius:18px;
      overflow:hidden;
      background:var(--bg-raised);
      /* Square tile: width is 340px (JS tileWidths) and min-height
         matches — every child is absolute, so min-height IS the height. */
      min-height:340px;
      /* Tile box AND the map framing vars on one clock (see @property
         above). The iframe recomputes its size/transform from the
         interpolated vars every frame, so expand/collapse reads as a
         continuous morph instead of jump-then-slide. Must repeat the
         box props: this rule follows .home-tile in the sheet and
         would otherwise override its transition for this element. */
      transition:left .18s var(--ease-out),top .18s var(--ease-out),width .18s var(--ease-out),min-height .18s var(--ease-out),
                 --nav-zoom .18s var(--ease-out),--crop-l .18s var(--ease-out),--crop-r .18s var(--ease-out),--crop-t .18s var(--ease-out),--crop-b .18s var(--ease-out);
    }
    /* While the JS morph (setNavExpanded) is running, the tile box and
       framing vars are pinned inline per frame — CSS transitions must
       stay out of the way so the two never fight over the same props. */
    .nav-section.nav-morphing{transition:none;}
    /* The wrapper carries the zoom as a pure-GPU transform during the
       morph. The cross-origin map re-renders on every iframe resize,
       so resizing the iframe ~12 times mid-animation was what made the
       morph choppy — instead the iframe is frozen at a fixed size and
       this wrapper scales/pans the already-rasterized layer. */
    .nav-frame-wrap{
      position:absolute;inset:0;
      transform-origin:top left;
    }
    /* TeslaNav is a full-screen app: render a virtual viewport bigger
       than the tile and show only the map's center, so the edge UI
       falls outside the visible window (the map stays pannable).
       Same family of trick as the chat panel's iframe scaling.
       Tune: --nav-zoom (lower = smaller UI) and --crop-* (hide more). */
    .nav-section iframe{
      position:absolute;top:0;left:0;
      width:calc((100% + var(--nav-zoom) * (var(--crop-l) + var(--crop-r))) / var(--nav-zoom));
      height:calc((100% + var(--nav-zoom) * (var(--crop-t) + var(--crop-b))) / var(--nav-zoom));
      border:none;display:block;
      transform:translate(
        calc(-1 * var(--nav-zoom) * var(--crop-l)),
        calc(-1 * var(--nav-zoom) * var(--crop-t))
      ) scale(var(--nav-zoom));
      transform-origin:top left;
      /* NOTE: no transition here — this browser sticks width/transform
         transitions on var()-derived targets. During the expand/collapse
         morph the JS driver (setNavExpanded) freezes this iframe at a
         fixed size and animates the .nav-frame-wrap transform instead —
         the map never resizes mid-animation. The registered
         --nav-zoom/--crop-* transitions on the tile remain as the
         fallback for any path that toggles .expanded without the JS
         morph (the iframe then recomputes size/transform per frame). */
    }
    /* Expanded: the tile grows to fill the content area in place — one
       iframe instance, it never reloads. The layout engine's inline
       left/top/width are overridden while .expanded. */
    .nav-section.expanded{
      /* 0.8×: the whole app (map + its UI) renders 20% smaller while
         filling the content area. Crops stay 0 so the app's controls
         remain in frame (top-left framing; the JS morph picks these
         values up automatically). */
      --nav-zoom:.8;
      --crop-l:0px;
      --crop-r:0px;
      --crop-t:0px;
      --crop-b:0px;
      left:var(--hx) !important;
      top:var(--hy) !important;
      width:calc(100% - var(--hx) - var(--hxr)) !important;
      min-height:calc(100% - var(--hy) - 156px) !important;
      z-index:40 !important;
    }
    /* Corner control: hover-reveal on pointer devices, always tappable
       on touch (the car). */
    .nav-expand{
      position:absolute;top:12px;right:12px;z-index:6;
      width:34px;height:34px;border-radius:999px;
      border:1px solid rgba(255,255,255,.18);
      background:rgba(10,10,12,.66);
      backdrop-filter:blur(10px);
      -webkit-backdrop-filter:blur(10px);
      color:#fff;cursor:pointer;
      display:flex;align-items:center;justify-content:center;
      opacity:0;transform:scale(.85);
      pointer-events:none;
      transition:opacity .18s var(--ease-out),transform .22s var(--ease-spring),
                 background .15s,border-color .15s;
    }
    .nav-section:hover .nav-expand,
    .nav-section.expanded .nav-expand{
      opacity:1;transform:scale(1);
      pointer-events:auto;
    }
    @media (hover:none){
      .nav-expand{opacity:.75;transform:scale(1);pointer-events:auto;}
    }
    .nav-expand:hover{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.32);}
    .nav-expand:active{transform:scale(.9);}
    .nav-expand svg{
      width:15px;height:15px;fill:none;stroke:currentColor;
      stroke-width:2;stroke-linecap:round;stroke-linejoin:round;
    }
    .nav-expand .ic-collapse{display:none;}
    .nav-section.expanded .ic-expand{display:none;}
    .nav-section.expanded .ic-collapse{display:block;}
    /* Transparent grab surface: the cross-origin iframe swallows every
       pointer event, so without it the tile could never be held/dragged.
       Collapsed: the layer is ALWAYS live — the 420ms hold that starts
       arrange mode must reach the tile (the iframe would eat it).
       Trade-off: the small map can't be panned while collapsed —
       expand it to pan.
       Expanded: the layer steps aside so the full-size map is fully
       pannable; collapse it (corner button) to move the tile. */
    .nav-drag-layer{
      position:absolute;inset:0;z-index:5;
      pointer-events:auto;
      cursor:grab;
    }
    .nav-section.expanded .nav-drag-layer{
      pointer-events:none;cursor:default;
    }
    #pageHome.arranging #navSection>.nav-drag-layer{
      pointer-events:auto;
      cursor:grab;
    }
    @media (max-width:720px){
      .nav-section{min-height:300px;}
    }

    /* ── NEWS POPUP ── */
    .news-pop{
      position:fixed;inset:0;z-index:420;
      display:flex;align-items:center;justify-content:center;
      padding:28px;
      background:rgba(0,0,0,.72);
      -webkit-backdrop-filter:blur(14px);
      backdrop-filter:blur(14px);
      opacity:0;visibility:hidden;pointer-events:none;
      transition:opacity .32s var(--ease-smooth),visibility .32s var(--ease-smooth);
    }
    .news-pop.open{opacity:1;visibility:visible;pointer-events:auto;}
    .news-pop-card{
      width:min(720px,100%);
      max-height:min(86vh,780px);
      background:#121216;
      border:1px solid var(--border-em);
      border-radius:22px;
      overflow:hidden;
      display:flex;flex-direction:column;
      box-shadow:0 30px 80px rgba(0,0,0,.58),var(--tile-shadow);
      transform:translateY(18px) scale(.96);
      opacity:.7;
      transition:transform .42s var(--ease-spring),opacity .32s var(--ease-out);
    }
    .news-pop.open .news-pop-card{transform:none;opacity:1;}
    .news-pop-img{
      position:relative;flex:0 0 260px;min-height:190px;
      background:
        linear-gradient(160deg,hsl(var(--h) 73% 42% /.22),rgba(0,0,0,.35)),
        var(--surface-em);
      overflow:hidden;
    }
    .news-pop-img img{
      width:100%;height:100%;object-fit:cover;display:block;
    }
    .news-pop-img::after{
      content:'';position:absolute;left:0;right:0;bottom:0;height:72px;
      background:linear-gradient(to top,#121216,transparent);
      pointer-events:none;
    }
    .news-pop-body{
      padding:10px 26px 24px;
      display:flex;flex-direction:column;gap:12px;
      overflow:auto;
      min-height:0;
    }
    .news-pop-meta{
      display:flex;align-items:center;gap:8px;
      font-size:11px;font-weight:700;letter-spacing:.08em;
      text-transform:uppercase;color:var(--muted);
    }
    .news-pop-meta .news-idx{color:var(--accent);}
    .news-pop-title{
      font-size:26px;font-weight:800;line-height:1.2;letter-spacing:-.03em;
      color:var(--text);
    }
    .news-pop-desc{
      font-size:15px;font-weight:400;line-height:1.55;
      color:rgba(255,255,255,.68);
    }
    .news-pop-actions{display:flex;gap:12px;margin-top:8px;}
    .news-pop-open{
      appearance:none;border:none;cursor:pointer;
      height:44px;padding:0 20px;border-radius:999px;
      background:var(--accent);color:#062B12;
      font-family:inherit;font-size:13px;font-weight:800;letter-spacing:.02em;
      box-shadow:var(--accent-glow);
      transition:transform .3s var(--ease-spring),filter .2s var(--ease-smooth);
    }
    .news-pop-open:hover{filter:brightness(1.05);}
    .news-pop-open:active{transform:scale(.96);}
    .news-pop-hint{
      margin-left:auto;align-self:center;
      font-size:11px;color:var(--muted2);
    }

    /* ── SECTIONS ── */
    /* Page viewport: three stacked full-screen pages (home / streams / filler) */
    main.page-viewport{
      position:fixed;top:44px;left:0;right:0;bottom:0;
      padding:0;z-index:1;overflow:hidden;
    }
    .page{
      position:absolute;inset:0;
      overflow-y:auto;overscroll-behavior:contain;
      padding:16px 104px 140px 24px;
      scrollbar-width:none;
      will-change:transform,filter;
      transition:transform .62s var(--ease-duo),filter .62s var(--ease-duo);
    }
    .page::-webkit-scrollbar{display:none;}
    .page.pos-above{transform:translateY(-101.5%);}
    .page.pos-active{transform:translateY(0);}
    .page.pos-below{transform:translateY(101.5%);}
    /* leaving page on tap: fog builds in fast (~90ms) then melts with
       the slide — one animation, so no whole-screen flash frame */
    .page.fog-out{animation:fogOut .62s both;}
    @keyframes fogOut{
      0%  {filter:none;animation-timing-function:linear;}
      14% {filter:blur(8px) brightness(.7);animation-timing-function:var(--ease-duo);}
      100%{filter:none;}
    }
    /* hover previews: current page nudges + frosts, target peeks in */
    .page-viewport.preview-down .page.pos-active{transform:translateY(-5%);filter:blur(3px) brightness(.8);transition-duration:.38s;}
    .page-viewport.preview-down .page.pos-below{transform:translateY(94.5%);transition-duration:.38s;}
    .page-viewport.preview-up .page.pos-active{transform:translateY(5%);filter:blur(3px) brightness(.8);transition-duration:.38s;}
    .page-viewport.preview-up .page.pos-above{transform:translateY(-94.5%);transition-duration:.38s;}
    section{
      margin:24px 24px;
      animation:sectionReveal .8s var(--ease-out) both;
    }
    section:nth-of-type(1){animation-delay:calc(var(--boot-delay) + .05s);}
    section:nth-of-type(2){animation-delay:calc(var(--boot-delay) + .12s);}
    section:nth-of-type(3){animation-delay:calc(var(--boot-delay) + .19s);}
    section:nth-of-type(4){animation-delay:calc(var(--boot-delay) + .26s);}
    @keyframes sectionReveal{
      from{opacity:0;transform:translateY(10px);}
      to  {opacity:1;transform:translateY(0);}
    }
    .sec-head{
      display:flex;align-items:center;gap:10px;
      padding:0 2px 12px;
    }
    .sec-head::before{
      content:'';width:3px;height:16px;
      background:var(--accent);border-radius:999px;flex-shrink:0;
      box-shadow:0 0 10px hsl(var(--h) 73% 42% /.45);
      animation:accentBarBreathe 3.5s var(--ease-smooth) infinite;
    }
    @keyframes accentBarBreathe{
      0%,100% {opacity:.85;transform:scaleY(1);}
      50%     {opacity:1;transform:scaleY(1.15);}
    }
    .sec-head span{
      font-size:18px;font-weight:800;letter-spacing:-.01em;
      color:#fff;
    }
    .sec-head::after{content:'';flex:1;height:1px;background:var(--border);}

    /* ── HORIZONTAL SCROLL ROW ── */
    .row{
      display:flex;
      gap:14px;
      padding:0 2px 8px;
      overflow-x:auto;
      overflow-y:visible;
      scroll-snap-type:x mandatory;
      scroll-padding-left:2px;
      -webkit-overflow-scrolling:touch;
      scrollbar-width:none;
    }
    .row::-webkit-scrollbar{display:none;}

    /* ── CARD ── */
    .card{
      flex:0 0 auto;
      width:172px;
      height:200px;
      border-radius:16px;
      background:
        linear-gradient(155deg,rgba(255,255,255,.03) 0%,transparent 45%),
        var(--surface);
      border:1px solid var(--border);
      box-shadow:var(--tile-shadow);
      display:flex;
      flex-direction:column;
      gap:10px;
      padding:12px;
      cursor:pointer;
      scroll-snap-align:start;
      transition:
        background .25s var(--ease-smooth),
        border-color .25s var(--ease-smooth),
        transform .35s var(--ease-spring),
        box-shadow .25s var(--ease-smooth);
      opacity:0;
      animation:fadeUp .65s var(--ease-out) forwards;
      user-select:none;
      position:relative;
      overflow:hidden;
    }
    .card::before{
      content:'';position:absolute;
      top:0;left:0;right:0;height:1px;
      background:rgba(255,255,255,0.08);
      z-index:2;
    }
    .card::after{
      content:'';position:absolute;
      top:0;left:-60%;width:50%;height:100%;
      background:linear-gradient(115deg,
        transparent 0%,
        rgba(255,255,255,.035) 45%,
        rgba(255,255,255,.08) 50%,
        rgba(255,255,255,.035) 55%,
        transparent 100%);
      transform:skewX(-18deg);
      pointer-events:none;
      animation:sheen 9s var(--ease-smooth) infinite;
      animation-delay:var(--sheen-delay,0s);
    }
    @keyframes sheen{
      0%,70%   {left:-60%;opacity:0;}
      75%      {opacity:1;}
      100%     {left:130%;opacity:0;}
    }
    .card:hover{
      border-color:var(--border-em);
      transform:translateY(-4px);
      background:
        linear-gradient(155deg,rgba(255,255,255,.045) 0%,transparent 45%),
        var(--surface-em);
      box-shadow:0 18px 34px rgba(0,0,0,.26),var(--tile-shadow);
    }
    .card:active{
      transform:scale(0.955);
      background:var(--surface-active);
      border-color:hsl(var(--h) 73% 42% /.55);
      box-shadow:var(--accent-glow),var(--tile-shadow);
    }
    .card-media{
      width:100%;
      height:118px;
      border-radius:12px;
      background:
        linear-gradient(145deg,rgba(255,255,255,.045),rgba(0,0,0,.22)),
        #101014;
      display:flex;
      align-items:center;
      justify-content:center;
      overflow:hidden;
      position:relative;
    }
    .card-media img{
      max-width:70%;
      max-height:70%;
      object-fit:contain;
      pointer-events:none;
      transition:opacity .2s var(--ease-smooth),transform .35s var(--ease-spring);
      position:relative;z-index:1;
    }
    .card:hover .card-media img{transform:scale(1.06);}
    .card:active .card-media img{opacity:.85;transform:scale(.96);}
    .card-name{
      font-size:13px;
      font-weight:700;
      color:#fff;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }
    .card-sub{
      font-size:10px;
      font-weight:600;
      color:var(--muted2);
      text-transform:uppercase;
      letter-spacing:.08em;
    }

    @keyframes fadeUp{
      0%   {opacity:0;transform:translateY(14px) scale(.97);filter:blur(4px);}
      60%  {filter:blur(0);}
      100% {opacity:1;transform:translateY(0) scale(1);filter:blur(0);}
    }
    .row .card{transform:translateY(14px);}
    .row .card:nth-child(1) {animation-delay:calc(var(--boot-delay) + .04s);--sheen-delay:0s;}
    .row .card:nth-child(2) {animation-delay:calc(var(--boot-delay) + .09s);--sheen-delay:1.1s;}
    .row .card:nth-child(3) {animation-delay:calc(var(--boot-delay) + .14s);--sheen-delay:2.3s;}
    .row .card:nth-child(4) {animation-delay:calc(var(--boot-delay) + .19s);--sheen-delay:3.5s;}
    .row .card:nth-child(5) {animation-delay:calc(var(--boot-delay) + .24s);--sheen-delay:4.7s;}
    .row .card:nth-child(6) {animation-delay:calc(var(--boot-delay) + .29s);--sheen-delay:5.9s;}
    .row .card:nth-child(7) {animation-delay:calc(var(--boot-delay) + .34s);--sheen-delay:7.1s;}
    .row .card:nth-child(8) {animation-delay:calc(var(--boot-delay) + .39s);--sheen-delay:8.3s;}
    .row .card:nth-child(9) {animation-delay:calc(var(--boot-delay) + .44s);--sheen-delay:.5s;}
    .row .card:nth-child(10){animation-delay:calc(var(--boot-delay) + .49s);--sheen-delay:1.7s;}
    .row .card:nth-child(11){animation-delay:calc(var(--boot-delay) + .54s);--sheen-delay:2.9s;}
    .row .card:nth-child(12){animation-delay:calc(var(--boot-delay) + .59s);--sheen-delay:4.1s;}

    /* ── RADIO CARDS ── */
    .radio-card{
      flex:0 0 auto;
      width:172px;
      height:200px;
      border-radius:16px;
      background:
        linear-gradient(155deg,rgba(255,255,255,.03) 0%,transparent 45%),
        var(--surface);
      border:1px solid var(--border);
      box-shadow:var(--tile-shadow);
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      gap:10px;
      padding:14px;
      cursor:pointer;
      scroll-snap-align:start;
      transition:
        background .25s var(--ease-smooth),
        border-color .25s var(--ease-smooth),
        transform .35s var(--ease-spring),
        box-shadow .35s var(--ease-smooth);
      opacity:0;
      animation:fadeUp .65s var(--ease-out) forwards;
      user-select:none;
      position:relative;
      overflow:hidden;
    }
    .radio-card::before{
      content:'';position:absolute;
      top:0;left:0;right:0;height:1px;
      background:rgba(255,255,255,.08);
      z-index:2;
    }
    .radio-card:hover{
      border-color:var(--border-em);
      transform:translateY(-4px);
      background:
        linear-gradient(155deg,rgba(255,255,255,.045) 0%,transparent 45%),
        var(--surface-em);
      box-shadow:0 18px 34px rgba(0,0,0,.26),var(--tile-shadow);
    }
    .radio-card.playing{
      border-color:hsl(var(--h) 73% 42% /.55);
      background:
        radial-gradient(120% 80% at 50% 0%,hsl(var(--h) 73% 42% /.18),transparent 60%),
        hsl(var(--h) 73% 42% /.06);
      box-shadow:var(--accent-glow),var(--tile-shadow);
      animation:fadeUp .65s var(--ease-out) forwards,playingPulse 3.2s var(--ease-smooth) infinite;
    }
    @keyframes playingPulse{
      0%,100% {box-shadow:0 6px 22px -8px hsl(var(--h) 73% 42% /.35),0 0 0 1px hsl(var(--h) 73% 42% /.28),var(--tile-shadow);}
      50%     {box-shadow:0 10px 32px -6px hsl(var(--h) 73% 42% /.55),0 0 0 1px hsl(var(--h) 73% 42% /.45),var(--tile-shadow);}
    }
    .radio-card:active{transform:scale(0.955);}
    .radio-icon{
      width:64px;height:64px;border-radius:50%;
      display:flex;align-items:center;justify-content:center;
      font-size:16px;font-weight:800;letter-spacing:.04em;
      flex-shrink:0;
      position:relative;
      box-shadow:0 10px 24px rgba(0,0,0,.25);
    }
    .radio-card.playing .radio-icon::after{
      content:'';
      position:absolute;inset:-6px;border-radius:50%;
      border:2px solid var(--accent);
      opacity:.5;
      animation:ping 1.4s ease-out infinite;
    }
    @keyframes ping{
      0%{transform:scale(1);opacity:.5}
      100%{transform:scale(1.35);opacity:0}
    }
    .radio-name{
      font-size:13px;font-weight:700;
      color:#fff;text-align:center;
      max-width:92%;white-space:nowrap;
      overflow:hidden;text-overflow:ellipsis;
      pointer-events:none;
    }
    .radio-genre{
      font-size:10px;font-weight:500;
      color:var(--muted);text-align:center;
      pointer-events:none;
    }

    /* ── NOW PLAYING BAR ── */
    .now-playing{
      position:fixed;
      bottom:0;left:0;right:0;
      z-index:300;
      background:
        linear-gradient(180deg,rgba(255,255,255,.025) 0%,transparent 30%),
        var(--bg-raised);
      border-top:1px solid var(--border);
      display:none;
      align-items:center;
      gap:14px;
      padding:12px 22px;
      min-height:66px;
      transition:right .35s var(--ease-fluid),left .35s var(--ease-fluid);
      box-shadow:0 -10px 28px rgba(0,0,0,.3);
    }
    .now-playing.visible{
      display:flex;
      right:64px;
      animation:npSlideUp .55s var(--ease-spring) both;
    }
    @keyframes npSlideUp{
      from{transform:translateY(100%);opacity:.4;}
      to  {transform:translateY(0);opacity:1;}
    }
    .now-playing.has-frame{
      align-items:flex-start;
      padding:12px 22px;
      gap:16px;
    }
    .now-playing.chat-open{left:360px;}
    .now-playing.chat-mini{left:52px;}
    .np-pulse{
      width:10px;height:10px;border-radius:50%;
      background:var(--accent);flex-shrink:0;
      margin-top:2px;
      animation:ping 1.4s ease-out infinite;
    }
    .now-playing.has-frame .np-pulse{margin-top:6px;}
    .np-info{flex:1;min-width:0;}
    .np-name{font-size:14px;font-weight:700;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    .np-genre{font-size:11px;color:var(--muted);margin-top:2px;font-weight:500;}
    .np-frame-wrap{
      flex-shrink:0;
      width:160px;height:90px;
      border-radius:10px;
      overflow:hidden;
      border:1px solid var(--border-em);
      display:none;
      background:#000;
    }
    .now-playing.has-frame .np-frame-wrap{display:block;}
    .np-frame-wrap iframe{width:100%;height:100%;border:none;display:block;}
    .np-stop{
      flex-shrink:0;
      width:48px;height:48px;border-radius:50%;
      background:var(--accent);color:#062B12;
      border:none;cursor:pointer;
      display:flex;align-items:center;justify-content:center;
      transition:background .15s,transform .1s,filter .15s;
      align-self:center;
      box-shadow:var(--accent-glow);
    }
    .np-stop:hover{filter:brightness(1.05);}
    .np-stop:active{transform:scale(0.88);}
    .np-stop svg{width:13px;height:13px;fill:currentColor;}

    /* ── CHAT PANEL ── */
    .chat-panel{
      position:fixed;
      top:0;left:0;bottom:0;
      width:360px;
      z-index:400;
      background:#0E0E12;
      border-right:1px solid var(--border);
      display:flex;
      flex-direction:column;
      transform:translateX(-100%);
      transition:transform .45s var(--ease-fluid);
      will-change:transform;
      box-shadow:8px 0 32px rgba(0,0,0,.38);
    }
    .chat-panel.open{transform:translateX(0);}

    .chat-header{
      display:flex;
      align-items:center;
      gap:10px;
      padding:0 14px;
      height:56px;
      border-bottom:1px solid var(--border);
      flex-shrink:0;
      background:#0E0E12;
    }
    .chat-live-dot{
      width:8px;height:8px;border-radius:50%;
      background:var(--accent-2);flex-shrink:0;
      animation:ping 1.4s ease-out infinite;
    }
    .chat-title-wrap{flex:1;min-width:0;}
    .chat-title{
      font-size:14px;font-weight:700;
      color:#fff;
      white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
      display:block;
    }
    .chat-viewers{
      font-size:10px;color:var(--accent-2);font-weight:700;
      display:none;align-items:center;gap:4px;margin-top:2px;
    }
    .chat-viewers.visible{display:flex;}
    .chat-viewers svg{width:10px;height:10px;fill:var(--accent-2);}

    .chat-btn{
      flex-shrink:0;
      width:44px;height:44px;
      border:none;background:transparent;cursor:pointer;
      border-radius:999px;
      display:flex;align-items:center;justify-content:center;
      color:var(--muted);
      transition:background .15s,color .15s,transform .1s;
    }
    .chat-btn:hover{background:rgba(255,255,255,.05);color:#fff;}
    .chat-btn:active{background:rgba(255,255,255,.08);transform:scale(0.9);color:#fff;}
    .chat-btn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}

    .chat-body{
      flex:1;
      overflow:hidden;
      position:relative;
      background:#101014;
    }
    .chat-body iframe{
      position:absolute;
      top:0;left:0;
      width:80%;
      height:80%;
      border:none;display:block;
      transform:scale(1.25);
      transform-origin:top left;
    }

    /* ── CHAT MINIMIZED PILL ── */
    .chat-pill{
      position:fixed;
      left:0;
      bottom:74px;
      transform:translateX(-100%);
      z-index:401;
      background:#8B5CF6;
      border-radius:0 14px 14px 0;
      width:54px;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      gap:6px;
      padding:16px 0;
      cursor:pointer;
      border:1px solid rgba(139,92,246,.42);
      border-left:none;
      transition:transform .45s var(--ease-spring),background .25s var(--ease-smooth);
      user-select:none;
      box-shadow:4px 0 18px rgba(139,92,246,.28);
    }
    .chat-pill.visible{transform:translateX(0);}
    .chat-pill:active{background:#7C3AED;}
    .chat-pill svg{width:22px;height:22px;stroke:#fff;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
    .chat-pill-label{
      font-size:9px;font-weight:800;letter-spacing:.1em;
      color:#fff;text-transform:uppercase;
      writing-mode:vertical-rl;
      text-orientation:mixed;
    }

    ::-webkit-scrollbar{width:3px}
    ::-webkit-scrollbar-track{background:transparent}
    ::-webkit-scrollbar-thumb{background:var(--border-em);border-radius:999px}

    /* ── BOOT OVERLAY ── */
    .boot-overlay{
      position:fixed;inset:0;z-index:9999;
      background:#000;
      display:flex;align-items:center;justify-content:center;
      animation:bootCurtainLift 1s var(--ease-fluid) 1.7s forwards;
      pointer-events:auto;
    }
    @keyframes bootCurtainLift{
      0%   {opacity:1;transform:scale(1);}
      100% {opacity:0;transform:scale(1.06);visibility:hidden;}
    }
    .boot-mark{
      display:flex;flex-direction:column;align-items:center;gap:24px;
      animation:bootMarkDrift 1s var(--ease-fluid) 1.7s forwards;
    }
    @keyframes bootMarkDrift{
      to{transform:translateY(-12px);opacity:.6;}
    }
    .boot-t{
      width:88px;height:88px;
      background:var(--accent);
      border-radius:22px;
      display:flex;align-items:center;justify-content:center;
      font-size:46px;font-weight:800;color:#07110C;
      letter-spacing:-.02em;
      opacity:0;transform:scale(.55);filter:blur(10px);
      animation:
        bootTIn .8s var(--ease-spring) .15s forwards,
        bootTGlow 2.4s var(--ease-smooth) .95s infinite;
    }
    @keyframes bootTIn{
      to{opacity:1;transform:scale(1);filter:blur(0);}
    }
    @keyframes bootTGlow{
      0%,100% {box-shadow:0 0 0 0 hsl(var(--h) 73% 42% /.4),0 8px 28px hsl(var(--h) 73% 42% /.32);}
      50%     {box-shadow:0 0 0 16px hsl(var(--h) 73% 42% /0),0 14px 44px hsl(var(--h) 73% 42% /.55);}
    }
    .boot-name{
      font-size:13px;font-weight:700;letter-spacing:.45em;
      color:var(--text);text-transform:uppercase;
      opacity:0;
      animation:bootNameIn .65s var(--ease-out) .55s forwards;
    }
    .boot-name span{color:var(--muted);font-weight:400;margin-left:6px;letter-spacing:.4em;}
    @keyframes bootNameIn{
      from{opacity:0;letter-spacing:.7em;filter:blur(3px);}
      to  {opacity:1;letter-spacing:.45em;filter:blur(0);}
    }
    .boot-progress{
      width:124px;height:2px;
      background:rgba(255,255,255,.07);
      border-radius:999px;overflow:hidden;position:relative;
      opacity:0;
      animation:bootProgShow .35s var(--ease-out) .85s forwards;
    }
    .boot-progress::after{
      content:'';position:absolute;left:0;top:0;bottom:0;width:100%;
      background:linear-gradient(90deg,
        hsl(var(--h) 73% 42% /.4) 0%,
        var(--accent) 50%,
        hsl(var(--h) 73% 42% /.6) 100%);
      transform-origin:left center;
      transform:scaleX(0);
      box-shadow:0 0 10px hsl(var(--h) 73% 42% /.55);
      animation:bootProgFill .95s var(--ease-smooth) .9s forwards;
    }
    @keyframes bootProgShow{to{opacity:1;}}
    @keyframes bootProgFill{
      0%   {transform:scaleX(0);}
      100% {transform:scaleX(1);}
    }

    /* ── RIGHT PAGE RAIL ── */
    .page-rail{
      position:fixed;right:14px;top:50%;transform:translateY(-50%);
      z-index:600;display:flex;flex-direction:column;gap:8px;
      padding:8px;user-select:none;touch-action:none;
      background:rgba(20,20,26,.55);
      backdrop-filter:blur(22px) saturate(1.5);
      -webkit-backdrop-filter:blur(22px) saturate(1.5);
      border:1px solid rgba(255,255,255,.12);
      border-radius:20px;
      box-shadow:0 18px 40px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.08);
      animation:railIn .6s var(--ease-out) calc(var(--boot-delay) + .3s) both;
    }
    @keyframes railIn{
      from{opacity:0;transform:translateY(-50%) translateX(12px);}
      to  {opacity:1;transform:translateY(-50%) translateX(0);}
    }
    .rail-indicator{
      position:absolute;left:6px;right:6px;height:40px;top:8px;
      border-radius:12px;pointer-events:none;
      background:var(--accent-soft);
      border:1px solid hsl(var(--h) 73% 42% /.5);
      box-shadow:0 0 18px hsl(var(--h) 73% 42% /.35),inset 0 1px 0 rgba(255,255,255,.12);
      transition:top .5s var(--ease-spring);
    }
    .rail-btn{
      position:relative;width:40px;height:40px;border-radius:12px;
      border:1px solid transparent;background:transparent;
      color:var(--muted);cursor:pointer;touch-action:none;
      display:flex;align-items:center;justify-content:center;
      transition:
        color .25s var(--ease-smooth),
        background .25s var(--ease-smooth),
        transform .3s var(--ease-spring);
    }
    .rail-btn:hover{color:#fff;background:rgba(255,255,255,.07);}
    .rail-btn:active{transform:scale(.9);}
    .rail-btn.active{color:var(--accent);}
    .rail-btn.drag-target{color:#fff;background:rgba(255,255,255,.08);}
    .rail-btn svg{width:17px;height:17px;pointer-events:none;}
    .rail-btn::after{
      content:attr(data-label);
      position:absolute;right:calc(100% + 12px);top:50%;
      transform:translateY(-50%) translateX(5px);
      font-size:10px;font-weight:700;letter-spacing:.12em;
      text-transform:uppercase;color:#fff;
      background:rgba(15,15,19,.92);border:1px solid var(--border);
      padding:5px 10px;border-radius:8px;white-space:nowrap;
      opacity:0;pointer-events:none;
      transition:opacity .25s var(--ease-smooth),transform .25s var(--ease-smooth);
    }
    .rail-btn:hover::after{opacity:1;transform:translateY(-50%) translateX(0);}

    /* ── STREAMS PAGE GRID ── */
    .streams-grid{
      display:grid;gap:14px;
      grid-template-columns:repeat(auto-fill,minmax(172px,1fr));
      max-width:1080px;margin:0 auto;
    }
    .streams-grid .card{width:100%;}

    /* ── NARROW / HALF SCREEN ── */
    @media (max-width:640px){
      .page{padding:12px 92px 140px 12px;}
      .page-rail{right:8px;}
      .island-bar{top:56px;right:10px;width:54px;gap:7px;}
      #pageHome{--hx:12px;--hy:12px;--hxr:92px;}
      .sec-head{padding:0 2px 10px;}
      .row{gap:10px;padding:0 2px 4px;}
      .card{width:134px;height:162px;border-radius:14px;padding:10px;}
      .card-media{height:92px;border-radius:10px;}
      .radio-card{width:134px;height:162px;border-radius:14px;}
      .radio-icon{width:54px;height:54px;font-size:14px;}
      section{margin:18px 14px;}
      .now-playing{padding:10px 14px;}
      .np-frame-wrap{width:120px;height:68px;}
      .chat-panel{width:300px;}
      .now-playing.chat-open{left:300px;}
      .now-playing.chat-mini{left:44px;}
    }

    @media (max-width:520px){

  function updateYearProgress(){
    const now     = new Date();
    const year    = now.getFullYear();
    const start   = new Date(year, 0, 1);
    const end     = new Date(year + 1, 0, 1);
    const elapsed = now - start;
    const total   = end - start;
    const pct     = elapsed / total;
    const daysLeft= Math.ceil((end - now) / 86400000);

    const daysEl = document.getElementById('yrDays');
    daysEl.textContent = daysLeft.toLocaleString('en-US');

    const circ  = 2 * Math.PI * 20;
    const fill  = document.getElementById('yrFill');
    fill.setAttribute('stroke-dasharray', circ.toFixed(2));
    fill.setAttribute('stroke-dashoffset', (circ * (1 - pct)).toFixed(2));

    /* Year-progress status colors — deliberately FIXED (not the accent
       hue): this is a "time left this year" gauge, green→yellow→red, so
       the T-logo color slider must not tint it. The days number stays
       white: setAttribute is a presentation attribute and loses to the
       CSS .yr-arc-days{fill:#fff} rule, exactly as before. */
    const colour = pct < 0.5  ? '#1DB954'
               : pct < 0.75 ? '#FFD166'
               :               '#FF453A';
    fill.setAttribute('stroke', colour);
    daysEl.setAttribute('fill', colour);

  /* ── ACCENT HUE (tap the T logo → slider recolors every UI green) ──
     One knob: --h on :root. Every accent/green in the sheet derives
     from it as hsl(var(--h) S% L%). The choice persists in
     localStorage and is restored before first paint (script is
     parser-blocking at the end of <body>). */

  function hueToHex(h, s, l){
    s /= 100; l /= 100;
    const k = n => (n + h / 30) % 12;
    const a = s * Math.min(l, 1 - l);
    const f = n => l - a * Math.max(-1, Math.min(k(n) - 3, Math.min(9 - k(n), 1)));
    const to2 = x => Math.round(255 * x).toString(16).padStart(2, '0');
    return ('#' + to2(f(0)) + to2(f(8)) + to2(f(4))).toUpperCase();
  }
  function setAccentHue(h, persist){
    h = Math.round(Number(h));
    if(!Number.isFinite(h) || h < 0 || h > 360) h = ACCENT_DEFAULT;
    document.documentElement.style.setProperty('--h', h);
    if(accentHue) accentHue.value = h;
    if(accentHex) accentHex.textContent = hueToHex(h, 73, 42);
    if(persist){ try{ localStorage.setItem(ACCENT_KEY, String(h)); }catch(e){} }
  }
  (function restoreAccentHue(){
    let saved = ACCENT_DEFAULT;
    try{
      const v = parseInt(localStorage.getItem(ACCENT_KEY), 10);

  async function fetchYahoo(sym){
    const yfUrl = `https://query1.finance.yahoo.com/v8/finance/chart/${sym}?interval=1d&range=5d`;
    const res   = await fetch(PROXY + encodeURIComponent(yfUrl), {signal: AbortSignal.timeout(10000)});

    const json  = await res.json();
    const meta  = json.chart.result[0].meta;
    const state = (meta.marketState || '').toUpperCase();
    const isOpen= state === 'REGULAR';
    const price = meta.regularMarketPrice;
    const prev  = meta.previousClose || meta.chartPreviousClose || price;
    const change= +(price - prev).toFixed(4);
    const pct   = +((change / prev) * 100).toFixed(4);
    return {price, change, pct, closed: !isOpen};
  }

  // Sources split into two kinds:
  //   type:'api'  -> direct, CORS-enabled JSON API, no proxy (reliable, fast)
  //   type:'rss'  -> RSS fetched through the public proxy chain (best-effort)
  // `limit` = how many items to pull per refresh; The Verge is weighted
  // highest since it's the richest, most visual feed.
  const NEWS_SOURCES = [
    {id:'devto',    name:'Dev.to',      kind:'tech', type:'api', limit:15},
    {id:'verge',    name:'The Verge',   kind:'tech', type:'rss', url:'https://www.theverge.com/rss/index.xml', limit:20, weight:2},
    {id:'bbc-tech', name:'BBC Tech',    kind:'tech', type:'rss', url:'https://feeds.bbci.co.uk/news/technology/rss.xml', limit:10},
    {id:'tc',       name:'TechCrunch',  kind:'tech', type:'rss', url:'https://techcrunch.com/feed/', limit:10},
    {id:'bbc-top',  name:'BBC News',    kind:'top',  type:'rss', url:'https://feeds.bbci.co.uk/news/rss.xml', limit:10},
  ];
  // Per-source representation multiplier used when building the deck.
  const NEWS_BOOST = Object.fromEntries(NEWS_SOURCES.filter(s => s.weight > 1).map(s => [s.name, s.weight]));

  // Public CORS proxies tried in order when fetching RSS (no server of our own).
  const NEWS_PROXIES = [
    {name:'allorigins-raw', make:u => 'https://api.allorigins.win/raw?url=' + encodeURIComponent(u)},
    {name:'corsproxy',      make:u => 'https://corsproxy.io/?url=' + encodeURIComponent(u)},
    {name:'codetabs',       make:u => 'https://api.codetabs.com/v1/proxy?quest=' + encodeURIComponent(u)},
    {name:'allorigins-get', make:u => 'https://api.allorigins.win/get?url=' + encodeURIComponent(u),
                            unwrap:async res => (await res.json()).contents},
  ];
  const NEWS_PROXY_KEY = 'tcinema.newsProxy';

  function rememberNewsProxy(idx){
    try{ localStorage.setItem(NEWS_PROXY_KEY, String(idx)); }catch(e){}
  }
  function newsProxyOrder(){
    const order = NEWS_PROXIES.map((_, i) => i);
    try{
      const preferred = parseInt(localStorage.getItem(NEWS_PROXY_KEY) || '', 10);
      if(!Number.isNaN(preferred) && NEWS_PROXIES[preferred]){
        order.splice(order.indexOf(preferred), 1);
        order.unshift(preferred);
      }
    }catch(e){}
    return order;
  }
  async function fetchRssText(rssUrl){
    let lastErr = null;
    for(const idx of newsProxyOrder()){
      const p = NEWS_PROXIES[idx];
      try{
        const res  = await fetch(p.make(rssUrl), {signal: AbortSignal.timeout(5000), cache:'no-store'});
        if(!res.ok) throw new Error('HTTP ' + res.status);
        const text = p.unwrap ? await p.unwrap(res) : await res.text();
        if(!text || text.trim().length < 50) throw new Error('empty response');
        rememberNewsProxy(idx);
        return text;
      }catch(err){ lastErr = err; }
    }
    throw lastErr || new Error('all proxies failed');
  }

  async function fetchDevto(){
    // Direct API — our most reliable source. One quick retry on transient
    // failures (it lands well inside the 25s phase-1 window).
    let res = null;
    for(let attempt = 0; attempt < 2; attempt++){
      try {
        res = await fetch('https://dev.to/api/articles?per_page=15', {signal: AbortSignal.timeout(8000), cache:'no-store'});
        if(res.ok) break;
        res = null;
      } catch(e){ res = null; }
      if(attempt === 0) await new Promise(r => setTimeout(r, 1000));
    }
    if(!res || !res.ok) throw new Error('dev.to unavailable');
    const j = await res.json();
    return (Array.isArray(j) ? j : []).map(a => ({
      title: cleanNewsTitle(a.title),
      pubDate: a.published_at || '',
      link: a.canonical_url || a.url || '',
      description: (a.description || '').slice(0, 220),
      image: a.cover_image || '',
      source: 'Dev.to',
      feedId: 'devto',
      kind: 'tech'
    })).filter(i => i.title);
  }

  async function fetchSource(src){
    if(src.type === 'api'){
      return src.id === 'devto' ? fetchDevto() : [];
    }
    const text = await fetchRssText(src.url);
    const doc  = new DOMParser().parseFromString(text, 'text/xml');
    if(doc.querySelector('parsererror')) throw new Error('XML parse error (' + src.id + ')');
    return parseFeedItems(doc, src, src.limit || 10);
  }

  // Race a batch of source promises against a deadline. Resolves with
  // whatever has settled so far; late sources keep running in the background
  // (their underlying promises are shared, so a later call sees them).
  function settleBatch(tasks, ms){
    return Promise.all(tasks.map(p =>
      Promise.race([p, new Promise(res => setTimeout(() => res(null), ms))])
    ));
  }

  function poolsFromResults(results){
    const seen = new Set();
    const techPool = [];
    const topPool  = [];
    results.forEach(res => {
      if(!res || res.status !== 'ok' || !Array.isArray(res.items)) return;
      res.items.forEach(item => {
        const key = normTitleKey(item.title);
        if(seen.has(key)) return;
        seen.add(key);
        (item.kind === 'top' ? topPool : techPool).push(item);
      });
    });
    return {techPool, topPool};
  }

  function timeAgo(dateStr){
    const diff = (Date.now() - new Date(dateStr).getTime()) / 60000;
    if(isNaN(diff) || diff < 0) return '';
    if(diff < 1)    return 'just now';
    if(diff < 60)   return Math.round(diff) + 'm ago';
    if(diff < 1440) return Math.round(diff / 60) + 'h ago';
    return Math.round(diff / 1440) + 'd ago';
  }

  function decodeRssText(s){
    return (s || '')
      .replace(/<!\[CDATA\[|\]\]>/g, '')
      .replace(/<[^>]+>/g, '')
      .replace(/&amp;/g, '&')
      .replace(/&lt;/g, '<')
      .replace(/&gt;/g, '>')
      .replace(/&#39;/g, "'")
      .replace(/&quot;/g, '"')
      .replace(/&nbsp;/g, ' ')
      .trim();
  }

  function shuffleNews(list){
    const a = list.slice();
    for(let i = a.length - 1; i > 0; i--){
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

    if(url.includes('/standard/240/')) url = url.replace('/standard/240/', '/standard/640/');

  function wrapNewsIdx(next){
    const n = newsItems.length;
    if(!n) return 0;
    return ((next % n) + n) % n;
  }

  function goToNews(next){
    const slides = document.querySelectorAll('.news-slide');
    const pips   = document.querySelectorAll('.news-pip');
    if(!slides.length) return;
    next = wrapNewsIdx(next);
    if(next === newsIdx){
      restartNewsTimer();
      pips[newsIdx] && pips[newsIdx].classList.remove('on');
      void (pips[newsIdx] && pips[newsIdx].offsetWidth);
      pips[newsIdx] && pips[newsIdx].classList.add('on');
      return;
    }

    const prev = newsIdx;
    const goingBack = (next < prev && !(prev === 0 && next === newsItems.length - 1)) ||
                      (prev === 0 && next === newsItems.length - 1);

    newsIdx = next;
    slides[prev].classList.remove('active');
    slides[prev].classList.add(goingBack ? 'exit-right' : 'exit-left');
    slides[next].classList.remove('exit-left', 'exit-right');
    if(goingBack) slides[next].classList.add('from-left');
    void slides[next].offsetWidth;
    slides[next].classList.remove('from-left');
    slides[next].classList.add('active');
    setTimeout(() => {
      if(slides[prev]) slides[prev].classList.remove('exit-left', 'exit-right');
    }, 520);

    pips[prev] && pips[prev].classList.remove('on');
    if(pips[newsIdx]){
      pips[newsIdx].classList.remove('on');
      void pips[newsIdx].offsetWidth;
      pips[newsIdx].classList.add('on');
    }
    setNewsHeaderSource(newsItems[newsIdx]?.source);
    restartNewsTimer();
  }

  function advanceNews(){
    if(!newsItems.length || newsPopupOpen) return;
    goToNews(newsIdx + 1);
  }

  function stepNews(delta){
    if(!newsItems.length) return;
    goToNews(newsIdx + delta);
  }

  // Some feeds stuff newlines / bare URLs into <title>; keep the first
  // line and drop trailing links so the card never shows raw URLs.
  function cleanNewsTitle(t){
    let s = (t || '').split(/\r?\n/)[0].trim();
    s = s.replace(/\s+https?:\/\/\S+.*$/i, '').trim();
    return s;
  }

  function parseRssItems(doc, feed, limit = 10){
    return Array.from(doc.querySelectorAll('item')).slice(0, limit).map(el => {
      const title   = cleanNewsTitle(decodeRssText(el.querySelector('title')?.textContent));
      const pubDate = el.querySelector('pubDate')?.textContent?.trim() || '';
      let description = decodeRssText(el.querySelector('description')?.textContent);
      let link = '';
      el.childNodes.forEach(n => { if(n.nodeName === 'link') link = n.textContent?.trim() || ''; });
      if(!link) link = el.querySelector('guid')?.textContent?.trim() || '';
      return {title, pubDate, link, description, image: rssThumb(el), source: feed.name, feedId: feed.id, kind: feed.kind};
    }).filter(i => i.title && i.title.length > 8);
  }

  // Atom (e.g. The Verge): <entry> elements, <link href="…">, ISO dates,
  // and the article image embedded in the HTML <content>.
  function parseAtomItems(doc, feed, limit = 10){
    return Array.from(doc.querySelectorAll('entry')).slice(0, limit).map(el => {
      const title   = cleanNewsTitle(decodeRssText(el.querySelector('title')?.textContent));
      const pubDate = el.querySelector('published')?.textContent?.trim()
        || el.querySelector('updated')?.textContent?.trim() || '';
      let link = '';
      el.querySelectorAll('link').forEach(l => { if(!link) link = l.getAttribute('href') || ''; });
      if(!link) link = el.querySelector('id')?.textContent?.trim() || '';
      const description = decodeRssText(el.querySelector('summary')?.textContent || '');
      let image = '';
      const mthumb = el.getElementsByTagName('media:thumbnail')[0];
      if(mthumb?.getAttribute('url')) image = mthumb.getAttribute('url');
      else {
        const m = (el.querySelector('content')?.textContent || '').match(/src=["']([^"']+)["']/i);
        if(m) image = decodeRssText(m[1]);
      }
      return {title, pubDate, link, description, image, source: feed.name, feedId: feed.id, kind: feed.kind};
    }).filter(i => i.title && i.title.length > 8);
  }

  function parseFeedItems(doc, feed, limit = 10){
    return doc.querySelector('item') ? parseRssItems(doc, feed, limit) : parseAtomItems(doc, feed, limit);
  }

  function normTitleKey(t){
    return t.toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim().slice(0, 60);
  }

  // ~80% tech/trending, ~20% top stories, interleaved for variety.
  // Sources with a NEWS_BOOST weight appear multiple times in the weighted
  // draw, so their stories are picked more often — but never twice.
  function buildNewsDeck(techPool, topPool){
    const pick = (pool, count) => {
      const seen = new Set();
      const picked = [];
      const rest   = [];
      const weighted = shuffleNews(pool.flatMap(i =>
        Array.from({length: Math.max(1, NEWS_BOOST[i.source] || 1)}, () => i)
      ));
      for(const i of weighted){
        const key = normTitleKey(i.title);
        if(seen.has(key)) continue;
        seen.add(key);
        (picked.length < count ? picked : rest).push(i);
      }
      return {picked, rest};
    };
    const t = pick(techPool, 10);
    const g = pick(topPool, 2);
    const deck = [];
    let ti = 0, gi = 0;
    const pattern = ['t','t','t','t','g','t','t','t','t','g','t','t'];
    for(const kind of pattern){
      if(kind === 't'){ if(ti < t.picked.length) deck.push(t.picked[ti++]); }
      else { if(gi < g.picked.length) deck.push(g.picked[gi++]); }
    }
    // If a pool was thin, fill the empty slots with leftover stories.
    for(const i of [...g.rest, ...t.rest]){
      if(deck.length >= 12) break;
      deck.push(i);
    }
    return deck;
  }

  function scheduleNewsRetry(){
    clearNewsRetry();
    // Backoff: 1 min, 2 min, 3 min... capped at 5 min between attempts.
    const delay = Math.min(60000 * Math.max(newsFailCount, 1), 300000);
    newsRetryTimer = setTimeout(fetchNews, delay);
  }

  function renderNewsError(){
    const container = document.getElementById('newsItems');

      : 'News is unavailable. Retrying automatically…';

    btn.className = 'news-retry-btn';
    btn.textContent = 'Retry now';
    btn.addEventListener('click', (e) => {

      newsFailCount = 0;
      clearNewsRetry();
      fetchNews();
