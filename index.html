      margin-top:2px;
      animation:ping 1.4s ease-out infinite;
    }
    .now-playing.has-frame .np-pulse{margin-top:6px;}
    .np-info{flex:1;min-width:0;}
    .np-name{font-size:14px;font-weight:700;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    .np-genre{font-size:11px;color:var(--muted);margin-top:2px;font-weight:500;}
    .np-frame-wrap{
      flex-shrink:0;
      width:160px;height:90px;
      border-radius:10px;
      overflow:hidden;
      border:1px solid var(--border-em);
      display:none;
      background:#000;
    }
    .now-playing.has-frame .np-frame-wrap{display:block;}
    .np-frame-wrap iframe{width:100%;height:100%;border:none;display:block;}
    .np-stop{
      flex-shrink:0;
      width:48px;height:48px;border-radius:50%;
      background:var(--accent);color:#062B12;
      border:none;cursor:pointer;
      display:flex;align-items:center;justify-content:center;
      transition:background .15s,transform .1s,filter .15s;
      align-self:center;
      box-shadow:var(--accent-glow);
    }
    .np-stop:hover{filter:brightness(1.05);}
    .np-stop:active{transform:scale(0.88);}
    .np-stop svg{width:13px;height:13px;fill:currentColor;}

    /* ── CHAT PANEL ── */
    .chat-panel{
      position:fixed;
      top:0;left:0;bottom:0;
      width:360px;
      z-index:400;
      background:#0E0E12;
      border-right:1px solid var(--border);
      display:flex;
      flex-direction:column;
      transform:translateX(-100%);
      transition:transform .45s var(--ease-fluid);
      will-change:transform;
      box-shadow:8px 0 32px rgba(0,0,0,.38);
    }
    .chat-panel.open{transform:translateX(0);}

    .chat-header{
      display:flex;
      align-items:center;
      gap:10px;
      padding:0 14px;
      height:56px;
      border-bottom:1px solid var(--border);
      flex-shrink:0;
      background:#0E0E12;
    }
    .chat-live-dot{
      width:8px;height:8px;border-radius:50%;
      background:var(--accent-2);flex-shrink:0;
      animation:ping 1.4s ease-out infinite;
    }
    .chat-title-wrap{flex:1;min-width:0;}
    .chat-title{
      font-size:14px;font-weight:700;
      color:#fff;
      white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
      display:block;
    }
    .chat-viewers{
      font-size:10px;color:var(--accent-2);font-weight:700;
      display:none;align-items:center;gap:4px;margin-top:2px;
    }
    .chat-viewers.visible{display:flex;}
    .chat-viewers svg{width:10px;height:10px;fill:var(--accent-2);}

    .chat-btn{
      flex-shrink:0;
      width:44px;height:44px;
      border:none;background:transparent;cursor:pointer;
      border-radius:999px;
      display:flex;align-items:center;justify-content:center;
      color:var(--muted);
      transition:background .15s,color .15s,transform .1s;
    }
    .chat-btn:hover{background:rgba(255,255,255,.05);color:#fff;}
    .chat-btn:active{background:rgba(255,255,255,.08);transform:scale(0.9);color:#fff;}
    .chat-btn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}

    .chat-body{
      flex:1;
      overflow:hidden;
      position:relative;
      background:#101014;
    }
    .chat-body iframe{
      position:absolute;
      top:0;left:0;
      width:80%;
      height:80%;
      border:none;display:block;
      transform:scale(1.25);
      transform-origin:top left;
    }

    /* ── CHAT MINIMIZED PILL ── */
    .chat-pill{
      position:fixed;
      left:0;
      bottom:74px;
      transform:translateX(-100%);
      z-index:401;
      background:#8B5CF6;
      border-radius:0 14px 14px 0;
      width:54px;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      gap:6px;
      padding:16px 0;
      cursor:pointer;
      border:1px solid rgba(139,92,246,.42);
      border-left:none;
      transition:transform .45s var(--ease-spring),background .25s var(--ease-smooth);
      user-select:none;
      box-shadow:4px 0 18px rgba(139,92,246,.28);
    }
    .chat-pill.visible{transform:translateX(0);}
    .chat-pill:active{background:#7C3AED;}
    .chat-pill svg{width:22px;height:22px;stroke:#fff;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
    .chat-pill-label{
      font-size:9px;font-weight:800;letter-spacing:.1em;
      color:#fff;text-transform:uppercase;
      writing-mode:vertical-rl;
      text-orientation:mixed;
    }

    ::-webkit-scrollbar{width:3px}
    ::-webkit-scrollbar-track{background:transparent}
    ::-webkit-scrollbar-thumb{background:var(--border-em);border-radius:999px}

    /* ── BOOT OVERLAY ── */
    .boot-overlay{
      position:fixed;inset:0;z-index:9999;
      background:#000;
      display:flex;align-items:center;justify-content:center;
      animation:bootCurtainLift 1s var(--ease-fluid) 1.7s forwards;
      pointer-events:auto;
    }
    @keyframes bootCurtainLift{
      0%   {opacity:1;transform:scale(1);}
      100% {opacity:0;transform:scale(1.06);visibility:hidden;}
    }
    .boot-mark{
      display:flex;flex-direction:column;align-items:center;gap:24px;
      animation:bootMarkDrift 1s var(--ease-fluid) 1.7s forwards;
    }
    @keyframes bootMarkDrift{
      to{transform:translateY(-12px);opacity:.6;}
    }
    .boot-t{
      width:88px;height:88px;
      background:var(--accent);
      border-radius:22px;
      display:flex;align-items:center;justify-content:center;
      font-size:46px;font-weight:800;color:#07110C;
      letter-spacing:-.02em;
      opacity:0;transform:scale(.55);filter:blur(10px);
      animation:
        bootTIn .8s var(--ease-spring) .15s forwards,
        bootTGlow 2.4s var(--ease-smooth) .95s infinite;
    }
    @keyframes bootTIn{
      to{opacity:1;transform:scale(1);filter:blur(0);}
    }
    @keyframes bootTGlow{
      0%,100% {box-shadow:0 0 0 0 hsl(var(--h) var(--acc-sat) var(--acc-lum) /.4),0 8px 28px hsl(var(--h) var(--acc-sat) var(--acc-lum) /.32);}
      50%     {box-shadow:0 0 0 16px hsl(var(--h) var(--acc-sat) var(--acc-lum) /0),0 14px 44px hsl(var(--h) var(--acc-sat) var(--acc-lum) /.55);}
    }
    .boot-name{
      font-size:13px;font-weight:700;letter-spacing:.45em;
      color:var(--text);text-transform:uppercase;
      opacity:0;
      animation:bootNameIn .65s var(--ease-out) .55s forwards;
    }
    .boot-name span{color:var(--muted);font-weight:400;margin-left:6px;letter-spacing:.4em;}
    @keyframes bootNameIn{
      from{opacity:0;letter-spacing:.7em;filter:blur(3px);}
      to  {opacity:1;letter-spacing:.45em;filter:blur(0);}
    }
    .boot-progress{
      width:124px;height:2px;
      background:rgba(255,255,255,.07);
      border-radius:999px;overflow:hidden;position:relative;
      opacity:0;
      animation:bootProgShow .35s var(--ease-out) .85s forwards;
    }
    .boot-progress::after{
      content:'';position:absolute;left:0;top:0;bottom:0;width:100%;
      background:linear-gradient(90deg,
        hsl(var(--h) var(--acc-sat) var(--acc-lum) /.4) 0%,
        var(--accent) 50%,
        hsl(var(--h) var(--acc-sat) var(--acc-lum) /.6) 100%);
      transform-origin:left center;
      transform:scaleX(0);
      box-shadow:0 0 10px hsl(var(--h) var(--acc-sat) var(--acc-lum) /.55);
      animation:bootProgFill .95s var(--ease-smooth) .9s forwards;
    }
    @keyframes bootProgShow{to{opacity:1;}}
    @keyframes bootProgFill{
      0%   {transform:scaleX(0);}
      100% {transform:scaleX(1);}
    }

    /* ── RIGHT DOCK — the avatar collection card + the page rail, stacked
       as two separate frosted panels ── */
    .right-dock{
      position:fixed;right:14px;top:50%;transform:translateY(-50%);
      z-index:600;display:flex;flex-direction:column;align-items:center;gap:10px;
      animation:railIn .6s var(--ease-out) calc(var(--boot-delay) + .3s) both;
    }
    /* ── RIGHT PAGE RAIL ── */
    .page-rail{
      position:relative;
      display:flex;flex-direction:column;gap:8px;
      padding:8px;user-select:none;touch-action:none;
      /* Subtle frosted glass: content scrolling behind the rail stays
         softly visible through a light blur + faint tint. */
      background:rgba(20,20,26,.32);
      backdrop-filter:blur(12px) saturate(1.2);
      -webkit-backdrop-filter:blur(12px) saturate(1.2);
      border:1px solid rgba(255,255,255,.10);
      border-radius:20px;
      box-shadow:0 10px 26px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.06);
    }
    @keyframes railIn{
      from{opacity:0;transform:translateY(-50%) translateX(12px);}
      to  {opacity:1;transform:translateY(-50%) translateX(0);}
    }
    .rail-indicator{
      position:absolute;left:6px;right:6px;height:40px;top:8px;
      border-radius:12px;pointer-events:none;
      background:var(--accent-soft);
      border:1px solid hsl(var(--h) var(--acc-sat) var(--acc-lum) /.5);
      box-shadow:0 0 18px hsl(var(--h) var(--acc-sat) var(--acc-lum) /.35),inset 0 1px 0 rgba(255,255,255,.12);
      transition:top .5s var(--ease-spring);
    }
    .rail-btn{
      position:relative;width:40px;height:40px;border-radius:12px;
      border:1px solid transparent;background:transparent;
      color:var(--muted);cursor:pointer;touch-action:none;
      display:flex;align-items:center;justify-content:center;
      transition:
        color .25s var(--ease-smooth),
        background .25s var(--ease-smooth),
        transform .3s var(--ease-spring);
    }
    .rail-btn:hover{color:#fff;background:rgba(255,255,255,.07);}
    .rail-btn:active{transform:scale(.9);}
    .rail-btn.active{color:var(--accent);}
    .rail-btn.drag-target{color:#fff;background:rgba(255,255,255,.08);}
    .rail-btn svg{width:17px;height:17px;pointer-events:none;}
    .rail-btn::after{
      content:attr(data-label);
      position:absolute;right:calc(100% + 12px);top:50%;
      transform:translateY(-50%) translateX(5px);
      font-size:10px;font-weight:700;letter-spacing:.12em;
      text-transform:uppercase;color:#fff;
      background:rgba(15,15,19,.92);border:1px solid var(--border);
      padding:5px 10px;border-radius:8px;white-space:nowrap;
      opacity:0;pointer-events:none;
      transition:opacity .25s var(--ease-smooth),transform .25s var(--ease-smooth);
    }
    .rail-btn:hover::after{opacity:1;transform:translateY(-50%) translateX(0);}

    /* ── STREAMS PAGE GRID ── */
    .streams-grid{
      display:grid;gap:14px;
      grid-template-columns:repeat(auto-fill,minmax(172px,1fr));
      max-width:1080px;margin:0 auto;
    }
    .streams-grid .card{width:100%;}

    /* ── NARROW / HALF SCREEN ── */
    @media (max-width:640px){
      .page{padding:12px 92px 140px 12px;}
      .right-dock{right:8px;}
      .island-bar{top:24px;right:6px;width:54px;gap:7px;}
      #pageHome{--hx:12px;--hy:12px;--hxr:92px;}
      .sec-head{padding:0 2px 10px;}
      .row{gap:10px;padding:0 2px 4px;}
      .card{width:134px;height:162px;border-radius:14px;padding:10px;}
      .card-media{height:92px;border-radius:10px;}
      .radio-card{width:134px;height:162px;border-radius:14px;}
      .radio-icon{width:54px;height:54px;font-size:14px;}
      section{margin:18px 14px;}
      .now-playing{padding:10px 14px;}
      .np-frame-wrap{width:120px;height:68px;}
      .chat-panel{width:300px;}
      .now-playing.chat-open{left:300px;}
      .now-playing.chat-mini{left:44px;}
    }

    @media (max-width:520px){
      .card{width:122px;height:148px;}
      .card-media{height:80px;}
      .radio-card{width:122px;height:148px;}
      .radio-icon{width:48px;height:48px;}
      .news-pop{padding:16px;}
      .news-pop-title{font-size:22px;}
      .news-pop-img{flex-basis:200px;min-height:150px;}
    }

    /* honor reduced motion */
    @media (prefers-reduced-motion:reduce){
      .boot-overlay{animation:bootCurtainLift .1s linear .1s forwards;}
      .boot-mark,.boot-t,.boot-name,.boot-progress,.boot-progress::after{
        animation:none !important;opacity:1 !important;transform:none !important;filter:none !important;
      }
    }

    /* ── MODERN REDUCED ROUNDING ── */
    .card,
    .radio-card,
    .news-strip,
    .avatar-panel,
    .nav-section,
    .stock-tile,
    .stream-tile,
    .sw-pop-card,
    .news-pop-card{
      border-radius:8px;
    }

    .card-media{
      border-radius:6px;
    }

    .card,
    .radio-card{
      border-color:transparent;
    }

    .card:hover,
    .radio-card:hover{
      border-color:rgba(255,255,255,.12);
    }

    .card:active,
    .radio-card.playing{
      border-color:hsl(var(--h) var(--acc-sat) var(--acc-lum) /.45);
    }

    /* ═════════ AMBIENT MODE — BMW iDrive X-inspired theming ═════════
       My Modes-style presets retint the whole cockpit. html[data-mode]
       drives the aurora field + glow tokens below; JS sets --h (the
       accent knob) inline to the mode's hue. The head script restores
       both before first paint; the mode chips live in the panel that
       opens when you tap the T logo. */
    :root[data-mode="personal"],
    :root[data-mode="custom"],
    :root:not([data-mode]){
      --amb-h1:var(--h);--amb-h2:265;--amb-h3:200;
      --amb-a1:.16;--amb-a2:.12;--amb-a3:.05;--amb-glow:.42;
    }
    :root[data-mode="efficient"]{
      --amb-h1:178;--amb-h2:205;--amb-h3:160;
      --amb-a1:.16;--amb-a2:.11;--amb-a3:.05;--amb-glow:.40;
    }
    :root[data-mode="sport"]{
      --amb-h1:6;--amb-h2:32;--amb-h3:340;
      --amb-a1:.22;--amb-a2:.16;--amb-a3:.07;--amb-glow:.58;
    }
    :root[data-mode="silent"]{
      --amb-h1:214;--amb-h2:232;--amb-h3:198;
      --amb-a1:.11;--amb-a2:.09;--amb-a3:.04;--amb-glow:.26;
    }
    :root[data-mode="theater"]{
      --amb-h1:30;--amb-h2:45;--amb-h3:12;
      --amb-a1:.09;--amb-a2:.07;--amb-a3:.03;--amb-glow:.20;
    }
    /* White: monochrome mode — every accent and aurora blob goes to
       0% saturation and the accent lightness climbs to a silvery 80%,
       for a clean white glow floating on the dark cockpit. */
    :root[data-mode="white"]{
      --acc-sat:0%;--acc-lum:80%;
      --amb-sat:0%;--amb-h1:0;--amb-h2:0;--amb-h3:0;
      --amb-a1:.15;--amb-a2:.10;--amb-a3:.05;--amb-glow:.50;
    }

    /* Dynamic ambient field: four soft aurora blobs drifting on long
       independent loops, tinted by the active mode. Transform-only
       animation (GPU-composited, no repaint) so the Tesla browser
       stays smooth; gradients are pre-soft, no blur filters. */
    .amb-field{
      position:fixed;inset:-25%;z-index:-1;pointer-events:none;
    }
    .amb-field i{
      position:absolute;display:block;border-radius:50%;
      will-change:transform;
    }
    .amb-field i:nth-child(1){
      left:-4%;top:-6%;width:64%;height:60%;
      background:radial-gradient(circle at 50% 50%,hsl(var(--amb-h1) var(--amb-sat) 45% / calc(var(--amb-a1) * 1.5)),transparent 66%);
      animation:ambBlob1 22s var(--ease-smooth) infinite alternate;
    }
    .amb-field i:nth-child(2){
      right:-6%;bottom:-8%;width:58%;height:56%;
      background:radial-gradient(circle at 50% 50%,hsl(var(--amb-h2) var(--amb-sat) 48% / calc(var(--amb-a2) * 1.5)),transparent 66%);
      animation:ambBlob2 30s var(--ease-smooth) infinite alternate;
    }
    .amb-field i:nth-child(3){
      left:38%;top:30%;width:46%;height:44%;
      background:radial-gradient(circle at 50% 50%,hsl(var(--amb-h3) var(--amb-sat) 50% / calc(var(--amb-a3) * 2)),transparent 68%);
      animation:ambBlob3 25s var(--ease-smooth) infinite alternate-reverse;
    }
    .amb-field i:nth-child(4){
      left:8%;bottom:-14%;width:52%;height:48%;
      background:radial-gradient(circle at 50% 50%,hsl(var(--h) var(--acc-sat) var(--acc-lum) / calc(var(--amb-a1) * .8)),transparent 64%);
      animation:ambBlob4 34s var(--ease-smooth) infinite alternate;
    }
    @keyframes ambBlob1{
      0%  {transform:translate3d(0,0,0) scale(1);}
      50% {transform:translate3d(9%,7%,0) scale(1.12);}
      100%{transform:translate3d(-4%,10%,0) scale(.96);}
    }
    @keyframes ambBlob2{
      0%  {transform:translate3d(0,0,0) scale(1);}
      50% {transform:translate3d(-10%,-6%,0) scale(1.08);}
      100%{transform:translate3d(6%,-11%,0) scale(1.16);}
    }
    @keyframes ambBlob3{
      0%  {transform:translate3d(0,0,0) scale(.9);}
      50% {transform:translate3d(-12%,6%,0) scale(1.1);}
      100%{transform:translate3d(10%,-8%,0) scale(.95);}
    }
    @keyframes ambBlob4{
      0%  {transform:translate3d(0,0,0) scale(1);}
      50% {transform:translate3d(12%,-9%,0) scale(1.14);}
      100%{transform:translate3d(-8%,-4%,0) scale(1);}
    }

    /* Mode-change sweep: a one-shot tint flash across the screen. */
    .amb-sweep{
      position:fixed;inset:0;z-index:900;pointer-events:none;opacity:0;
      background:radial-gradient(70% 60% at 50% 45%,hsl(var(--amb-h1) var(--amb-sat) 50% /.20),transparent 70%);
    }
    .amb-sweep.go{animation:ambSweep .9s var(--ease-fluid) forwards;}
    @keyframes ambSweep{
      0%  {opacity:0;transform:scale(.92);}
      35% {opacity:1;}
      100%{opacity:0;transform:scale(1.04);}
    }

    /* Mode chips — the accent panel becomes the Ambient panel. */
    .mode-row{display:flex;flex-wrap:wrap;gap:6px;margin:2px 0 12px;}
    .mode-chip{
      display:inline-flex;align-items:center;gap:6px;
      border:1px solid var(--border-em);border-radius:999px;
      background:rgba(255,255,255,.04);color:var(--muted);
      font-family:inherit;font-size:10px;font-weight:700;letter-spacing:.06em;
      padding:5px 10px;cursor:pointer;
      transition:background .2s var(--ease-smooth),color .2s var(--ease-smooth),
        border-color .2s var(--ease-smooth),box-shadow .25s var(--ease-smooth),
        transform .3s var(--ease-spring);
    }
    .mode-chip::before{
      content:'';width:8px;height:8px;border-radius:50%;flex-shrink:0;
      background:hsl(var(--mh) 73% 48%);
      box-shadow:0 0 8px hsl(var(--mh) 73% 48% /.7);
    }
    .mode-chip[data-mode="personal"] {--mh:141;}
    .mode-chip[data-mode="efficient"]{--mh:178;}
    .mode-chip[data-mode="sport"]    {--mh:8;}
    .mode-chip[data-mode="silent"]   {--mh:214;}
    .mode-chip[data-mode="theater"]  {--mh:32;}
    .mode-chip[data-mode="white"]    {--mh:0;}
    .mode-chip[data-mode="custom"]   {--mh:var(--h);}
    .mode-chip:hover{background:rgba(255,255,255,.08);color:#fff;}
    .mode-chip:active{transform:scale(.94);}
    /* White chip: its dot + active state go monochrome (the shared
       ::before dot is hue-tinted and would read red at --mh:0). */
    .mode-chip[data-mode="white"]::before{background:#fff;box-shadow:0 0 8px rgba(255,255,255,.7);}
    .mode-chip[data-mode="white"].active{
      border-color:rgba(255,255,255,.65);
      background:rgba(255,255,255,.14);
      box-shadow:0 0 14px rgba(255,255,255,.35),inset 0 1px 0 rgba(255,255,255,.1);
    }
    .mode-chip.active{
      color:#fff;
      border-color:hsl(var(--mh) 73% 52% /.65);
      background:hsl(var(--mh) 73% 42% /.18);
      box-shadow:0 0 14px hsl(var(--mh) 73% 42% /.35),inset 0 1px 0 rgba(255,255,255,.1);
    }
    .accent-sub{
      font-size:9px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;
      color:var(--muted2);margin:2px 0 4px;
    }

    /* QuickSelect-style glass tiles: roomier radii, hairline light
       border, mode-tinted outer glow, frosted see-through surfaces.
       This block sits last in the sheet, so these equal-specificity
       rules win over the per-tile definitions above. */
    .home-tile{
      border:1px solid rgba(255,255,255,.13);
      border-radius:18px;
      backdrop-filter:blur(12px) saturate(1.3);
      -webkit-backdrop-filter:blur(12px) saturate(1.3);
      box-shadow:
        0 1px 0 rgba(255,255,255,.05) inset,
        0 -1px 0 rgba(0,0,0,.32) inset,
        0 16px 38px -20px hsl(var(--amb-h1) var(--amb-sat) 42% / calc(var(--amb-glow) * .55));
    }
    .news-strip{background:#0d0e12;}
    .stock-tile,
    .avatar-panel,
    .stream-tile{
      background:
        linear-gradient(180deg,hsl(var(--amb-h1) var(--amb-sat) 42% /.08),transparent 42%),
        rgba(24,24,29,.66);
    }
    .avatar-panel-head{background:transparent;}
    .card,
    .radio-card{border-radius:16px;}
    .card-media{border-radius:10px;}

    /* Island bar: clock picks up a whisper of the mode's hue. */
    .island-bar #clock{color:hsl(var(--amb-h1) var(--amb-sat) 94%);}

    /* Page rail: circular BMW-dock buttons, glow tracks the mode. */
    .page-rail,.avatar-rail{border-radius:24px;}
    .rail-btn{border-radius:999px;}
    .rail-indicator{
      border-radius:999px;
      box-shadow:
        0 0 calc(10px + 14px * var(--amb-glow)) hsl(var(--h) var(--acc-sat) var(--acc-lum) / calc(.18 + .3 * var(--amb-glow))),
        inset 0 1px 0 rgba(255,255,255,.12);
    }

    /* Boot curtain carries the mode's aurora. */
    .boot-overlay{
      background:
        radial-gradient(60% 55% at 50% 42%,hsl(var(--amb-h1) var(--amb-sat) 18% /.5),transparent 70%),
        radial-gradient(45% 40% at 78% 70%,hsl(var(--amb-h2) var(--amb-sat) 20% /.3),transparent 70%),
        #000;
    }
  </style>
</head>
<body>

  <!-- AMBIENT FIELD (dynamic mode-tinted aurora behind everything) -->
  <div class="amb-field" aria-hidden="true"><i></i><i></i><i></i><i></i></div>

  <!-- BOOT OVERLAY -->
  <div class="boot-overlay" id="bootOverlay" aria-hidden="true">
    <div class="boot-mark">
      <div class="boot-t">T</div>
      <div class="boot-name">Cinema<span>· Drive</span></div>
      <div class="boot-progress"></div>
    </div>
  </div>

  <!-- MODE SWEEP (one-shot tint flash when the ambient mode changes) -->
  <div class="amb-sweep" id="ambSweep" aria-hidden="true"></div>

  <!-- RIGHT ISLAND BAR (replaces the old top header) -->
  <div class="island-bar" id="islandBar">
    <div class="logo-t" title="T / Cinema">T</div>
    <div id="clock-wrap">
      <div id="clock">--:--</div>
      <div id="date-display"></div>
    </div>
    <div class="yr-ring" id="yrWidget" title="Days left in the year">
      <svg class="yr-arc" id="yrArc" width="48" height="48" viewBox="0 0 48 48">
        <circle class="yr-arc-track" cx="24" cy="24" r="20" stroke-width="3"/>
        <circle class="yr-arc-fill" id="yrFill" cx="24" cy="24" r="20" stroke-width="3"
          stroke-dasharray="125.66" stroke-dashoffset="125.66"
          transform="rotate(-90 24 24)"/>
        <text class="yr-arc-days" id="yrDays" x="24" y="24">—</text>
      </svg>
      <span class="yr-ring-cap">Days left</span>
    </div>
  </div>

  <!-- AMBIENT MODE PANEL (toggled by tapping the T logo) -->
  <div class="accent-panel" id="accentPanel" role="dialog" aria-label="Ambient mode and accent color">
    <div class="accent-head">
      <span class="accent-title">Ambient</span>
      <button class="accent-close" id="accentClose" type="button" aria-label="Close ambient settings">
        <svg viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <div class="mode-row" id="modeRow" role="group" aria-label="Ambient modes">
      <button class="mode-chip" type="button" data-mode="personal" aria-pressed="false">Personal</button>
      <button class="mode-chip" type="button" data-mode="efficient" aria-pressed="false">Efficient</button>
      <button class="mode-chip" type="button" data-mode="sport" aria-pressed="false">Sport</button>
      <button class="mode-chip" type="button" data-mode="silent" aria-pressed="false">Silent</button>
      <button class="mode-chip" type="button" data-mode="theater" aria-pressed="false">Theater</button>
      <button class="mode-chip" type="button" data-mode="white" aria-pressed="false">White</button>
      <button class="mode-chip" type="button" data-mode="custom" aria-pressed="false">Custom</button>
    </div>
    <div class="accent-sub">Accent hue</div>
    <input class="accent-hue" type="range" id="accentHue" min="0" max="360" value="141" step="1" aria-label="Accent hue"/>
    <div class="accent-foot">
      <span class="accent-hex" id="accentHex">#1DB954</span>
      <button class="accent-reset" id="accentReset" type="button">Reset</button>
    </div>
  </div>

  <!-- FULLSCREEN (floating, bottom-right corner) -->
  <button class="fs-btn" id="fsBtn" title="Fullscreen">
    <svg viewBox="0 0 24 24"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>
  </button>

  <!-- CONTENT: three stacked pages — home / streams / filler -->
  <main class="page-viewport" id="pageViewport">

    <!-- ── PAGE · HOME ── -->
    <div class="page pos-active" id="pageHome">

    <!-- HOME GRID (hold a tile to rearrange) — Gridstack: 12 cols,
         90px rows, 9px item margin (18px gutter). The shells carry
         the geometry (gs-* / inline left-top-width-height); the
         .home-tile content fills its shell. -->

  /* ── RENDER CARDS ── */
  function renderCards(list, containerId, sub){
    const container = document.getElementById(containerId);
    list.forEach(s => {

      el.className = 'card';
      el.innerHTML = `

        <div class="card-name">${s.name}</div>

      el.addEventListener('click', () => openUrl(s.url));
      container.appendChild(el);
    });
  }

  function openUrl(url){
    if(document.fullscreenEnabled && !document.fullscreenElement){
      document.documentElement.requestFullscreen().catch(()=>{}).finally(()=> window.location.href = url);
    } else {
      window.location.href = url;
    }
  }

  /* ── CLOCK + DATE ── */
  let lastClockText = '';
  function updateClock(){
    const now = new Date();
    const h = now.getHours().toString().padStart(2,'0');
    const m = now.getMinutes().toString().padStart(2,'0');
    const next = `${h}:${m}`;
    const clockEl = document.getElementById('clock');
    if(next !== lastClockText){
      lastClockText = next;
      clockEl.textContent = next;
      clockEl.classList.remove('tick');
      void clockEl.offsetWidth;
      clockEl.classList.add('tick');
    }
    document.getElementById('date-display').textContent = now.toLocaleDateString('en-US',{
      weekday:'short', month:'short', day:'numeric'
    });
  }
  updateClock();
  setInterval(updateClock, 15000);

  /* ── YEAR PROGRESS ── */
  function updateYearProgress(){
    const now     = new Date();
    const year    = now.getFullYear();
    const start   = new Date(year, 0, 1);
    const end     = new Date(year + 1, 0, 1);
    const elapsed = now - start;
    const total   = end - start;
    const pct     = elapsed / total;
    const daysLeft= Math.ceil((end - now) / 86400000);

    const daysEl = document.getElementById('yrDays');
    daysEl.textContent = daysLeft.toLocaleString('en-US');

    const circ  = 2 * Math.PI * 20;
    const fill  = document.getElementById('yrFill');
    fill.setAttribute('stroke-dasharray', circ.toFixed(2));
    fill.setAttribute('stroke-dashoffset', (circ * (1 - pct)).toFixed(2));

    /* Year-progress status colors — deliberately FIXED (not the accent
       hue): this is a "time left this year" gauge, green→yellow→red, so
       the T-logo color slider must not tint it. The days number stays
       white: setAttribute is a presentation attribute and loses to the
       CSS .yr-arc-days{fill:#fff} rule, exactly as before. */
    const colour = pct < 0.5  ? '#1DB954'
               : pct < 0.75 ? '#FFD166'
               :               '#FF453A';
    fill.setAttribute('stroke', colour);
    daysEl.setAttribute('fill', colour);
  }
  updateYearProgress();

  /* ── FULLSCREEN ── */
  const THIS_URL = 'https://msrisabaranjan.github.io/teslacinema/';
  const FS_URL   = 'https://www.youtube.com/redirect?q=' + encodeURIComponent(THIS_URL);
  document.getElementById('fsBtn').addEventListener('click', () => {
    window.location.href = FS_URL;
  });

  /* ── AMBIENT MODES + ACCENT HUE (tap the T logo) ──
     My Modes-style presets (BMW iDrive X): each mode sets the accent
     hue (--h, inline on :root) and html[data-mode], which drives the
     aurora field + glow tokens in the sheet. Custom keeps the slider
     hue. Mode + hue persist in localStorage; the head script restores
     them before first paint, this block re-applies and wires the UI. */
  const ACCENT_KEY = 'tcinema.accentHue';
  const MODE_KEY   = 'tcinema.mode';
  const ACCENT_DEFAULT = 141; // Spotify green
  const MODE_HUES = {personal:141, efficient:178, sport:8, silent:214, theater:32, white:0};
  const MODES = ['personal','efficient','sport','silent','theater','white','custom'];
  const logoT       = document.querySelector('.logo-t');
  const accentPanel = document.getElementById('accentPanel');
  const accentHue   = document.getElementById('accentHue');
  const accentHex   = document.getElementById('accentHex');
  const accentReset = document.getElementById('accentReset');
  const accentClose = document.getElementById('accentClose');
  const modeRow     = document.getElementById('modeRow');
  const ambSweep    = document.getElementById('ambSweep');

  function hueToHex(h, s, l){
    s /= 100; l /= 100;
    const k = n => (n + h / 30) % 12;
    const a = s * Math.min(l, 1 - l);
    const f = n => l - a * Math.max(-1, Math.min(k(n) - 3, Math.min(9 - k(n), 1)));
    const to2 = x => Math.round(255 * x).toString(16).padStart(2, '0');
    return ('#' + to2(f(0)) + to2(f(8)) + to2(f(4))).toUpperCase();
  }
  function savedHue(){
    try{
      const v = parseInt(localStorage.getItem(ACCENT_KEY), 10);
      if(Number.isFinite(v) && v >= 0 && v <= 360) return v;
    }catch(e){}
    return ACCENT_DEFAULT;
  }
  function setAccentHue(h, persist){
    h = Math.round(Number(h));
    if(!Number.isFinite(h) || h < 0 || h > 360) h = ACCENT_DEFAULT;

    const change= +(price - prev).toFixed(4);

  /* Rows sit in absolute slots in a two-column grid (1,2 / 3,4 / …);
     re-ranking only changes each row's translate(x,y), so the CSS
     transform transition plays the shuffle. */
  const STOCK_COLS = 2;

  function renderStockTile(){
    const list = document.getElementById('stockList');
    const tile = document.getElementById('stockTile');
    if(!list || !tile) return;

    const cs     = getComputedStyle(list);
    const gap    = parseFloat(cs.getPropertyValue('--row-gap'))  || 4;
    const colGap = parseFloat(cs.getPropertyValue('--col-gap'))  || 8;
    const pad    = parseFloat(cs.getPropertyValue('--list-pad')) || 10;
    const W      = list.clientWidth  - pad * 2;
    const H      = list.clientHeight;
    if(W <= 60 || H <= 40) return;   /* tile size not settled yet (pre-layout) */

    /* Fit pass: two columns only when each can hold a full row —
       ~70px of rank/badge overhead plus a ~112px price line — else
       one column; shrink rows to fit the tile (never below 36px);
       if even that doesn't fit, hide the worst performers so what
       IS shown never overlaps. */
    const cols = (W >= 2 * 185 + colGap) ? STOCK_COLS : 1;
    let rowH = 52, visible = ALL_SYMS.length;
    for(let n = ALL_SYMS.length; n >= 1; n--){
      const rows = Math.ceil(n / cols);
      const rh   = Math.min(52, (H - (rows - 1) * gap) / rows);
      if(rh >= 36){ rowH = rh; visible = n; break; }
    }
    tile.style.setProperty('--row-h', rowH + 'px');
    tile.classList.toggle('tight', rowH < 44);
    const step = rowH + gap;
    const colW = (W - (cols - 1) * colGap) / cols;

    /* Geometry changed (resize / breakpoint) — force every row to
       re-apply its slot transform at the new step/columns. */
    const geom = `${step}x${colW}`;
    if(list.dataset.geom !== geom){
      list.dataset.geom = geom;
      [...list.children].forEach(r => { r.dataset.rank = ''; });
    }

    if(!list.childElementCount){
      /* First paint: build one row per symbol (mock data already in
         stockData); the initial ranking below applies before first
         paint so nothing animates on load. */
      ALL_SYMS.forEach(sym => {
        const row = document.createElement('div');
        row.className = 'stock-row';
        row.dataset.sym = sym;
        row.innerHTML =
          `<div class="stock-rank">0</div>
           <div class="stock-badge ${BADGE_CLASS[sym] || ''}">${sym.replace('-USD','')}</div>
           <div class="stock-info">
             <div class="stock-name">${STOCK_NAMES[sym] || sym}</div>
             <div class="stock-price-line"></div>
           </div>`;
        list.appendChild(row);
      });
    }

    const sorted = [...ALL_SYMS].sort((a, b) => stockData[b].pct - stockData[a].pct);
    sorted.forEach((sym, rank) => {
      const row = list.querySelector(`.stock-row[data-sym="${sym}"]`);
      if(!row) return;
      const show = rank < visible;
      row.style.display = show ? '' : 'none';
      if(!show) return;
      const d    = stockData[sym];
      const up   = d.change >= 0;
      const sign = up ? '+' : '';
      const cls  = up ? 'up' : 'dn';
      row.querySelector('.stock-rank').textContent = rank + 1;
      row.querySelector('.stock-price-line').innerHTML =
        `${fmtPrice(sym, d.price)}<span class="sp-cur">USD</span>` +
        `<span class="sp-chg ${cls}">${sign}${d.pct.toFixed(2)}%</span>`;
      row.classList.toggle('best', rank === 0);
      if(row.dataset.rank !== String(rank)){
        row.dataset.rank = String(rank);
        const x = pad + (rank % cols) * (colW + colGap);
        const y = Math.floor(rank / cols) * step;
        row.style.width = colW + 'px';
        row.style.transform = `translate(${x}px, ${y}px)`;
      }
    });

  }

  /* News copy scales with the tile: the featured card is always
     full-bleed, so fitNewsTile only tunes the overlay — padding, title
     px, desc px, title clamp — keeps two peek cards on wide tiles, one
     peek card on medium tiles, and only drops to a single card on tiny
     ones; desc / CTA / arrows / progress go when they'd crush. */
  function fitNewsTile(){
    const strip = document.getElementById('newsStrip');
    if(!strip) return;
    const w = strip.clientWidth, h = strip.clientHeight;
    if(w <= 40 || h <= 20) return;
    const three = w >= 560;                       // featured + two peeks
    const one   = !three && w >= 300;             // featured + one peek
    const aw    = three ? w * 0.54 : one ? w * 0.64 : w;  // featured width
    const pad = Math.max(12, Math.min(22, Math.round(Math.min(w * 0.05, h * 0.10))));
    strip.style.setProperty('--npad', pad + 'px');
    strip.style.setProperty('--nt',
      aw < 420 ? '16px' : h < 170 ? '17px' : h < 240 ? '19px' : h < 310 ? '22px' : '25px');
    strip.style.setProperty('--ncpt', h < 280 ? '12px' : '13px');
    strip.style.setProperty('--ntl', h >= 360 && aw >= 560 ? '3' : '2');
    strip.classList.toggle('peek-1',   one);
    strip.classList.toggle('no-side',  !three && !one);
    strip.classList.toggle('no-desc',    h < 210 || aw < 330);
    strip.classList.toggle('no-cta',     h < 250 || aw < 300);
    strip.classList.toggle('no-nav',     w < 320);
    strip.classList.toggle('no-progress', h < 120);
  }

  let tileFitRaf = 0;

  /* ── Market status (US/Eastern, 9:30–16:00 Mon–Fri) ──
     LIVE while the session runs, otherwise a countdown to the
     next open. The offset is derived from the ET wall clock so it
     stays correct across DST. */
  function marketStatus(){
    const now = new Date();
    now.setSeconds(0, 0);
    const off = Math.round(
      (new Date(now.toLocaleString('en-US', {timeZone:'America/New_York'})) - now) / 60000
    );
    const et     = new Date(now.getTime() + off * 60000);
    const OPEN   = 9 * 60 + 30;
    const isWd   = d => d >= 1 && d <= 5;
    const dayMin = et.getHours() * 60 + et.getMinutes();
    if(isWd(et.getDay()) && dayMin >= OPEN && dayMin < 16 * 60) return {open:true};
    for(let i = 0; i < 8; i++){
      const d  = new Date(et.getTime() + i * 86400000);
      const dm = d.getHours() * 60 + d.getMinutes();
      if(isWd(d.getDay()) && dm < OPEN){
        return {open:false, ms: i * 86400000 + (OPEN - dm) * 60000};
      }
    }
    return {open:false, ms:null};
  }

  function updateStockStatus(){

      const m  = Math.max(0, s.ms);

      sub.textContent = `opens in ${Math.floor(m / 3600000)}h ` +
        `${p(Math.floor(m % 3600000 / 60000))}m ${p(Math.floor(m % 60000 / 1000))}s`;
    } else {
      sub.textContent = '';
    }
  }

  // Sources split into two kinds:
  //   type:'api'  -> direct, CORS-enabled JSON API, no proxy (reliable, fast)
  //   type:'rss'  -> RSS fetched through the public proxy chain (best-effort)
  // `limit` = how many items to pull per refresh. Every source here ships a
  // real cover image with each story — image-less feeds (dev.to) were dropped
  // for that reason. The Verge is weighted highest as the richest feed.
  const NEWS_SOURCES = [
    {id:'9to5mac',    name:'9to5Mac',     kind:'tech', type:'api', limit:12, url:'https://9to5mac.com/wp-json/wp/v2/posts?per_page=12&_embed'},
    {id:'9to5google', name:'9to5Google',  kind:'tech', type:'api', limit:12, url:'https://9to5google.com/wp-json/wp/v2/posts?per_page=12&_embed'},

    {id:'bbc-tech',   name:'BBC Tech',    kind:'tech', type:'rss', url:'https://feeds.bbci.co.uk/news/technology/rss.xml', limit:10},
    {id:'tc',         name:'TechCrunch',  kind:'tech', type:'rss', url:'https://techcrunch.com/feed/', limit:10},
    {id:'bbc-top',    name:'BBC News',    kind:'top',  type:'rss', url:'https://feeds.bbci.co.uk/news/rss.xml', limit:10},
  ];
  // Per-source representation multiplier used when building the deck.
  const NEWS_BOOST = Object.fromEntries(NEWS_SOURCES.filter(s => s.weight > 1).map(s => [s.name, s.weight]));

  // Public CORS proxies tried in order when fetching RSS (no server of our own).
  const NEWS_PROXIES = [
    {name:'allorigins-raw', make:u => 'https://api.allorigins.win/raw?url=' + encodeURIComponent(u)},
    {name:'corsproxy',      make:u => 'https://corsproxy.io/?url=' + encodeURIComponent(u)},
    {name:'codetabs',       make:u => 'https://api.codetabs.com/v1/proxy?quest=' + encodeURIComponent(u)},
    {name:'allorigins-get', make:u => 'https://api.allorigins.win/get?url=' + encodeURIComponent(u),
                            unwrap:async res => (await res.json()).contents},
  ];
  const NEWS_PROXY_KEY = 'tcinema.newsProxy';

  function rememberNewsProxy(idx){
    try{ localStorage.setItem(NEWS_PROXY_KEY, String(idx)); }catch(e){}
  }
  function newsProxyOrder(){
    const order = NEWS_PROXIES.map((_, i) => i);
    try{
      const preferred = parseInt(localStorage.getItem(NEWS_PROXY_KEY) || '', 10);
      if(!Number.isNaN(preferred) && NEWS_PROXIES[preferred]){
        order.splice(order.indexOf(preferred), 1);
        order.unshift(preferred);
      }
    }catch(e){}
    return order;
  }
  async function fetchRssText(rssUrl){
    let lastErr = null;
    for(const idx of newsProxyOrder()){
      const p = NEWS_PROXIES[idx];
      try{
        const res  = await fetch(p.make(rssUrl), {signal: AbortSignal.timeout(5000), cache:'no-store'});
        if(!res.ok) throw new Error('HTTP ' + res.status);
        const text = p.unwrap ? await p.unwrap(res) : await res.text();
        if(!text || text.trim().length < 50) throw new Error('empty response');
        rememberNewsProxy(idx);
        return text;
      }catch(err){ lastErr = err; }
    }
    throw lastErr || new Error('all proxies failed');
  }

  async function fetchWpApi(src){
    // WordPress REST API — direct CORS, and every post carries a featured
    // image via _embed. One quick retry on transient failures (it lands
    // well inside the 25s phase-1 window).
    let res = null;
    for(let attempt = 0; attempt < 2; attempt++){
      try {
        res = await fetch(src.url, {signal: AbortSignal.timeout(8000), cache:'no-store'});
        if(res.ok) break;
        res = null;
      } catch(e){ res = null; }
      if(attempt === 0) await new Promise(r => setTimeout(r, 1000));
    }
    if(!res || !res.ok) throw new Error(src.name + ' unavailable');
    const j = await res.json();
    return (Array.isArray(j) ? j : []).map(a => ({
      title: cleanNewsTitle(decodeHtmlEntities((a.title && a.title.rendered) || '')),
      pubDate: a.date_gmt ? a.date_gmt.replace(' ', 'T') + 'Z' : '',
      link: a.link || '',
      description: decodeHtmlEntities((a.excerpt && a.excerpt.rendered) || '').replace(/<[^>]+>/g, '').trim().slice(0, 220),
      image: (a._embedded && a._embedded['wp:featuredmedia'] &&
              a._embedded['wp:featuredmedia'][0] && a._embedded['wp:featuredmedia'][0].source_url) || '',
      source: src.name,
      feedId: src.id,
      kind: src.kind
    })).filter(i => i.title);
  }

  async function fetchSource(src){
    if(src.type === 'api'){
      return fetchWpApi(src);
    }
    const text = await fetchRssText(src.url);
    const doc  = new DOMParser().parseFromString(text, 'text/xml');
    if(doc.querySelector('parsererror')) throw new Error('XML parse error (' + src.id + ')');
    return parseFeedItems(doc, src, src.limit || 10);
  }

  // Race a batch of source promises against a deadline. Resolves with
  // whatever has settled so far; late sources keep running in the background
  // (their underlying promises are shared, so a later call sees them).
  function settleBatch(tasks, ms){
    return Promise.all(tasks.map(p =>
      Promise.race([p, new Promise(res => setTimeout(() => res(null), ms))])
    ));
  }

  function poolsFromResults(results){
    const seen = new Set();
    const techPool = [];
    const topPool  = [];
    results.forEach(res => {
      if(!res || res.status !== 'ok' || !Array.isArray(res.items)) return;
      res.items.forEach(item => {
        const key = normTitleKey(item.title);
        if(seen.has(key)) return;
        seen.add(key);
        (item.kind === 'top' ? topPool : techPool).push(item);
      });
    });
    return {techPool, topPool};
  }

  function timeAgo(dateStr){
    const diff = (Date.now() - new Date(dateStr).getTime()) / 60000;
    if(isNaN(diff) || diff < 0) return '';
    if(diff < 1)    return 'just now';
    if(diff < 60)   return Math.round(diff) + 'm ago';
    if(diff < 1440) return Math.round(diff / 60) + 'h ago';
    return Math.round(diff / 1440) + 'd ago';
  }

  function decodeRssText(s){
    return (s || '')
      .replace(/<!\[CDATA\[|\]\]>/g, '')
      .replace(/<[^>]+>/g, '')
      .replace(/&amp;/g, '&')
      .replace(/&lt;/g, '<')
      .replace(/&gt;/g, '>')
      .replace(/&#39;/g, "'")
      .replace(/&quot;/g, '"')
      .replace(/&nbsp;/g, ' ')
      .trim();
  }

  function shuffleNews(list){
    const a = list.slice();
    for(let i = a.length - 1; i > 0; i--){
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function rssThumb(el){
    const thumb =
      el.getElementsByTagNameNS('http://search.yahoo.com/mrss/', 'thumbnail')[0] ||
      el.getElementsByTagName('media:thumbnail')[0] ||
      el.querySelector('thumbnail');
    let url = thumb?.getAttribute('url') || '';
    if(url.includes('/standard/240/')) url = url.replace('/standard/240/', '/standard/640/');
    return url;
  }

  function newsPhText(item){
    return (item.source || 'NEWS').replace(/[^A-Za-z ]/g, '').trim()
      .split(/\s+/).slice(0, 2).map(w => w[0]).join('').toUpperCase() || 'N';
  }

  function addNewsPlaceholder(wrap, item, cls = 'news-ph'){

  function openNewsPopup(item, index){
    if(!item) return;
    /* Arrange mode: taps on the tile drag it around — never let a
       stray tap open the summary popup mid-rearrange. */
    if(document.body.classList.contains('home-arranging')) return;
    const pop  = document.getElementById('newsPop');
    const card = document.getElementById('newsPopCard');
    const imgW = document.getElementById('newsPopImg');
    const title= document.getElementById('newsPopTitle');
    const desc = document.getElementById('newsPopDesc');

  function wrapNewsIdx(next){
    const n = newsItems.length;
    if(!n) return 0;
    return ((next % n) + n) % n;
  }

  /* Segmented progress: past stories stay filled, the current one
     fills over the dwell window (kept in sync with NEWS_INTERVAL). */
  function paintNewsPips(){
    const pips = document.querySelectorAll('.news-progress .news-pip');
    pips.forEach((p, i) => {
      const fill = p.firstElementChild;
      if(!fill) return;
      p.classList.toggle('done', i < newsIdx);
      fill.style.transition = 'none';
      if(i === newsIdx){
        fill.style.width = '0%';
        void fill.offsetWidth;
        fill.style.transition = 'width ' + NEWS_INTERVAL + 'ms linear';
        fill.style.width = '100%';
      } else {
        fill.style.width = i < newsIdx ? '100%' : '0%';
      }
    });
  }

  /* Position the deck: the featured story (pos-0) sits large on the
     left, the next two (pos-1/pos-2) peek beside it, everything else
     stays parked off-stage. */
  function updateNewsUI(){
    const slides = document.querySelectorAll('.news-track .news-slide');
    const n = slides.length;
    if(!n) return;
    slides.forEach((s, i) => {
      const rel = ((i - newsIdx) % n + n) % n;
      s.classList.toggle('pos-0', rel === 0);
      s.classList.toggle('pos-1', rel === 1 && n > 1);
      s.classList.toggle('pos-2', rel === 2 && n > 2);
    });
  }

  function goToNews(next){
    const slides = document.querySelectorAll('.news-track .news-slide');
    if(!slides.length) return;
    newsIdx = wrapNewsIdx(next);
    updateNewsUI();
    paintNewsPips();
    restartNewsTimer();
  }

  function advanceNews(){
    if(!newsItems.length || newsPopupOpen) return;
    goToNews(newsIdx + 1);

  function stepNews(delta){
    if(!newsItems.length) return;
    goToNews(newsIdx + delta);
  }

  // WP REST hands back HTML-escaped strings (&#8217; etc); the RSS path gets
  // entity-decoding for free from DOMParser, so do the same thing here.
  const newsDecoder = document.createElement('textarea');
  function decodeHtmlEntities(s){
    newsDecoder.innerHTML = s || '';
    return newsDecoder.value;
  }

  // Some feeds stuff newlines / bare URLs into <title>; keep the first
  // line and drop trailing links so the card never shows raw URLs.
  function cleanNewsTitle(t){
    let s = (t || '').split(/\r?\n/)[0].trim();
    s = s.replace(/\s+https?:\/\/\S+.*$/i, '').trim();
    return s;
  }

  function parseRssItems(doc, feed, limit = 10){
    return Array.from(doc.querySelectorAll('item')).slice(0, limit).map(el => {
      const title   = cleanNewsTitle(decodeRssText(el.querySelector('title')?.textContent));
      const pubDate = el.querySelector('pubDate')?.textContent?.trim() || '';
      let description = decodeRssText(el.querySelector('description')?.textContent);
      let link = '';
      el.childNodes.forEach(n => { if(n.nodeName === 'link') link = n.textContent?.trim() || ''; });
      if(!link) link = el.querySelector('guid')?.textContent?.trim() || '';
      return {title, pubDate, link, description, image: rssThumb(el), source: feed.name, feedId: feed.id, kind: feed.kind};
    }).filter(i => i.title && i.title.length > 8);
  }

  // Atom (e.g. The Verge): <entry> elements, <link href="…">, ISO dates,
  // and the article image embedded in the HTML <content>.
  function parseAtomItems(doc, feed, limit = 10){
    return Array.from(doc.querySelectorAll('entry')).slice(0, limit).map(el => {
      const title   = cleanNewsTitle(decodeRssText(el.querySelector('title')?.textContent));
      const pubDate = el.querySelector('published')?.textContent?.trim()
        || el.querySelector('updated')?.textContent?.trim() || '';
      let link = '';
      el.querySelectorAll('link').forEach(l => { if(!link) link = l.getAttribute('href') || ''; });
      if(!link) link = el.querySelector('id')?.textContent?.trim() || '';
      const description = decodeRssText(el.querySelector('summary')?.textContent || '');
      let image = '';
      const mthumb = el.getElementsByTagName('media:thumbnail')[0];
      if(mthumb?.getAttribute('url')) image = mthumb.getAttribute('url');
      else {
        const m = (el.querySelector('content')?.textContent || '').match(/src=["']([^"']+)["']/i);
        if(m) image = decodeRssText(m[1]);
      }
      return {title, pubDate, link, description, image, source: feed.name, feedId: feed.id, kind: feed.kind};
    }).filter(i => i.title && i.title.length > 8);
  }

  function parseFeedItems(doc, feed, limit = 10){
    return doc.querySelector('item') ? parseRssItems(doc, feed, limit) : parseAtomItems(doc, feed, limit);
  }

  function normTitleKey(t){
    return t.toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim().slice(0, 60);
  }

  // ~80% tech/trending, ~20% top stories, interleaved for variety.
  // Sources with a NEWS_BOOST weight appear multiple times in the weighted
  // draw, so their stories are picked more often — but never twice.
  function buildNewsDeck(techPool, topPool){
    const pick = (pool, count) => {
      const seen = new Set();
      const picked = [];
      const rest   = [];
      const weighted = shuffleNews(pool.flatMap(i =>
        Array.from({length: Math.max(1, NEWS_BOOST[i.source] || 1)}, () => i)
      ));
      for(const i of weighted){
        const key = normTitleKey(i.title);
        if(seen.has(key)) continue;
        seen.add(key);
        (picked.length < count ? picked : rest).push(i);
      }
      return {picked, rest};
    };
    const t = pick(techPool, 10);
    const g = pick(topPool, 2);
    const deck = [];
    let ti = 0, gi = 0;
    const pattern = ['t','t','t','t','g','t','t','t','t','g','t','t'];
    for(const kind of pattern){
      if(kind === 't'){ if(ti < t.picked.length) deck.push(t.picked[ti++]); }
      else { if(gi < g.picked.length) deck.push(g.picked[gi++]); }
    }
    // If a pool was thin, fill the empty slots with leftover stories.
    for(const i of [...g.rest, ...t.rest]){
      if(deck.length >= 12) break;
      deck.push(i);
    }
    return deck;
  }

  function clearNewsRetry(){
    if(newsRetryTimer){ clearTimeout(newsRetryTimer); newsRetryTimer = null; }
  }

  function scheduleNewsRetry(){
    clearNewsRetry();
    // Backoff: 1 min, 2 min, 3 min... capped at 5 min between attempts.
    const delay = Math.min(60000 * Math.max(newsFailCount, 1), 300000);
    newsRetryTimer = setTimeout(fetchNews, delay);
  }

  function renderNewsError(){
    const track    = document.getElementById('newsTrack');
    const progress = document.getElementById('newsProgress');
    if(!track || !progress) return;
    track.innerHTML    = '';
    progress.innerHTML = '';
    const box = document.createElement('div');
    box.className = 'news-error';
    const p = document.createElement('p');
    p.textContent = newsFailCount > 1
      ? `News is unavailable after ${newsFailCount} attempts. Retrying automatically…`
      : 'News is unavailable. Retrying automatically…';
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'news-retry-btn';
    btn.textContent = 'Retry now';
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      newsFailCount = 0;
      clearNewsRetry();
      fetchNews();
    });

  }

  async function fetchNews(){
    if(newsLoading) return;
    newsLoading = true;
    // One fetch per source; the wrapped promises are shared between phases so
    // nothing is fetched twice.
    const tasks = NEWS_SOURCES.map(src =>
      fetchSource(src)
        .then(items => ({status: 'ok', items}))
        .catch(err => ({status: 'err', err}))
    );
    try {
      // Phase 1 — render as soon as any source has items (fast path is the
      // direct APIs, ~1-3s). If nothing arrives quickly, keep waiting for the
      // proxy-based RSS feeds up to ~25s total.
      let results = [];
      for(const ms of [4500, 9000, 15000, 25000]){
        results = await settleBatch(tasks, ms);
        const {techPool, topPool} = poolsFromResults(results);
        if(techPool.length || topPool.length) break;
      }
      const {techPool, topPool} = poolsFromResults(results);
      if(!techPool.length && !topPool.length) throw new Error('no items');

      newsItems = buildNewsDeck(techPool, topPool);
      const firstSources = new Set(newsItems.map(i => i.source));
      newsFailCount = 0;
      clearNewsRetry();
      if(!newsPopupOpen) renderNewsItems();

      // Phase 2 — if the deck is single-sourced, top up the mix when the
      // slower RSS sources land (never more than ~40s after page load).
      if(firstSources.size < 3){
        setTimeout(async () => {
          if(newsLoading || newsPopupOpen) return;
          const late = await settleBatch(tasks, 15000);
          const {techPool: t2, topPool: g2} = poolsFromResults(late);
          if(!t2.length && !g2.length) return;
          const deck2 = buildNewsDeck(t2, g2);
          const srcs2 = new Set(deck2.map(i => i.source));
          if(srcs2.size > firstSources.size || deck2.length > newsItems.length + 1){
            newsItems = deck2;
            if(!newsPopupOpen) renderNewsItems();
          }
        }, 18000);
      }
    } catch(err){
      newsFailCount++;
      console.warn('News fetch failed:', err);
      // If we have a previously loaded deck, keep showing it (stale is better than blank).
      if(!newsItems.length && !newsPopupOpen) renderNewsError();
      scheduleNewsRetry();
    } finally{
      newsLoading = false;
    }
  }

  function bindNewsControls(){
    const strip = document.getElementById('newsStrip');
    const prev  = document.getElementById('newsPrevBtn');
    const next  = document.getElementById('newsNextBtn');
    const pop   = document.getElementById('newsPop');
    const card  = document.getElementById('newsPopCard');
    if(prev) prev.addEventListener('click', (e) => { e.stopPropagation(); stepNews(-1); });
    if(next) next.addEventListener('click', (e) => { e.stopPropagation(); stepNews(1); });

    if(strip){
      strip.addEventListener('mouseenter', () => clearInterval(newsTimer));
      strip.addEventListener('mouseleave', () => { if(newsItems.length) restartNewsTimer(); });
    }

    if(pop){
      pop.addEventListener('click', closeNewsPopup);
    }
    if(card){
      card.addEventListener('click', (e) => e.stopPropagation());
    }
    document.addEventListener('keydown', (e) => {
      if(e.key === 'Escape') closeNewsPopup();
    });

    /* Touch / pen drag: the deck follows the finger while sliding and
       snaps to the nearest story on release — a real swipe-scroll, not
       just a fling threshold. Mouse pointers are left to the hold-to-
       arrange handler. */
    if(strip){
      let dragX0 = null, dragY0 = null, dragDx = 0, dragActive = false, dragPid = -1;
      const unit = () => Math.max(120, strip.clientWidth * 0.34);

      strip.addEventListener('pointerdown', (e) => {
        if(e.pointerType === 'mouse') return;
        if(document.body.classList.contains('home-arranging')) return;
        if(e.target.closest('button')) return;
        dragX0 = e.clientX; dragY0 = e.clientY; dragDx = 0;
        dragActive = false; dragPid = e.pointerId;
        clearInterval(newsTimer);
      });
      strip.addEventListener('pointermove', (e) => {
        if(dragPid !== e.pointerId || dragX0 == null) return;
        const dx = e.clientX - dragX0, dy = e.clientY - dragY0;
        if(!dragActive){
          if(Math.abs(dx) < 10) return;
          if(Math.abs(dy) > Math.abs(dx)){ dragX0 = null; return; }  // vertical page scroll
          dragActive = true;
          strip.classList.add('news-dragging');
        }
        dragDx = dx;
        const u = unit();
        const f = Math.max(-1.35, Math.min(1.35, dragDx / u));
        const track = document.getElementById('newsTrack');
        if(track) track.style.transform = `translateX(${-f * u}px)`;
      }, {passive: true});
      const endDrag = (e) => {
        if(dragPid !== e.pointerId || dragX0 == null) return;
        const track = document.getElementById('newsTrack');
        if(track) track.style.transform = '';
        strip.classList.remove('news-dragging');
        if(dragActive){
          newsSwiped = true;
          const steps = Math.round(dragDx / unit());
          if(steps) stepNews(-steps);
          else restartNewsTimer();
        } else if(newsItems.length){
          restartNewsTimer();
        }
        dragX0 = null; dragActive = false; dragPid = -1;
      };
      strip.addEventListener('pointerup', endDrag);
      strip.addEventListener('pointercancel', endDrag);
    }
  }
