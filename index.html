    const els = pageEl.querySelectorAll('.card, .radio-card, section');
    els.forEach(el => { el.style.animation = 'none'; });
    void pageEl.offsetWidth;
    els.forEach(el => { el.style.animation = ''; });
  }

  function clearPagePreview(){
    pageViewport.classList.remove('preview-up','preview-down');
  }

  function goToPage(next){
    if(next === curPage || pageAnimating) return;
    if(homeArranging) exitHomeArrange();
    pageAnimating = true;
    clearPagePreview();
    closeNewsPopup();

    const from = curPage;
    curPage = next;
    const down = next > from;
    railBtns.forEach((b, i) => b.classList.toggle('active', i === curPage));
    setRailIndicator();

    const out = pageEls[from];
    const inn = pageEls[next];
    inn.style.zIndex = 2;
    out.style.zIndex = 1;

    /* Leaving page: fog builds in over ~90ms then melts with the slide
       (the .fog-out animation — an instant whole-screen frost would
       flash the screen in a single frame). Incoming page: fully
       frosted while off-screen, clears as it slides in. */
    out.classList.add('fog-out');
    inn.style.transition = 'none';
    inn.style.filter = 'blur(18px) brightness(.5)';
    void inn.offsetWidth;
    inn.style.transition = '';
    void pageViewport.offsetWidth;
    inn.style.filter = '';
    inn.classList.remove('pos-above','pos-below');
    inn.classList.add('pos-active');
    out.classList.remove('pos-active');
    out.classList.add(down ? 'pos-above' : 'pos-below');

    pageReveal(inn);
    try{ localStorage.setItem(PAGE_KEY, String(curPage)); }catch(e){}

    setTimeout(() => {
      out.classList.remove('fog-out');
      out.style.zIndex = '';
      inn.style.zIndex = '';
      pageAnimating = false;
    }, 700);
  }

  railBtns.forEach((btn, i) => {
    btn.addEventListener('mouseenter', () => {
      if(i === curPage || pageAnimating || !canHover) return;
      pageViewport.classList.add(i > curPage ? 'preview-down' : 'preview-up');
    });
    btn.addEventListener('mouseleave', () => { if(!pageAnimating) clearPagePreview(); });
    btn.addEventListener('click', () => goToPage(i));
    btn.addEventListener('keydown', (e) => {
      if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); goToPage(i); }
    });
  });

  /* ── Rail input: tap commits, finger-drag scrubs the pages ──
     Press a rail icon and slide the finger along the rail: the pages
     follow the finger (one page per icon spacing, like detents), frost
     in proportion to how far they are pushed, and the indicator tracks
     it 1:1. On release the pages settle to the nearest icon — or, if
     the slide stayed in the current page's half, to the icon that was
     pressed, continuing the slide from where the finger left it. A
     plain tap frosts the glass instantly and commits. Works with mouse
     and touch alike. */
  let railPointer = null; /* {id, startY, btnIdx, dragging} */

  function railSpacing(){
    return railBtns[1].offsetTop - railBtns[0].offsetTop;
  }

  function applyRailProgress(p){
    pageEls.forEach((el, i) => {
      el.style.transform = 'translateY(' + ((i - p) * 101.5).toFixed(3) + '%)';
      /* Frosted-glass feel while the finger is held: the farther a
         page is from its rest position, the more it frosts — full
         frost (blur 18 / dim .5) once it is a whole page away. */
      const d = Math.min(1, Math.abs(i - p));
      el.style.filter = d < 0.02
        ? ''
        : 'blur(' + (18 * d).toFixed(1) + 'px) brightness(' + (1 - 0.5 * d).toFixed(3) + ')';
    });
    const top0 = railBtns[0].offsetTop;
    const top2 = railBtns[2].offsetTop;
    railIndicator.style.top = (top0 + (top2 - top0) * (p / 2)).toFixed(1) + 'px';
    const near = Math.round(p);
    railBtns.forEach((b, i) => b.classList.toggle('drag-target', i === near && i !== curPage));
  }

  /* Re-enable transitions, then drop the inline scrub styles so the
     pages animate from wherever the finger left them to their rest
     position. Clears the inline transition again once settled. */
  function settlePages(ms, ease, done){
    pageEls.forEach(el => {
      el.style.transition = 'transform ' + ms + ' ' + ease + ', filter ' + ms + ' ' + ease;
    });
    void pageViewport.offsetWidth;
    pageEls.forEach(el => { el.style.transform = ''; el.style.filter = ''; });
    setTimeout(() => {
      pageEls.forEach(el => { el.style.transition = ''; });
      if(done) done();
    }, parseInt(ms, 10) + 50);
  }

  function snapBackFromDrag(done){
    railBtns.forEach(b => b.classList.remove('drag-target'));
    railIndicator.style.transition = '';
    setRailIndicator();
    settlePages('380ms', 'var(--ease-spring)', () => {
      pageAnimating = false;
      if(done) done();
    });
  }

  function commitDrag(target){
    if(homeArranging) exitHomeArrange();
    const from = curPage;
    curPage = target;
    const inn = pageEls[target];
    const out = pageEls[from];
    inn.style.zIndex = 2;
    out.style.zIndex = 1;

    /* The scrub frost already on the pages melts away as they settle
       into place. */
    pageEls.forEach((el, i) => {
      el.classList.remove('pos-above','pos-active','pos-below');
      el.classList.add(i === curPage ? 'pos-active' : (i < curPage ? 'pos-above' : 'pos-below'));
    });
    settlePages('520ms', 'var(--ease-spring)', () => {
      inn.style.zIndex = '';
      out.style.zIndex = '';
      pageAnimating = false;
    });

    railBtns.forEach((b, i) => {
      b.classList.remove('drag-target');
      b.classList.toggle('active', i === curPage);
    });
    railIndicator.style.transition = '';
    setRailIndicator();
    closeNewsPopup();
    pageReveal(inn);
    try{ localStorage.setItem(PAGE_KEY, String(curPage)); }catch(e){}
  }

  pageRail.addEventListener('pointerdown', (e) => {
    if(railPointer || pageAnimating) return;
    if(e.pointerType === 'mouse' && e.button !== 0) return;
    const btn = e.target.closest('.rail-btn');
    railPointer = {
      id: e.pointerId,
      startY: e.clientY,
      btnIdx: btn ? railBtns.indexOf(btn) : -1,
      dragging: false
    };
    try{ pageRail.setPointerCapture(e.pointerId); }catch(err){}
  });

  pageRail.addEventListener('pointermove', (e) => {
    if(!railPointer || e.pointerId !== railPointer.id) return;
    const dy = e.clientY - railPointer.startY;
    if(!railPointer.dragging && Math.abs(dy) > 10){
      railPointer.dragging = true;
      pageAnimating = true;
      clearPagePreview();
      pageEls.forEach(el => { el.style.transition = 'none'; });
      railIndicator.style.transition = 'none';
    }
    if(railPointer.dragging){
      e.preventDefault();
      applyRailProgress(Math.min(2, Math.max(0, curPage + dy / railSpacing())));
    }
  });

  function finishRailPointer(e, cancelled){
    if(!railPointer || e.pointerId !== railPointer.id) return;
    const ptr = railPointer;
    railPointer = null;
    if(!ptr.dragging){
      /* Plain tap on an icon → commit (existing behavior). */
      if(ptr.btnIdx >= 0) goToPage(ptr.btnIdx);
      return;
    }
    if(cancelled){
      snapBackFromDrag();
      return;
    }
    const dy = e.clientY - ptr.startY;
    const p = Math.min(2, Math.max(0, curPage + dy / railSpacing()));
    const target = Math.round(p);
    if(target === curPage && (ptr.btnIdx < 0 || ptr.btnIdx === curPage)){
      /* No icon pressed, or jitter on the current icon → spring back. */
      snapBackFromDrag();
    } else if(target === curPage){
      /* The slide stayed in the current page's half but a different
         icon was pressed → commit to that icon, continuing the slide
         from wherever the finger left it (no wobble back first). */
      commitDrag(ptr.btnIdx);
    } else {
      commitDrag(target);
    }
  }
  pageRail.addEventListener('pointerup', (e) => finishRailPointer(e, false));
  pageRail.addEventListener('pointercancel', (e) => finishRailPointer(e, true));

  window.addEventListener('resize', setRailIndicator);
  window.addEventListener('load', setRailIndicator);

  /* Restore the last page instantly (no transition on boot). */
  (function(){
    let saved = 0;
    try{ saved = parseInt(localStorage.getItem(PAGE_KEY) || '0', 10) || 0; }catch(e){}
    if(saved >= 1 && saved < pageEls.length) curPage = saved;
    pageEls.forEach((el, i) => {
      el.style.transition = 'none';
      el.classList.remove('pos-above','pos-active','pos-below');
      el.classList.add(i === curPage ? 'pos-active' : (i < curPage ? 'pos-above' : 'pos-below'));
      void el.offsetWidth;
      el.style.transition = '';
      el.dataset.revealed = '1';
    });
    railBtns.forEach((b, i) => b.classList.toggle('active', i === curPage));
    setRailIndicator();
  })();

  /* ══════════════════════════════════════════
     STREAM WIDGET — Twitch / YouTube category
     tiles + player/chat popup.
     Data: teslurk.com/browse's own Helix endpoint
     (/api/helix?path=/streams?game_id=509658…) —
     teslurk sends no CORS headers, so requests
     route through the news module's public proxy
     chain, with r.jina.ai appended as a fallback.
     YouTube: placeholder tiles until a source is
     wired. Tap a live card → popup with the
     official Twitch embed + chat side by side.
     ══════════════════════════════════════════ */
  const SW_GAME_ID    = '509658';   // Just Chatting (teslurk.com/browse/509658)
  const SW_LIMIT      = 4;
  const SW_REFRESH_MS = 5 * 60 * 1000;
  const SW_API = 'https://teslurk.com/api/helix?path=' +
    encodeURIComponent(`/streams?game_id=${SW_GAME_ID}&first=${SW_LIMIT}`);
  const SW_PROXY_KEY  = 'tcinema.swProxy';
  const swGrid        = document.getElementById('swGrid');
  const swUpdated     = document.getElementById('swUpdated');
  const swPop         = document.getElementById('swPop');
  const swPopTitle    = document.getElementById('swPopTitle');
  const swPopViews    = document.getElementById('swPopViewCount');
  const swPlayerFrame = document.getElementById('swPlayerFrame');
  const swChatFrame   = document.getElementById('swChatFrame');
  const swTeslurkBtn  = document.getElementById('swTeslurkBtn');

  /* YouTube category — stubs until a data source is picked */
  const SW_YT_STUBS = [
    {title:'Tesla Live Cam — 24/7',       name:'YouTube'},
    {title:'EV News & Reviews',           name:'YouTube'},
    {title:'Road Trip Radio — Live',      name:'YouTube'},
    {title:'Supercharger Roadside Cam',   name:'YouTube'},
  ];

  let swTwitch  = [];      // live cards from gql
  let swCat     = 'all';   // all | twitch | youtube
  let swLoading = false;
  let swFail    = 0;
  let swPopupOpen = false;

  const swEyeSvg = '<svg viewBox="0 0 24 24"><path d="M12 4.5C7 4.5 2.7 7.6 1 12c1.7 4.4 6 7.5 11 7.5s9.3-3.1 11-7.5c-1.7-4.4-6-7.5-11-7.5zm0 12.5a5 5 0 1 1 0-10 5 5 0 0 1 0 10zm0-2.5a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5z"/></svg>';

  /* teslurk has no CORS headers → borrow the news module's proxy
     chain. jina leads: it's the only one that reliably answers from
     the browser today (allorigins 522s, corsproxy wants a key), and
     it wraps JSON in a markdown page, so we slice to the bare
     object before parsing. */
  const SW_PROXIES = [
    {name:'jina', make:u => 'https://r.jina.ai/' + u},
    ...NEWS_PROXIES,
  ];
  function swProxyOrder(){
    const order = SW_PROXIES.map((_, i) => i);
    try{
      const pref = parseInt(localStorage.getItem(SW_PROXY_KEY) || '', 10);
      if(!Number.isNaN(pref) && SW_PROXIES[pref]){
        order.splice(order.indexOf(pref), 1);
        order.unshift(pref);
      }
    }catch(e){}
    return order;
  }

  async function fetchTopStreams(){
    if(swLoading) return;
    swLoading = true;
    for(const idx of swProxyOrder()){
      const p = SW_PROXIES[idx];
      try{
        const res = await fetch(p.make(SW_API), {signal: AbortSignal.timeout(10000), cache:'no-store'});
        if(!res.ok) throw new Error('HTTP ' + res.status);
        let text = p.unwrap ? await p.unwrap(res) : await res.text();
        const brace = text.indexOf('{');
        if(brace < 0) throw new Error('not JSON');
        const j = JSON.parse(text.slice(brace));
        const rows = Array.isArray(j.data) ? j.data : [];
        if(!rows.length) throw new Error('no streams');
        // proxies may mangle the nested first=4 param — Helix returns
        // rows sorted by viewers, so just take the top SW_LIMIT.
        swTwitch = rows.slice(0, SW_LIMIT).map(s => ({
          cat:'twitch', id:s.id, login: s.user_login || '',
          name:    s.user_name  || s.user_login || '',
          title:   s.title      || '',
          viewers: s.viewer_count || 0,
          thumb: (s.thumbnail_url || '')
            .replace('{width}', '240').replace('{height}', '135')
        })).filter(s => s.login);
        try{ localStorage.setItem(SW_PROXY_KEY, String(idx)); }catch(e){}
        swFail = 0;
        if(swUpdated)
          swUpdated.textContent = 'updated ' +
            new Date().toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'});
        break;
      }catch(err){ swFail++; }
    }
    swLoading = false;
    renderStreamWidget();
  }

  function swCards(){
    const twitch = (swCat === 'youtube') ? [] : swTwitch;
    const yt     = (swCat === 'twitch')  ? [] : SW_YT_STUBS.map((s,i) =>
      ({cat:'youtube', id:'yt'+i, stub:true, title:s.title, name:s.name}));
    return [...twitch, ...yt];
  }

  function renderStreamWidget(){
    if(!swGrid) return;
    swGrid.innerHTML = '';

    /* Loading skeletons (Twitch half empty while the first fetch runs) */
    if(!swTwitch.length && swLoading && swCat !== 'youtube'){
      for(let i=0;i<SW_LIMIT;i++){
        const sk = document.createElement('div');
        sk.className = 'sw-skel';
        sk.innerHTML = '<div class="sw-skel-thumb"></div>' +
          '<div class="sw-skel-lines"><div class="sw-skel-bar" style="width:85%"></div>' +
          '<div class="sw-skel-bar" style="width:45%;animation-delay:.15s"></div></div>';
        swGrid.appendChild(sk);
      }
      return;
    }

    const cards = swCards();
    if(!cards.length){
      const empty = document.createElement('div');
      empty.className = 'sw-empty';
      empty.textContent = swFail ? 'Couldn\'t reach teslurk — retrying…'
                                 : 'No live streams right now';
      swGrid.appendChild(empty);
      return;
    }

    cards.forEach((s,i) => {
      const card = document.createElement('button');
      card.type = 'button';
      card.className = 'sw-card';
      card.style.animationDelay = (i*60) + 'ms';

      const thumb = document.createElement('div');
      thumb.className = 'sw-thumb' + (s.stub ? ' stub' : '');
      if(s.thumb){
        const img = document.createElement('img');
        img.src = s.thumb; img.alt = ''; img.loading = 'lazy';
        img.addEventListener('error', () => img.classList.add('bad'));
        thumb.appendChild(img);
      }

      const info = document.createElement('div');
      info.className = 'sw-info';
      const t = document.createElement('div');
      t.className = 'sw-title';
      t.textContent = s.title || '(untitled)';
      const meta = document.createElement('div');
      meta.className = 'sw-meta';
      const nm = document.createElement('span');
      nm.className = 'sw-name';
      nm.textContent = s.name;
      meta.appendChild(nm);
      if(!s.stub){
        const vw = document.createElement('span');
        vw.className = 'sw-views live';
        vw.innerHTML = swEyeSvg + '<span>' + (s.viewers||0).toLocaleString('en-US') + '</span>';
        meta.appendChild(vw);
      }else{
        const soon = document.createElement('span');
        soon.className = 'sw-soon';
        soon.textContent = 'soon';
        meta.appendChild(soon);
      }
      info.appendChild(t);
      info.appendChild(meta);

      card.appendChild(thumb);
      card.appendChild(info);
      card.addEventListener('click', () => openStreamPopup(s));
      swGrid.appendChild(card);
    });
    fitStreamWidget();
  }

  /* The app's tiles clip, they never scroll — hide cards that fall
     past the tile's bottom edge (runs on render + every resize). */
  function fitStreamWidget(){
    if(!swGrid) return;
    /* Narrow tiles: drop the timestamp before it collides with the pills. */
    const tile = document.getElementById('streamWidget');
    if(tile) tile.classList.toggle('sw-narrow', tile.clientWidth < 360);
    const cards = [...swGrid.querySelectorAll('.sw-card')];
    if(!cards.length) return;
    cards.forEach(c => c.style.display = '');
    const h = swGrid.clientHeight;
    let visible = 0;
    for(const c of cards){
      if(c.offsetTop + c.offsetHeight > h + 1) break;
      visible++;
    }
    cards.forEach((c,i) => { if(i >= visible) c.style.display = 'none'; });
  }

  /* ── popup: official Twitch embed + chat, side by side ── */
  function openStreamPopup(s){
    /* Arrange mode: taps drag the tile — never open mid-rearrange. */
    if(document.body.classList.contains('home-arranging')) return;
    if(s.stub || !s.login) return;   // YouTube stubs: nothing to play yet
    swPopupOpen = true;
    swPopTitle.textContent = (s.name || '') + ' — ' + (s.title || '');
    swPopViews.textContent = (s.viewers || 0).toLocaleString('en-US');
    /* parent must match the serving host — dynamic so localhost
       previews and msrisabaranjan.github.io both embed cleanly. */
    const parent = encodeURIComponent(location.hostname);
    const ch     = encodeURIComponent(s.login);
    /* teslurk hand-off: their own player (proxied HLS) is the one that
       survives Tesla's while-driving block — we can't embed it (frame
       deny), so point the popup's teslurk button at the channel. */
    swTeslurkBtn.href = 'https://teslurk.com/' + ch;
    swPlayerFrame.src = `https://player.twitch.tv/?channel=${ch}&parent=${parent}&muted=true&autoplay=true`;
    setTimeout(() => {
      if(swPopupOpen)
        swChatFrame.src = `https://www.twitch.tv/embed/${ch}/chat?parent=${parent}&darkpopout`;
    }, 420);
    swPop.classList.add('open');
    swPop.setAttribute('aria-hidden','false');
  }
  function closeStreamPopup(){
    if(!swPopupOpen) return;
    swPopupOpen = false;
    swPop.classList.remove('open');
    swPop.setAttribute('aria-hidden','true');
    swPlayerFrame.src = '';
    setTimeout(() => { swChatFrame.src = ''; }, 380);
  }
  document.getElementById('swPopClose').addEventListener('click', closeStreamPopup);
  swPop.addEventListener('click', e => { if(e.target === swPop) closeStreamPopup(); });
  document.addEventListener('keydown', e => {
    if(e.key === 'Escape' && swPopupOpen) closeStreamPopup();
  });

  /* ── category pills ── */
  document.querySelectorAll('.sw-pill').forEach(p => {
    p.addEventListener('click', () => {
      if(p.dataset.cat === swCat) return;
      swCat = p.dataset.cat;
      document.querySelectorAll('.sw-pill').forEach(q => {
        const on = q === p;
        q.classList.toggle('active', on);
        q.setAttribute('aria-selected', on ? 'true' : 'false');
      });
      renderStreamWidget();
      if(swCat !== 'youtube' && !swTwitch.length && !swLoading) fetchTopStreams();
    });
  });

  renderStreamWidget();
  fetchTopStreams();
  setInterval(fetchTopStreams, SW_REFRESH_MS);

  /* ══════════════════════════════════════════
     HOME TILES — Gridstack grid placement.
     12-column grid, 90px rows, 9px item margin
     (the old 18px gutter). Tiles snap to cells;
     dragging pushes colliding tiles and the
     grid compacts — overlap resolution and
     reflow are the library's job now. Hold a
     tile to enter arrange mode (grips
     + placement grid), drag the grip (the map
     tile drags from anywhere), resize from
     the SE corner (proportional). Layout persists.
     Tap outside a tile, Done or Esc to exit.
     ══════════════════════════════════════════ */
  const homePageEl = pageEls[0];
  const arrangeDoneBtn = document.getElementById('arrangeDone');
  const HOME_GRID_KEY = 'tcal.homeGrid.v1';
  const HOME_POS_KEY  = 'tcal.homePos';   /* legacy pixel model, migrated once */
  const GRID_COLS   = 12;
  const GRID_ROW_H  = 90;    /* cell height px; cell width = container/12 */
  const GRID_MARGIN = 9;     /* per side → 18px gutter between tiles */
  const homeTiles = [
    document.getElementById('newsStrip'),
    document.getElementById('avatarPanel'),
    document.getElementById('navSection'),
    document.getElementById('stockTile'),
    document.getElementById('streamWidget')
  ];
  const homeTileIds = homeTiles.map(t => t.id);
  let homeArranging = false;
  let holdTimer = null, holdInfo = null, holdPos = null;

  /* Content area metrics: the grid box (origin --hx/--hy, right margin
     --hxr per breakpoint) and the live cell pitch for the overlay. */
  const homeGridEl = document.getElementById('homeGrid');
  function homeMetrics(){
    const cs = getComputedStyle(homePageEl);
    const ox = parseFloat(cs.getPropertyValue('--hx')) || 24;
    const oy = parseFloat(cs.getPropertyValue('--hy')) || 16;
    const or = parseFloat(cs.getPropertyValue('--hxr')) || 104;
    return {
      ox, oy,
      W: Math.max(60, homePageEl.clientWidth - ox - or)
    };
  }
  function syncGridOverlay(){
    const m = homeMetrics();
    homePageEl.style.setProperty('--cell-w', (m.W / GRID_COLS) + 'px');
    /* live pitch — fitHomeGrid() may have scaled the row height away
       from the GRID_ROW_H default, and the overlay must sit on the
       real cell edges */
    const ch = parseFloat(grid.opts.cellHeight) || GRID_ROW_H;
    homePageEl.style.setProperty('--cell-h', ch + 'px');
  }

  /* Home never scrolls: scale the cell pitch so every occupied row
     fits the visible area. The bottom reserve (--hb) mirrors the
     now-playing bar's lane when it's up and collapses to a small
     gutter when it's down — it feeds fitHomeGrid(), the grid
     container's min-height, and the placement overlay, so the
     droppable area and the drawn boxes always match. Gridstack
     drives all item geometry from --gs-cell-height, so one setter
     call re-fits the whole layout; tiles still resize freely — the
     cells just shrink to keep everything on-screen. */
  const npBarEl = document.getElementById('nowPlaying');
  function homeBottomReserve(){
    return (npBarEl && npBarEl.classList.contains('visible')) ? 140 : 24;
  }
  function fitHomeGrid(){
    const cs = getComputedStyle(homePageEl);
    const oy = parseFloat(cs.getPropertyValue('--hy')) || 16;
    const reserve = homeBottomReserve();
    homePageEl.style.setProperty('--hb', reserve + 'px');
    const rows = Math.max(1, grid.getRow());
    const avail = homePageEl.clientHeight - oy - reserve;
    /* Never stretch past the design pitch — rows only shrink to fit,
       so placement boxes stay near-square instead of turning into
       tall rectangles when few rows are occupied. The leftover
       bottom space stays droppable (container min-height covers it). */
    const cell = Math.max(40, Math.min(GRID_ROW_H, Math.floor(avail / rows)));
    /* Stretch the droppable box to the usable area (px, not calc() —
       the engine parseHeight()s the container's min-height). */
    homeGridEl.style.minHeight = avail + 'px';
    grid.cellHeight(cell);
    syncGridOverlay();
  }
  /* The bar shows/hides from the player code — refit when its class
     flips so tiles claim the freed strip (or duck under the bar). */
  if(npBarEl){
    let npWasVisible = npBarEl.classList.contains('visible');
    new MutationObserver(() => {
      const v = npBarEl.classList.contains('visible');
      if(v === npWasVisible) return;
      npWasVisible = v;
      fitHomeGrid();
    }).observe(npBarEl, {attributes:true, attributeFilter:['class']});
  }

  /* ── The grid ──
     staticGrid starts true: display-only until arrange mode. The drag
     handle is the grip pill, so the news swipe, the map iframe and the
     stock rows keep their own pointer behavior; the map tile has no
     grip, so Gridstack falls back to whole-item dragging and its
     .nav-drag-layer catches the pointer (the iframe would eat it). */
  const grid = GridStack.init({
    column: GRID_COLS,
    cellHeight: GRID_ROW_H,
    margin: GRID_MARGIN,
    staticGrid: true,
    float: true,                        /* free placement: tiles stay where
                                           dropped — no vertical compaction
                                           yanking them back over empty rows */
    animate: false,                     /* first paint: no slide-in */
    handle: '.tile-grip',
    draggable: { handle: '.tile-grip', appendTo: 'parent' },
    resizable: { handles: 'se' },
    alwaysShowResizeHandle: true   /* 'mobile' hides the handle on desktop
                                      (autohide) and the drag-end hover
                                      dance made it effectively unusable */
  }, homeGridEl);

  /* Restore the saved layout, migrating the legacy pixel model once. */
  function migrateLegacyLayout(){
    /* Old model: {id:{x,y}} content-px offsets, fixed tile widths.
       Convert to cells so long-time installs keep their arrangement. */
    try{
      const saved = JSON.parse(localStorage.getItem(HOME_POS_KEY));
      if(!saved || typeof saved !== 'object') return null;
      const pitch = homeMetrics().W / GRID_COLS;
      const widths = { newsStrip:660, avatarPanel:200, navSection:340, stockTile:440 };
      const out = [];
      homeTileIds.forEach(id => {
        const p = saved[id];
        if(!p || !isFinite(p.x) || !isFinite(p.y)) return;
        const el = homeTiles.find(t => t.id === id);
        out.push({
          id,
          x: Math.max(0, Math.min(GRID_COLS - 2, Math.round(p.x / pitch))),
          y: Math.max(0, Math.round(p.y / GRID_ROW_H)),
          w: Math.max(2, Math.min(GRID_COLS, Math.round((widths[id] || 200) / pitch))),
          h: Math.max(2, Math.round(((el && el.offsetHeight) || 180) / GRID_ROW_H))
        });
      });
      return out.length ? out : null;
    }catch(e){ return null; }
  }
  (function(){
    let saved = null;
    try{
      const s = JSON.parse(localStorage.getItem(HOME_GRID_KEY));
      if(Array.isArray(s) && s.length) saved = s;
    }catch(e){}
    if(!saved) saved = migrateLegacyLayout();
    if(!saved) return;
    /* Always load the full set — ids missing from an older save fall
       back to the DOM's default gs-* geometry. (save() omits w/h for
       fixed-size items, so merge field by field, not item by item.) */
    const byId = {};
    saved.forEach(it => { if(it && it.id) byId[it.id] = it; });
    const items = homeTileIds.map(id => {
      const it  = byId[id];
      const el  = homeGridEl.querySelector('[gs-id="' + id + '"]');
      const num = a => { const v = parseInt(el.getAttribute(a), 10); return isFinite(v) ? v : 0; };
      const g   = k => { const v = it && it[k]; return isFinite(v) ? v : num('gs-' + k); };
      return { id, x: g('x'), y: g('y'), w: g('w') || 1, h: g('h') || 1 };
    });
    grid.load(items);
  })();

  /* Persist after every move/resize (debounced — 'change' is the one
     event v14 fires for both). Re-slot the stock rows into the tile's
     new width while we're here. */
  let saveTimer = 0;
  grid.on('change', () => {
    renderStockTile();
    fitNewsTile();
    fitStreamWidget();
    fitHomeGrid();
    if(saveTimer) clearTimeout(saveTimer);
    saveTimer = setTimeout(() => {
      try{
        /* Geometry only, read from the live engine nodes — save()
           strips w/h when they equal minW/minH (its "implicit"
           optimization), which would make a tile snapped to its
           minimum reload at the DOM default and collide. */
        const items = grid.engine.nodes.map(n => ({id:n.id, x:n.x, y:n.y, w:n.w, h:n.h}));
        localStorage.setItem(HOME_GRID_KEY, JSON.stringify(items));
        localStorage.removeItem(HOME_POS_KEY);
      }catch(e){}
    }, 250);
  });

  /* First paint settled — let later moves slide. */
  requestAnimationFrame(() => requestAnimationFrame(() => grid.setAnimation(true)));
  fitHomeGrid();

  /* ── arrange mode ── */
  function enterHomeArrange(tile){
    /* An expanded map can't be dragged in its grown state (its box is
       CSS-overridden) — settle it back to its grid slot first. */
    if(navSectionEl && navSectionEl.classList.contains('expanded')) setNavExpanded(false);
    homeArranging = true;
    document.body.classList.add('home-arranging');
    homePageEl.classList.add('arranging');
    arrangeDoneBtn.classList.add('show');
    arrangeDoneBtn.setAttribute('aria-hidden', 'false');
    grid.setStatic(false);
    try{ if(navigator.vibrate) navigator.vibrate(15); }catch(e){}
  }

  function exitHomeArrange(){
    if(!homeArranging) return;
    homeArranging = false;
    grid.setStatic(true);
    document.body.classList.remove('home-arranging');
    homePageEl.classList.remove('arranging');
    arrangeDoneBtn.classList.remove('show');
    arrangeDoneBtn.setAttribute('aria-hidden', 'true');
  }

  /* Expand / collapse the nav map in place — one iframe instance, the
     SHELL grows to fill the grid box (see #navItem.expanded). The grid
     slot itself is untouched, so collapsing hands the cell right back.
     The cross-origin map re-renders on every iframe resize, so the
     morph never resizes the iframe: it stays frozen at its current
     size while the shell box + a .nav-frame-wrap transform carry the
     whole motion (layout + compositor only). Only when the morph
     finishes does the iframe swap to its target geometry — one
     re-render, at matched on-screen zoom and framing, so it reads as
     a frame, not a jump. The CSS var transitions above remain as a
     fallback for paths that toggle .expanded without this driver. */
  const navSectionEl = document.getElementById('navSection');
  const navItemEl    = document.getElementById('navItem');
  const navExpandBtn = document.getElementById('navExpandBtn');
  const navWrapEl    = document.getElementById('navFrameWrap');
  const navFrameEl   = document.getElementById('navFrame');
  const NAV_MORPH_MS = 180;
  let navMorph  = null;                       // { raf, t0, from, to, fromWrap, toWrap }
  let navWrapT  = { tx: 0, ty: 0, s: 1 };     // last rendered wrapper transform
  let navRender = null;                       // frozen map framing { r, ox, oy }
  let navMorphCleanup = 0;                    // rAF that re-enables CSS transitions

  /* cubic-bezier(.16,.84,.44,1) — the page's --ease-out in JS, so the
     shell box and the wrapper transform share one exact clock. */
  function navEase(x){
    if(x <= 0) return 0;
    if(x >= 1) return 1;
    const cx = 3 * .16, bx = 3 * (.44 - .16) - cx, ax = 1 - cx - bx;
    const cy = 3 * .84, by = 3 * (1 - .84) - cy, ay = 1 - cy - by;
    const X  = t => ((ax * t + bx) * t + cx) * t;
    const Y  = t => ((ay * t + by) * t + cy) * t;
    const DX = t => (3 * ax * t + 2 * bx) * t + cx;
    let t = x;
    for(let i = 0; i < 8; i++){               /* Newton-Raphson */
      const e = X(t) - x;
      if(Math.abs(e) < 1e-6) break;
      const d = DX(t);
      if(Math.abs(d) < 1e-6) break;
      t -= e / d;
    }
    let lo = 0, hi = 1;
    for(let i = 0; i < 24 && Math.abs(X(t) - x) >= 1e-6; i++){  /* bisection */
      if(X(t) > x) hi = t; else lo = t;
      t = (lo + hi) / 2;
    }
    return Y(t);
  }

  function setNavExpanded(on){
    if(!navSectionEl || !navItemEl || !navExpandBtn || !navWrapEl || !navFrameEl) return;
    const tile = navSectionEl, shell = navItemEl;
    if(tile.classList.contains('expanded') === on) return;
    navExpandBtn.setAttribute('aria-label', on ? 'Shrink map' : 'Expand map');
    navExpandBtn.title = on ? 'Shrink map' : 'Expand map';

    /* Re-aim mid-morph: cancel the running clock. The frozen rendering
       stays frozen (no map re-render) and the new morph starts from
       whatever frame is on screen. */
    if(navMorph) cancelAnimationFrame(navMorph.raf);
    if(navMorphCleanup) cancelAnimationFrame(navMorphCleanup);

    /* Current box, read BEFORE the class flips below (a style recalc
       after the flip would already report the target box), in the grid
       container's space — the shell's offsetParent. */
    const rect  = shell.getBoundingClientRect();
    const cRect = homeGridEl.getBoundingClientRect();
    const from = {
      x: rect.left - cRect.left,
      y: rect.top  - cRect.top,
      w: rect.width,
      h: rect.height
    };

    /* Freeze the map at its current size (at rest the 100%-based size
       equals the current rest geometry) and remember its framing:
       the iframe's own transform is translate(ox,oy) scale(r). */
    if(!navRender){
      const cs0 = getComputedStyle(tile);
      const r0 = parseFloat(cs0.getPropertyValue('--nav-zoom')) || 1;
      navRender = {
        r:  r0,
        ox: -r0 * (parseFloat(cs0.getPropertyValue('--crop-l')) || 0),
        oy: -r0 * (parseFloat(cs0.getPropertyValue('--crop-t')) || 0)
      };
      /* The iframe's LAYOUT box — getBoundingClientRect would report
         the post-transform rect (0.7× the layout size when collapsed). */
      const cfw = getComputedStyle(navFrameEl);
      navFrameEl.style.width  = cfw.width;
      navFrameEl.style.height = cfw.height;
    }

    /* Classes = destination (icon + drag layer reflect the target; the
       shell class carries the grown box). Their !important values are
       overridden by the pins below — all within this task, before the
       next paint. */
    tile.classList.add('nav-morphing');
    shell.classList.add('nav-morphing');
    tile.classList.toggle('expanded', on);
    shell.classList.toggle('expanded', on);

    /* Target rest box + framing, straight off the computed styles (the
       classes hold them). The shell's 100% box resolves against the
       grid container, so the computed values are px. */
    const cs  = getComputedStyle(shell);
    const csC = getComputedStyle(tile);
    const to = {
      x: parseFloat(cs.left) || 0,
      y: parseFloat(cs.top)  || 0,
      w: parseFloat(cs.width),
      h: parseFloat(cs.height)
    };
    const K  = parseFloat(csC.getPropertyValue('--nav-zoom')) || 1;
    const Ox = -K * (parseFloat(csC.getPropertyValue('--crop-l')) || 0);
    const Oy = -K * (parseFloat(csC.getPropertyValue('--crop-t')) || 0);

    /* Pin the shell box at the CURRENT position (inline !important
       beats the .expanded !important rules and Gridstack's inline
       geometry) and the framing vars at the frozen rendering's values,
       so the iframe's own transform matches what it is actually
       rendering. */
    const pin  = (p, v, imp) => shell.style.setProperty(p, v, imp ? 'important' : '');
    const pinC = (p, v) => tile.style.setProperty(p, v, '');
    pin('left', from.x + 'px', true);
    pin('top', from.y + 'px', true);
    pin('width', from.w + 'px', true);
    pin('height', from.h + 'px', true);
    pinC('--nav-zoom', String(navRender.r));
    pinC('--crop-l', (-navRender.ox / navRender.r) + 'px');
    pinC('--crop-t', (-navRender.oy / navRender.r) + 'px');

    /* Wrapper transform: from = what is on screen now, to = the
       transform that makes the frozen rendering (r*app + o) present
       the destination's framing (K*app + O): s = K/r, t = O - s*o. */
    const sT = K / navRender.r;
    navMorph = {
      raf: 0, t0: performance.now(), from, to,
      fromWrap: { tx: navWrapT.tx, ty: navWrapT.ty, s: navWrapT.s },
      toWrap: { s: sT, tx: Ox - sT * navRender.ox, ty: Oy - sT * navRender.oy }
    };
    const step = now => {
      const p = navEase(Math.min(1, (now - navMorph.t0) / NAV_MORPH_MS));
      const f = navMorph.from, tg = navMorph.to,
            fw = navMorph.fromWrap, tw = navMorph.toWrap;
      pin('left', (f.x + (tg.x - f.x) * p) + 'px', true);
      pin('top', (f.y + (tg.y - f.y) * p) + 'px', true);
      pin('width', (f.w + (tg.w - f.w) * p) + 'px', true);
      pin('height', (f.h + (tg.h - f.h) * p) + 'px', true);
      navWrapT = {
        tx: fw.tx + (tw.tx - fw.tx) * p,
        ty: fw.ty + (tw.ty - fw.ty) * p,
        s: fw.s + (tw.s - fw.s) * p
      };
      navWrapEl.style.transform =
        'translate(' + navWrapT.tx + 'px,' + navWrapT.ty + 'px) scale(' + navWrapT.s + ')';
      if(p < 1){
        navMorph.raf = requestAnimationFrame(step);
      }else{
        finishNavMorph();
      }
    };
    navMorph.raf = requestAnimationFrame(step);
  }

  /* Swap the frozen iframe to its target geometry — the one and only
     map re-render of the morph (same on-screen zoom and framing, so
     it reads as a frame, not a jump; the frozen rendering can fall a
     few px short of the new window at one edge for this single frame)
     — then hand control back to the CSS and to Gridstack: the pins
     were the shell's only !important geometry, so removing them
     reveals Gridstack's inline cell values again. */
  function finishNavMorph(){
    const tile = navSectionEl, shell = navItemEl;
    navMorph = null;
    navRender = null;
    navWrapT = { tx: 0, ty: 0, s: 1 };
    navWrapEl.style.transform = '';
    navFrameEl.style.width = '';
    navFrameEl.style.height = '';
    tile.style.removeProperty('--nav-zoom');
    tile.style.removeProperty('--crop-l');
    tile.style.removeProperty('--crop-t');
    /* Gridstack v14 positions shells with inline left/top/width/height
       calc() strings — the --gs-* vars it also writes are NOT consumed by
       the vendored CSS — so merely removing our pins would wipe the
       engine's geometry too (the shell would fall back to one cell).
       Hand the box back by re-running the engine's own position writer
       on the live node; the manual branch mirrors its exact output. */
    const n = shell.gridstackNode;
    if(n && grid.engine._writePosAttr) grid.engine._writePosAttr(shell, n);
    else if(n){
      const st = shell.style;
      st.top    = n.y ? (n.y === 1 ? 'var(--gs-cell-height)' : 'calc(' + n.y + ' * var(--gs-cell-height))') : '';
      st.left   = n.x ? (n.x === 1 ? 'var(--gs-column-width)' : 'calc(' + n.x + ' * var(--gs-column-width))') : '';
      st.width  = n.w > 1 ? 'calc(' + n.w + ' * var(--gs-column-width))' : '';
      st.height = n.h > 1 ? 'calc(' + n.h + ' * var(--gs-cell-height))' : '';
    }else{
      shell.style.removeProperty('left');
      shell.style.removeProperty('top');
      shell.style.removeProperty('width');
      shell.style.removeProperty('height');
    }
    /* Keep the CSS transitions disabled for one more frame: the var
       pins just snapped to the class values (transition:none → the
       fallback @property transition cannot start on that jump). Only
       once the new values are settled is it safe to re-enable — with
       no pending change, there is nothing left to animate. */
    navMorphCleanup = requestAnimationFrame(() => {
      tile.classList.remove('nav-morphing');
      shell.classList.remove('nav-morphing');
      navMorphCleanup = 0;
    });
    navLastFrame = null;   /* the iframe swap reflow re-measures it */
  }

  if(navExpandBtn){
    navExpandBtn.addEventListener('click', () =>
      setNavExpanded(!navSectionEl.classList.contains('expanded')));
  }

  /* Resize freeze: dragging the SE handle changes the tile every frame,
     and the 100%-based iframe would re-render the cross-origin map per
     frame. Pin the iframe at its last settled box and scale the frozen
     rendering to the new size; one re-render when the drag settles.
     (The expand/collapse morph has its own freeze — navRender — and
     takes precedence.) */
  let navLastFrame = null;   // settled iframe layout box { w, h, cw, r, ox, oy }
  let navFreeze    = null;   // active resize freeze (same shape)
  let navFreezeT   = 0;
  function settledFrameBox(){
    const cs  = getComputedStyle(navFrameEl);
    const cs0 = getComputedStyle(navSectionEl);
    const r0  = parseFloat(cs0.getPropertyValue('--nav-zoom')) || 1;
    return {
      w:  parseFloat(cs.width) || 0,
      h:  parseFloat(cs.height) || 0,
      cw: navSectionEl.clientWidth,
      r:  r0,
      ox: -r0 * (parseFloat(cs0.getPropertyValue('--crop-l')) || 0),
      oy: -r0 * (parseFloat(cs0.getPropertyValue('--crop-t')) || 0)
    };
  }
  function settleNavResize(){
    if(!navFreeze) return;
    navFreeze = null;
    navFrameEl.style.width = '';
    navFrameEl.style.height = '';
    navSectionEl.style.removeProperty('--nav-zoom');
    navSectionEl.style.removeProperty('--crop-l');
    navSectionEl.style.removeProperty('--crop-t');
    navWrapEl.style.transform = '';
    navWrapT = { tx: 0, ty: 0, s: 1 };
    navLastFrame = null;   /* the unfreeze reflow re-measures it */
  }
  if('ResizeObserver' in window && navSectionEl && navFrameEl){
    const navRO = new ResizeObserver(() => {
      if(navMorph || navRender) return;        /* the morph owns the iframe */
      if(!homeArranging){
        settleNavResize();
        navLastFrame = settledFrameBox();      /* settled: remember the box */
        return;
      }
      /* arranging: pin at the last settled box (first tick) or keep the
         pin and just rescale the frozen render (later ticks). */
      const base = navFreeze || navLastFrame || settledFrameBox();
      if(!navFreeze){
        navFreeze = base;
        navFrameEl.style.width  = base.w + 'px';
        navFrameEl.style.height = base.h + 'px';
        navSectionEl.style.setProperty('--nav-zoom', String(base.r));
        navSectionEl.style.setProperty('--crop-l', (-base.ox / base.r) + 'px');
        navSectionEl.style.setProperty('--crop-t', (-base.oy / base.r) + 'px');
      }
      const s = navSectionEl.clientWidth / (base.cw || navSectionEl.clientWidth);
      navWrapT = { tx: 0, ty: 0, s };
      navWrapEl.style.transform = 'scale(' + s + ')';
      clearTimeout(navFreezeT);
      navFreezeT = setTimeout(settleNavResize, 220);
    });
    navRO.observe(navSectionEl);
  }

  /* Hold detection: press still for 420ms to enter arrange mode.
     Any movement (>12px) or release cancels, so scrolling, the news
     swipe and plain taps all keep working. Once arranging, Gridstack
     drives the drag from the grip / map layer — no manual drag code. */
  function clearHold(){
    if(holdTimer){ clearTimeout(holdTimer); holdTimer = null; }
    holdInfo = null;
    holdPos = null;
    document.removeEventListener('pointermove', onHoldMove);
    document.removeEventListener('pointerup', onHoldEnd);
    document.removeEventListener('pointercancel', onHoldEnd);
  }

  function onHoldMove(e){
    /* Ignore other pointers (a second finger / the other hand must not
       cancel this hold). */
    if(!holdInfo || e.pointerId !== holdInfo.pid) return;
    holdPos = { x: e.clientX, y: e.clientY };
    if(Math.hypot(e.clientX - holdInfo.x, e.clientY - holdInfo.y) > 12) clearHold();
  }

  function onHoldEnd(e){
    if(!holdInfo || e.pointerId !== holdInfo.pid) return;
    clearHold();
  }

  homeTiles.forEach(tile => {
    tile.addEventListener('pointerdown', (e) => {
      if(e.pointerType === 'mouse' && e.button !== 0) return;
      /* Buttons / inputs keep their own behavior. */
      if(e.target.closest('button,input,a,select,textarea,label')) return;
      /* Arranging: Gridstack owns the pointers (grip drag, corner
         resize) — a hold here would only fight it. */
      if(homeArranging) return;
      holdInfo = { tile, x: e.clientX, y: e.clientY, pid: e.pointerId };
      holdPos  = { x: e.clientX, y: e.clientY };
      /* A second pointer starting its own hold supersedes the first one —
         drop the stale timer or it would fire with the new pointer's info. */
      if(holdTimer) clearTimeout(holdTimer);
      document.addEventListener('pointermove', onHoldMove);
      document.addEventListener('pointerup', onHoldEnd);
      document.addEventListener('pointercancel', onHoldEnd);
      holdTimer = setTimeout(() => {
        const info = holdInfo;
        holdTimer = null;
        document.removeEventListener('pointermove', onHoldMove);
        document.removeEventListener('pointerup', onHoldEnd);
        document.removeEventListener('pointercancel', onHoldEnd);
        if(!info) return;
        enterHomeArrange(info.tile);
      }, 420);
    });
  });

  /* Tap outside a tile (on empty page area) to exit arrange mode.
     The resize handles live on the shell, outside .home-tile — they
     count as inside or grabbing one would kick out of arrange mode. */
  homePageEl.addEventListener('pointerdown', (e) => {
    if(!homeArranging) return;
    if(e.target.closest('.home-tile,.grid-stack-placeholder,.arrange-done,.ui-resizable-handle')) return;
    exitHomeArrange();
  });

  arrangeDoneBtn.addEventListener('click', exitHomeArrange);
  document.addEventListener('keydown', (e) => {
    if(e.key === 'Escape' && homeArranging) exitHomeArrange();
  });

  /* Window resize: Gridstack re-measures the container itself; keep the
     overlay pitch, the on-screen fit and the stock columns in sync. */
  window.addEventListener('resize', () => {
    fitHomeGrid();
    renderStockTile();
    fitStreamWidget();
  });
  </script>

  <script>
  /* ── AVATAR COMPANION — MULTI-FORM SPRITE ENGINE ──
     Sprite art: PMDCollab (sprites.pmdcollab.org), CC BY-NC 4.0 —
     credits_red.txt (Charmander line + egg), credits_starters.txt (starters).

     The avatar evolves with the distance driven today (persisted across
     page reloads; resets at local midnight). Stage 0 (0–5 mi) is the egg,
     which hatches into one of four lines, chosen uniformly at random at
     hatch and persisted in the session:
       red:   Charmander → Charmeleon → Charizard
       grass: Bulbasaur → Ivysaur → Venusaur
       water: Mudkip → Marshtomp → Swampert
       fire:  Torchic → Combusken → Blaziken
     Stages: 1 = 5–10 mi, 2 = 10–20 mi, 3 = 20–25 mi.
     At 25 mi the cycle restarts: the final form streaks to the collection
     card in the right dock (its own panel above the page rail), a fresh
     egg appears, and the line is re-rolled at the next hatch. Tapping a
     card slot swaps places: the displayed companion flies into that slot
     and the slot's form flies onto the stage (tap the stage, or the slot
     again, to swap back); a live evolution always takes the stage back.
     Collected forms and the cycle count persist with the daily session.
     The egg is shared by all lines: Idle while parked, Tumble while moving,
     and Hurt in the HATCH_SOON_MI window before it hatches (with a gold
     flash build-up).
     Each form folder keeps its own sprites + AnimData XML. The metadata below
     mirrors those XML files so the page animates without fetching them.
  */
  (function(){
    const avatarPanel = document.getElementById('avatarPanel');
    const canvas = document.getElementById('avatarCanvas');
    if(!avatarPanel || !canvas) return;

    const ctx = canvas.getContext('2d');

    /* Keep the canvas buffer matched to the rendered box (× dpr): the
       tile is narrower than the sprite's 150px CSS box, and a fixed
       buffer stretched into that squashed box made the egg look
       distorted. Square CSS + buffer-matched redraws keep it crisp. */
    function sizeCanvas(){
      const w = canvas.clientWidth, h = canvas.clientHeight;
      if(w < 20 || h < 20) return;
      const dpr = Math.min(2, window.devicePixelRatio || 1);
      const bw = Math.round(w * dpr), bh = Math.round(h * dpr);
      if(canvas.width !== bw || canvas.height !== bh){
        canvas.width = bw; canvas.height = bh;
      }
    }
    sizeCanvas();
    if('ResizeObserver' in window) new ResizeObserver(sizeCanvas).observe(canvas);
    window.addEventListener('resize', sizeCanvas);
    const moodLabel = document.getElementById('avatarMoodLabel');
    const infoLabel = document.getElementById('avatarInfo');
    const gpsDot = document.getElementById('avatarGpsDot');
    const stage = document.getElementById('avatarStage');
    const formLabel = document.getElementById('avatarFormLabel');
    const holdingEl = document.getElementById('railAvatars');
    const holdCountEl = document.getElementById('avatarHoldCount');
    const trailLayer = document.getElementById('trailLayer');

    /* ── EVOLUTION PATHS ──
       The egg (shared stage 0) hatches into one of four lines, chosen
       uniformly at random at hatch and persisted in the daily session. */
    const EGG = { id:'egg', label:'Egg', dir:'images/egg/', suffix:'' };
    /* Display names are code names (see the header + info line); the id/dir
       fields are the asset identities and must stay in sync with images/. */

    function makeForm(f, metaList){

        ...f,
        metaList,
        metaBy: Object.fromEntries(metaList.map(m => [m.name, m])),
        images: { anim:{}, shadow:{}, offsets:{} },
        pending: { anim:new Map(), shadow:new Map(), offsets:new Map() },

        ready: false,
        loadPromise: null
      };

      makeForm(path[1], FORM_META[pi][1]),

      makeForm(path[3], FORM_META[pi][3])

    function curForm(){
      if (activeCollected >= 0 && activeCollected < collected.length) {

      }
      return forms[pathIdx >= 0 ? pathIdx : 0][formIdx];

    function loadAvatarSession(){
      const empty = { miles: 0, last: null, path: null, cycle: 0, collected: [], active: -1 };

        const raw = localStorage.getItem(AVATAR_SESSION_KEY);
        if (!raw) return empty;
        const p = JSON.parse(raw);
        if (!p || p.date !== todayKey()) return empty;
        const miles = Number(p.miles);
        if (!Number.isFinite(miles) || miles < 0) return empty;
        let last = null;
        if (Number.isFinite(p.lat) && Number.isFinite(p.lon) && Number.isFinite(p.t)) {
          last = { lat: p.lat, lon: p.lon, t: p.t };
        }
        const path = Number.isInteger(p.path) && p.path >= 0 && p.path < PATHS.length ? p.path : null;

        const collected = Array.isArray(p.collected)

          : [];
        const active = Number.isInteger(p.active) && p.active >= 0 && p.active < collected.length ? p.active : -1;
        return { miles, last, path, cycle, collected, active };
      } catch(_) {
        return empty;
      }
    }
