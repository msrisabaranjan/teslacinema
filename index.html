    const OFFSET_MODE = 'anchor';

    function clamp(n, min, max){
      return Math.min(Math.max(Number(n) || 0, min), max);
    }

    function haversineKm(lat1, lon1, lat2, lon2){
      const R = 6371;
      const toRad = x => x * Math.PI / 180;
      const dLat = toRad(lat2 - lat1);
      const dLon = toRad(lon2 - lon1);
      const a =
        Math.sin(dLat / 2) * Math.sin(dLat / 2) +
        Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) *
        Math.sin(dLon / 2) * Math.sin(dLon / 2);
      return 2 * R * Math.asin(Math.sqrt(a));
    }

    /* Miles into the current 25-mi cycle, and how many cycles completed. */
    function milesInCycle(mi){
      return Number.isFinite(mi) ? mi % CYCLE_MI : 0;
    }

    function cycleOf(mi){
      return Number.isFinite(mi) ? Math.floor(mi / CYCLE_MI) : 0;
    }

    function formIndexForMiles(mi){
      const m = milesInCycle(mi);
      for(let i = STAGES - 1; i >= 0; i--){
        if (m >= FORM_AT_MILES[i]) return i;
      }
      return 0;
    }

    function weatherCategory(code){
      code = Number(code) || 0;
      if ([0, 1].includes(code)) return 'clear';
      if (code === 2) return 'partly';
      if (code === 3) return 'overcast';
      if ([45, 48].includes(code)) return 'fog';
      if ([51, 53, 55, 56, 57].includes(code)) return 'drizzle';
      if ([61, 63, 65, 66, 67, 80, 81, 82].includes(code)) return 'rain';
      if ([71, 73, 75, 77, 85, 86].includes(code)) return 'snow';
      if ([95, 96, 99].includes(code)) return 'storm';
      return 'unknown';
    }

    /* Hysteresis so GPS jitter at a boundary can't flip the class back and forth. */
    function updateSpeedClass(speed){
      if (speedClassState === 'parked') {
        if (speed > 6) speedClassState = 'moving';
      } else if (speedClassState === 'moving') {
        if (speed >= 100) speedClassState = 'fast';
        else if (speed < 3) speedClassState = 'parked';
      } else if (speed < 92) {
        speedClassState = 'moving';
      }
      return speedClassState;
    }

    function speedGlowAmount(speed){
      if (speed < 8) return 0;
      const v = (speed - 8) / 92;
      return clamp(v, 0, 1);
    }

    function isNightNow(){
      if (state.weather && Number.isFinite(state.weather.isDay)) {
        return Number(state.weather.isDay) === 0;
      }
      const hour = new Date().getHours();
      return hour >= 19 || hour < 6;
    }

    /* Weather shown as a single emoji at the end of the info line; '' until
       the first weather fetch resolves (no GPS yet) so the line stays clean. */
    function weatherEmoji(){
      if (!state.weather) return '';
      const code = Number(state.weather.code) || 0;
      const night = Number(state.weather.isDay) === 0;
      if (code === 0) return night ? '🌙' : '☀️';
      if (code === 1) return night ? '🌙' : '🌤️';
      if (code === 2) return '⛅';
      if (code === 3) return '☁️';
      if (code === 45 || code === 48) return '🌫️';
      if (code >= 51 && code <= 57) return '🌦️';
      if ((code >= 61 && code <= 67) || (code >= 80 && code <= 82)) return '🌧️';
      if ((code >= 71 && code <= 77) || (code >= 85 && code <= 86)) return '🌨️';
      if (code >= 95 && code <= 99) return '⛈️';
      return '';
    }

    function milesInfo(){
      const m = milesInCycle(state.totalMiles);
      if (formIdx >= STAGES - 1) return Math.max(0, CYCLE_MI - m).toFixed(1) + ' mi to new egg';
      const rem = Math.max(0, FORM_AT_MILES[formIdx + 1] - m);
      // While still an egg, keep the line a mystery — never reveal what's about to hatch.
      const next = formIdx === 0 ? '???' : forms[pathIdx][formIdx + 1].label;
      return rem.toFixed(1) + ' mi to ' + next;
    }

    /* ── ANIMATION LOOKUP ── */
    function animNameInForm(f, name){
      if (f.metaBy[name]) return name;
      const fb = ANIM_FALLBACKS[name];
      if (fb && f.metaBy[fb]) return fb;
      if (f.metaBy['Idle']) return 'Idle';
      return f.metaList[0].name;
    }

    function resolveAnim(f, name){
      const m = f.metaBy[animNameInForm(f, name)];
      if (m && m.copyOf) {
        const c = f.metaBy[m.copyOf];
        if (c) return { ...c, name: m.name, copyOf: m.copyOf };
      }
      return m;
    }

    function playAnim(name, loop = true){
      const real = animNameInForm(curForm(), name);
      if (current.name === real && current.loop === loop) return;
      current = { name: real, loop };
      frame = 0;
      frameTime = 0;
      avatarPanel.dataset.anim = real.toLowerCase();
      avatarPanel.dataset.mood = real.toLowerCase();
    }

    /* Debounced mood switching — brief state flaps never reach the canvas. */
    function requestAnim(name){
      const real = animNameInForm(curForm(), name);
      if (current.name === real) return;
      const now = Date.now();
      if (pendingAnim && pendingAnim.name === real) return;
      pendingAnim = { name: real, since: now };
      setTimeout(() => {
        if (!pendingAnim || pendingAnim.name !== real) return;
        pendingAnim = null;
        playAnim(real);
      }, ANIM_DEBOUNCE_MS);
    }

    /* True while the egg is inside its pre-hatch window (the last
       HATCH_SOON_MI before it hatches into stage 1). */
    function eggHatchingSoon(){
      return formIdx === 0 &&
             formIdx + 1 < STAGES &&
             milesInCycle(state.totalMiles) >= FORM_AT_MILES[1] - HATCH_SOON_MI;
    }

    function chooseAnimation(){
      /* The egg only knows Idle, Tumble and Hurt. */
      if (curForm().id === 'egg') {
        const night = isNightNow();
        if (eggHatchingSoon()) {
          return { name:'Hurt', label:'Hatching soon…', cat:'unknown', night };
        }
        if (speedClassState !== 'parked') {
          return { name:'Tumble', label:'Tumbling', cat:'unknown', night };
        }
        return { name:'Idle', label:'Resting', cat:'unknown', night };
      }

      const cat = state.weather ? weatherCategory(state.weather.code) : 'unknown';
      const night = isNightNow();

      const parked = speedClassState === 'parked';
      const fast = speedClassState === 'fast';

      if (night) {
        if (parked) {
          return { name: 'Sleep', label: 'Sleeping', cat, night };
        }

        if (fast) {
          return { name: 'Charge', label: 'Night Charge', cat, night };
        }

        if (cat === 'storm') {
          return { name: 'Faint', label: 'Storm Fright', cat, night };
        }

        if (cat === 'rain' || cat === 'snow' || cat === 'fog') {
          return { name: 'Trip', label: 'Weather Trip', cat, night };
        }

        return { name: 'Walk', label: 'Night Walk', cat, night };
      }

      if (cat === 'storm') {
        return { name: 'Faint', label: 'Storm Fright', cat, night };
      }

      if (cat === 'rain') {
        return { name: 'Trip', label: 'Rain Trip', cat, night };
      }

      if (cat === 'snow') {
        return { name: 'DeepBreath', label: 'Cold Breath', cat, night };
      }

      if (cat === 'drizzle') {
        return { name: 'Sit', label: 'Drizzle Sit', cat, night };
      }

      if (cat === 'fog') {
        if (parked) return { name: 'EventSleep', label: 'Fog Sleep', cat, night };
        return { name: 'Walk', label: 'Fog Walk', cat, night };
      }

      if (cat === 'overcast') {
        if (parked) return { name: 'Idle', label: 'Overcast Idle', cat, night };
        return { name: 'Walk', label: 'Overcast Walk', cat, night };
      }

      if (fast) {
        return { name: 'Charge', label: 'Fast Charge', cat, night };
      }

      if (!parked) {
        return { name: 'Walk', label: 'Walking', cat, night };
      }

      return { name: 'Idle', label: 'Idle', cat, night };
    }

    /* Prefetches the next stage of the current line once the line is known.
       (Before the hatch there is no line to prefetch — the hatching load
       happens in startEvolution.) */
    function checkPrefetch(){
      if (pathIdx >= 0 && formIdx + 1 < STAGES &&
          milesInCycle(state.totalMiles) >= FORM_AT_MILES[formIdx + 1] - PREFETCH_AHEAD_MI &&
          !forms[pathIdx][formIdx + 1].loadPromise) {
        loadForm(pathIdx, formIdx + 1);
      }
      /* Final form nearing the cycle rollover: warm the egg for the retire. */
      if (formIdx === STAGES - 1 &&
          milesInCycle(state.totalMiles) >= CYCLE_MI - PREFETCH_AHEAD_MI &&
          !forms[0][0].loadPromise) {
        loadForm(0, 0);
      }
    }

    /* Evolution: cross a distance threshold → flash + brief transition anim.
       The egg hatching (stage 0 → 1) gets a gold burst instead of the green
       evolve flash, and is where the evolution line is rolled. */
    function startEvolution(target){
      if (evolveTarget !== -1) return;
      /* A live evolution always takes the stage back from a collected form. */
      if (activeCollected !== -1) {
        activeCollected = -1;
        renderHolding();
      }
      if (stage) stage.classList.remove('stage-empty', 'stage-pop');
      // Roll the line once at hatch and persist it so a page reload doesn't
      // re-roll the companion.
      if (formIdx === 0 && pathIdx === -1) {
        pathIdx = Math.floor(Math.random() * PATHS.length);
        saveAvatarSession(true);
      }
      evolveTarget = target;
      evolveIsHatch = formIdx === 0;
      if (moodLabel) moodLabel.textContent = evolveIsHatch ? 'Hatching…' : 'Evolving…';
      loadForm(pathIdx, target).then(() => {
        formIdx = target;
        evolveAnimName = ['Wake','Tumble','Hop','Idle'].find(n => forms[pathIdx][target].metaBy[n]) || 'Idle';
        evolveUntil = Date.now() + 1600;
        playAnim(evolveAnimName, true);
        if (stage) {
          const cls = evolveIsHatch ? 'hatching' : 'evolving';
          stage.classList.remove('evolving', 'hatching', 'hatch-pulse');
          void stage.offsetWidth;
          stage.classList.add(cls);
        }
        setTimeout(() => {
          evolveTarget = -1;
          pendingAnim = null;
          if (stage) stage.classList.remove('evolving', 'hatching');
          const again = formIndexForMiles(state.totalMiles);
          if (again !== formIdx) startEvolution(again);
          else updateAvatar();
        }, 1700);
        updateAvatar();
      });
    }

    /* Crossing a cycle boundary (every CYCLE_MI miles): the final form
       streaks to the avatar rail and a fresh egg takes the stage. The
       line is re-rolled at the next hatch. */
    function retireCycle(){
      const retiringForm = pathIdx >= 0 ? forms[pathIdx][STAGES - 1] : null;
      /* While swapped, the retiring form sits in a rail slot and a
         collected form holds the stage — the two flights cross over. */
      const swappedSlot = activeCollected;
      const displayedForm = swappedSlot >= 0 && swappedSlot < collected.length
        ? forms[collected[swappedSlot]][STAGES - 1] : null;
      if (pathIdx >= 0) collected.push(pathIdx);
      const newIdx = collected.length - 1;
      cycle = cycleOf(state.totalMiles);
      pathIdx = -1;
      formIdx = 0;
      activeCollected = -1;
      evolveTarget = -1;
      evolveUntil = 0;
      retireUntil = Date.now() + 1600;
      playAnim('Idle');
      /* The egg isn't in the load path anymore once a line is running —
         warm it now so the fresh egg has sprites from the first frame. */
      loadForm(0, 0);
      if (stage) {
        stage.classList.remove('evolving', 'hatching', 'hatch-pulse', 'retiring', 'stage-empty', 'stage-pop');
        void stage.offsetWidth;
        stage.classList.add('retiring');
        setTimeout(() => stage.classList.remove('retiring'), 1200);
      }
      renderHolding(-1, newIdx);
      saveAvatarSession(true);
      if (!retiringForm || !trailLayer) return;
      const newSlot = slotElFor(newIdx);
      if (!newSlot) return;
      if (swappedSlot >= 0 && displayedForm) {
        /* Retiring form: its slot → the new slot; displayed form: stage → that slot. */
        const oldSlot = slotElFor(swappedSlot);
        if (oldSlot) {
          oldSlot.classList.add('ghost');
          if (stage) stage.classList.add('stage-empty');
          Promise.all([
            flyAvatar(oldSlot, newSlot, retiringForm, 700),
            flyAvatar(canvas, oldSlot, displayedForm, 700)
          ]).then(() => {
            if (stage) stage.classList.remove('stage-empty');
            renderHolding(newIdx);
          });
          return;
        }
      }
      /* The retired form streaks to its new rail slot, then pops in. */
      flyAvatar(canvas, newSlot, retiringForm, 700).then(() => renderHolding(newIdx));
    }

    /* ── AVATAR RAIL — collected final forms in the dock card, tap to swap ── */
    function drawMini(f, c){
      const mctx = c.getContext('2d');
      mctx.imageSmoothingEnabled = false;
      mctx.clearRect(0, 0, c.width, c.height);
      const meta = resolveAnim(f, 'Idle');
      const key = meta.copyOf || meta.name;
      const img = f.images.anim[key];
      if (!img || !img.naturalWidth) return;
      const scale = Math.min(c.width / meta.w, c.height / meta.h);
      const dw = meta.w * scale, dh = meta.h * scale;
      mctx.drawImage(img, 0, 0, meta.w, meta.h, (c.width - dw) / 2, (c.height - dh) / 2, dw, dh);
    }

    function slotElFor(i){
      return holdingEl ? holdingEl.querySelector('.rail-avatar-slot[data-idx="' + i + '"]') : null;
    }

    /* The companion that grows with the odometer (the egg before hatch). */
    function liveForm(){
      return forms[pathIdx >= 0 ? pathIdx : 0][formIdx];
    }

    /* popIdx: slot whose sprite pops in; ghostIdx: slot left empty while
       its sprite is mid-flight. */
    function renderHolding(popIdx, ghostIdx){
      if (!holdingEl) return;
      holdingEl.innerHTML = '';
      if (holdCountEl) holdCountEl.textContent = collected.length ? '×' + collected.length : '';
      if (!collected.length) {
        holdingEl.hidden = true;
        return;
      }
      holdingEl.hidden = false;
      /* Newest first, like the top slot of a party list. */
      for (let i = collected.length - 1; i >= 0; i--) {
        const pi = collected[i];
        /* The selected slot holds the live companion — stage and slot
           swapped places, so each shows the other's former occupant. */
        const swapped = i === activeCollected;
        const f = swapped ? liveForm() : forms[pi][STAGES - 1];
        const slot = document.createElement('button');
        slot.type = 'button';
        slot.className = 'rail-avatar-slot';
        slot.dataset.idx = String(i);
        if (i === collected.length - 1) slot.classList.add('newest');
        if (swapped) slot.classList.add('selected');
        if (i === ghostIdx) slot.classList.add('ghost');
        if (i === popIdx) slot.classList.add('pop');
        slot.title = swapped ? f.label + ' · live' : f.label;
        slot.setAttribute('aria-label', slot.title);
        const c = document.createElement('canvas');
        c.width = 34; c.height = 34;
        slot.appendChild(c);
        slot.addEventListener('click', (e) => {
          e.stopPropagation();
          selectCollected(i);
        });
        holdingEl.appendChild(slot);
        /* After a reload the slot's sheet may not be loaded yet. */
        if (swapped) loadForm(pathIdx >= 0 ? pathIdx : 0, formIdx).then(() => drawMini(f, c));
        else loadForm(pi, STAGES - 1).then(() => drawMini(f, c));
      }
    }

    /* White comet flight of a mini sprite between two elements: a glowing
       sprite with a short white streak, arcing from a's center to b's.
       Resolves when the comet lands. */
    function flyAvatar(fromEl, toEl, f, dur){
      return new Promise((resolve) => {
        if (!trailLayer || !fromEl || !toEl) { resolve(); return; }
        const a = fromEl.getBoundingClientRect();
        const b = toEl.getBoundingClientRect();
        const x0 = a.left + a.width / 2, y0 = a.top + a.height / 2;
        const x1 = b.left + b.width / 2, y1 = b.top + b.height / 2;
        const dx = x1 - x0, dy = y1 - y0;
        const dist = Math.hypot(dx, dy) || 1;
        const comet = document.createElement('div');
        comet.className = 'trail-comet';
        comet.style.setProperty('--trail-len', Math.min(120, Math.max(40, dist * 0.45)) + 'px');
        comet.style.setProperty('--trail-angle', (Math.atan2(dy, dx) * 180 / Math.PI) + 'deg');
        const tail = document.createElement('i');
        tail.className = 'trail-tail';
        const c = document.createElement('canvas');
        c.width = 34; c.height = 34;
        comet.appendChild(tail);
        comet.appendChild(c);
        comet.style.transform = 'translate(' + (x0 - 17) + 'px,' + (y0 - 17) + 'px)';
        trailLayer.appendChild(comet);
        drawMini(f, c);
        const mx = (x0 + x1) / 2, my = (y0 + y1) / 2 - Math.min(60, dist * 0.18);
        const anim = comet.animate([
          { transform: 'translate(' + (x0 - 17) + 'px,' + (y0 - 17) + 'px) scale(.6)', opacity: 0 },
          { transform: 'translate(' + (mx - 17) + 'px,' + (my - 17) + 'px) scale(1)', opacity: 1, offset: 0.45 },
          { transform: 'translate(' + (x1 - 17) + 'px,' + (y1 - 17) + 'px) scale(.9)', opacity: 1, offset: 0.9 },
          { transform: 'translate(' + (x1 - 17) + 'px,' + (y1 - 17) + 'px) scale(.9)', opacity: 0 }
        ], { duration: dur || 620, easing: 'cubic-bezier(.25,.6,.35,1)' });
        anim.onfinish = () => { comet.remove(); resolve(); };
      });
    }

    let swapBusy = false;

    function stageReveal(){
      if (!stage) return;
      stage.classList.remove('stage-empty');
      stage.classList.add('stage-pop');
      setTimeout(() => stage.classList.remove('stage-pop'), 450);
    }

    /* Tap a rail slot: a true swap of places. The displayed companion
       flies into the tapped slot (or home to its own slot if another
       collected form was on stage), then the slot's form flies in. */
    async function selectCollected(i){
      if (evolveTarget !== -1 || swapBusy) return;
      if (activeCollected === i) { handBack(); return; }
      swapBusy = true;
      const outgoing = activeCollected;
      const outForm = curForm();
      const slot = slotElFor(i);
      stage.classList.add('stage-empty');
      if (outgoing >= 0) {
        /* Another collected form was on stage: it flies home first. */
        const outSlot = slotElFor(outgoing);
        if (outSlot) outSlot.classList.add('ghost');
        await flyAvatar(canvas, outSlot || holdingEl, outForm, 520);
        if (outSlot) outSlot.classList.remove('ghost');
      } else {
        /* The live companion moves into the tapped slot. */
        if (slot) slot.classList.add('ghost');
        await flyAvatar(canvas, slot || holdingEl, outForm, 520);
      }
      if (evolveTarget !== -1) { swapBusy = false; renderHolding(); stageReveal(); updateAvatar(); return; }
      if (slot) slot.classList.add('ghost');
      await loadForm(collected[i], STAGES - 1);
      await flyAvatar(slot || holdingEl, canvas, forms[collected[i]][STAGES - 1], 520);
      if (evolveTarget !== -1) { swapBusy = false; renderHolding(); stageReveal(); updateAvatar(); return; }
      activeCollected = i;
      frame = 0;
      frameTime = 0;
      renderHolding(i);
      stageReveal();
      saveAvatarSession(true);
      updateAvatar();
      swapBusy = false;
    }

    /* Hand-back: the collected form flies from the stage to its slot and
       the live companion pops back in. */
    async function handBack(){
      if (evolveTarget !== -1 || swapBusy) return;
      const i = activeCollected;
      if (i < 0 || i >= collected.length) { activeCollected = -1; return; }
      swapBusy = true;
      const slot = slotElFor(i);
      stage.classList.add('stage-empty');
      if (slot) slot.classList.add('ghost');
      await flyAvatar(canvas, slot || holdingEl, forms[collected[i]][STAGES - 1], 520);
      activeCollected = -1;
      frame = 0;
      frameTime = 0;
      renderHolding(i);
      stageReveal();
      saveAvatarSession(true);
      updateAvatar();
      swapBusy = false;
    }

    /* Tap the stage itself to hand it back to the live companion. */
    if (stage) stage.addEventListener('click', () => {
      if (activeCollected >= 0) selectCollected(activeCollected);
    });

    function updateAvatar(){
      const cyc = cycleOf(state.totalMiles);
      if (cyc > cycle) retireCycle();

      const target = formIndexForMiles(state.totalMiles);
      if (target !== formIdx) startEvolution(target);

      speedClassState = updateSpeedClass(state.smoothSpeed);
      checkPrefetch();

      const evolving = Date.now() < evolveUntil;
      let chosen;
      if (evolving) {
        chosen = { name: evolveAnimName, label: (evolveIsHatch ? 'Hatching → ' : 'Evolving → ') + curForm().label, cat: 'unknown', night: isNightNow() };
      } else if (Date.now() < retireUntil) {
        chosen = { name: 'Idle', label: 'New egg!', cat: 'unknown', night: isNightNow() };
      } else {
        chosen = chooseAnimation();
        requestAnim(chosen.name);
      }

      if (moodLabel) moodLabel.textContent = chosen.label;
      if (infoLabel) {
        /* speed · distance-to-next · weather emoji (omitted until known) */
        const parts = [
          Math.round(Math.max(0, state.smoothSpeed) / KM_PER_MILE) + ' mph',
          milesInfo()
        ];
        const emoji = weatherEmoji();
        if (emoji) parts.push(emoji);
        infoLabel.textContent = parts.join(' · ');
      }
      if (gpsDot) gpsDot.classList.toggle('ok', state.gpsOk);

      /* Egg inside its pre-hatch window: keep the gold pulse running. */
      if (stage) stage.classList.toggle('hatch-pulse', !evolving && eggHatchingSoon());

      avatarPanel.dataset.speed = speedClassState;
      avatarPanel.dataset.weather = evolving ? (evolveIsHatch ? 'hatch' : 'evolve') : (chosen.cat || 'unknown');
      avatarPanel.dataset.time = chosen.night ? 'night' : 'day';
      if (formLabel) formLabel.textContent = curForm().label;

      document.body.style.setProperty(
        '--speed-glow',
        speedGlowAmount(state.smoothSpeed).toFixed(2)
      );
    }

    async function fetchAvatarWeather(lat, lon){
      try {
        const params = new URLSearchParams({
          latitude: lat,
          longitude: lon,
          current: 'temperature_2m,weather_code,wind_speed_10m,is_day',
          timezone: 'auto'
        });

        const res = await fetch(`https://api.open-meteo.com/v1/forecast?${params.toString()}`, {
          signal: AbortSignal.timeout(10000)
        });

        if (!res.ok) throw new Error('weather failed');

        const json = await res.json();
        const cur = json.current;

        if (!cur) throw new Error('weather payload missing');

        state.weather = {
          code: Number(cur.weather_code),
          tempC: Number(cur.temperature_2m),
          windKmh: Number(cur.wind_speed_10m),
          isDay: Number(cur.is_day)
        };

        updateAvatar();
      } catch(_) {
        state.weather = null;
        updateAvatar();
      }
    }

    function onGeo(pos){
      const c = pos.coords;
      const arrivedAt = Date.now();
      const stamp = Number(pos.timestamp) || 0;

      /* A provider replaying a cached fix keeps pos.timestamp frozen, and using
         it as the clock would freeze dtSec — and with it, distance. Arrival time
         takes over whenever the stamp doesn't advance. */
      const now = (stamp && stamp !== lastFixStamp) ? stamp : arrivedAt;

      if (!Number.isFinite(c.latitude) || !Number.isFinite(c.longitude)) return;

      lastFixArrivedAt = arrivedAt;
      state.hasFix = true;
      state.gpsOk = true;

      /* ── SPEED ── measured against the immediately previous fix, as it has
         always been. mph reads right in the car, so the maths stays put; the
         reference is only held until the interval is long enough to measure,
         which is what made a fast-callback provider display 0 mph. */
      if (prevFix) {
        const sdtSec  = (now - prevFix.t) / 1000;
        const sDistKm = haversineKm(prevFix.lat, prevFix.lon, c.latitude, c.longitude);

        // Smoothed speed: time-constant EMA over a gated raw speed.
        if (sdtSec >= 0.5) {
          const distSpeed = (sDistKm / sdtSec) * 3600;
          const devSpeed  = (Number.isFinite(c.speed) && c.speed >= 0) ? c.speed * 3.6 : null;

          let raw;
          if (devSpeed !== null && devSpeed <= MAX_KMH) raw = devSpeed;
          else if (distSpeed <= MAX_KMH) raw = distSpeed;
          else raw = 0;

          // Tiny displacement while (nearly) stopped ⇒ treat as parked, kills jitter spikes.
          if (sDistKm < 0.005 && (devSpeed === null || devSpeed < 7.2)) raw = 0;
          if (raw < 1) raw = 0;

          // raw === 0 means "no reliable displacement this fix" (jitter or spike),
          // not "the car is stopped". Hold the last smoothed speed instead of
          // dragging it to zero — genuine stops are handled by the decay timer.
          if (raw > 0) {
            state.lastMove = now;
            const tau   = raw > state.smoothSpeed ? TAU_UP : TAU_DOWN;
            const alpha = 1 - Math.exp(-sdtSec / tau);
            state.smoothSpeed = state.smoothSpeed * (1 - alpha) + raw * alpha;
          }

          prevFix = { lat: c.latitude, lon: c.longitude, t: now };
        }
      } else {
        prevFix = { lat: c.latitude, lon: c.longitude, t: now };
      }

      /* ── DISTANCE ── the odometer holds its reference fix until the interval is
         worth measuring, which is what the in-car provider was starving. */
      if (state.last) {
        const dtSec  = (now - state.last.t) / 1000;
        const distKm = haversineKm(state.last.lat, state.last.lon, c.latitude, c.longitude);
        const implied = dtSec > 0 ? (distKm / dtSec) * 3600 : Infinity;
        const moved   = dtSec >= 0.25 && distKm >= MIN_MOVE_KM && implied <= MAX_KMH;
        let accounted = false;   // this interval contributed miles (either source)

        // Accumulate session distance (jitter + spike gated).
        if (dtSec >= 0.25) {
          if (moved) {
            /* The position really moved, so the provider is alive. If the miles
               just before this came from the speed signal, this displacement is
               the catch-up of distance already counted — don't count it twice. */
            if (!integrating) state.totalMiles += distKm / KM_PER_MILE;
            integrating = false;
            lastFreshFixAt = arrivedAt;
            accounted = true;
          } else if (dtSec <= 60 && state.smoothSpeed >= INTEGRATE_MIN_KMH &&
                     arrivedAt - lastFreshFixAt > STALE_FIX_MS) {
            /* Displacement rejected: jitter, a spike, or a provider replaying the
               same coordinates while the car rolls. The speed signal is live
               (it's what mph is drawn from), so integrate it across the interval
               instead of losing the miles. One source per interval, never both. */
            state.totalMiles += (state.smoothSpeed * dtSec / 3600) / KM_PER_MILE;
            integrating = true;
            accounted = true;
          }
        }

        /* Advance the reference fix only once the interval has actually been
           measured: either it contributed miles, or it has run long enough that
           waiting more won't clear the jitter gate. Overwriting it on every
           callback throws away the displacement of every shorter interval, so a
           fast-callback provider accrues nothing at all; leaving it behind after
           an interval was counted would count that interval twice. */
        if (accounted || dtSec >= REF_HOLD_MAX_SEC) state.last = { lat: c.latitude, lon: c.longitude, t: now };
      } else {
        state.last = { lat: c.latitude, lon: c.longitude, t: now };
        lastFreshFixAt = arrivedAt;
        fetchAvatarWeather(c.latitude, c.longitude);
      }

      lastFixStamp = stamp;
      saveAvatarSession(false);
      updateAvatar();
    }

    function onGeoError(){
      state.gpsOk = state.hasFix;
      updateAvatar();
    }

    const GEO_OPTIONS = { enableHighAccuracy: true, maximumAge: 0, timeout: 20000 };

    /* Re-arm the location provider. The in-car browser's geolocation watch can
       stall outright, or keep calling back with the same cached coordinates;
       clearWatch + watchPosition re-primes it either way (the same effect
       minimizing/reopening the page has). */
    function registerWatch(){
      if (TEST_MODE || !('geolocation' in navigator)) return;
      if (watchId !== null) {
        try { navigator.geolocation.clearWatch(watchId); } catch(_) {}
      }
      watchId = navigator.geolocation.watchPosition(onGeo, onGeoError, GEO_OPTIONS);
      watchArmedAt = Date.now();
    }

    /* Is the provider replaying the same coordinates? A watch that keeps
       calling back without the position ever moving is the in-car failure mode:
       speed stays live, displacement goes to zero, distance freezes.
       A parked car legitimately reports the same spot all day, so staleness
       only means something while the speed signal says we're rolling. */
    function providerIsStale(){
      if (state.smoothSpeed < INTEGRATE_MIN_KMH) return false;
      if (!lastFreshFixAt) return false;
      return Date.now() - lastFreshFixAt > STALE_FIX_MS;
    }

    /* Watchdog: re-arm when the watch went silent, when it is alive but stale,
       or when it has simply been armed too long — that last one is the blunt
       version of minimizing and restoring the browser, and it costs nothing.
       Not gated on visibilityState: the in-car browser misreports it. */
    function startWatchdog(){
      setInterval(() => {
        const now = Date.now();
        const silent  = now - Math.max(lastFixArrivedAt, watchArmedAt) > 30000;
        const overdue = state.smoothSpeed >= INTEGRATE_MIN_KMH && now - watchArmedAt > REARM_MS;
        if (silent || overdue || providerIsStale()) registerWatch();
      }, 5000);
    }

    /* Poll fallback: a fresh one-shot getCurrentPosition re-primes the provider
       (same effect as switching apps and back); the fix flows through the same
       onGeo pipeline, so distance/speed keep accumulating. Fires when the watch
       has gone quiet *or* when it is delivering stale coordinates — watching for
       silence alone misses the in-car case, because the callbacks never stop. */
    function startPollFallback(){
      let pollInFlight = false;
      setInterval(() => {
        if (pollInFlight) return;
        if (Date.now() - lastFixArrivedAt < 10000 && !providerIsStale()) return;
        pollInFlight = true;
        navigator.geolocation.getCurrentPosition(
          p => { pollInFlight = false; onGeo(p); },
          () => { pollInFlight = false; onGeoError(); },
          GEO_OPTIONS);
        /* Safety net: if the browser never calls back at all, let the
           next tick try again rather than sticking the fallback off. */
        setTimeout(() => { pollInFlight = false; }, 25000);
      }, 6000);
    }

    /* Re-arm on return (the watch can go silent *or* start replaying cached
       coordinates while hidden) and persist the session when leaving the page
       or it gets hidden/killed. */
    function startVisibilityWatch(){
      function rearmIfQuiet(){
        const ref = Math.max(lastFixArrivedAt, watchArmedAt);
        if ((ref && Date.now() - ref > 20000) || providerIsStale()) registerWatch();
      }
      document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'visible') rearmIfQuiet();
        else saveAvatarSession(true);
      });
      /* The in-car browser doesn't always flip visibilityState when you switch
         apps and come back, but it does hand the page focus again. */
      window.addEventListener('focus', rearmIfQuiet);
      window.addEventListener('pageshow', rearmIfQuiet);
      window.addEventListener('pagehide', () => saveAvatarSession(true));
    }

    function startDecay(){
      setInterval(() => {
        const now = Date.now();

        if (todayKey() !== sessionDate) {
          // Local date rolled over ⇒ new "driven today" session.
          sessionDate = todayKey();
          state.totalMiles = 0;
          state.last = null;
          prevFix = null;
          integrating = false;
          lastFreshFixAt = 0;
          formIdx = 0;
          pathIdx = -1; // back to the egg — the line is re-rolled at hatch
          cycle = 0;
          collected = [];
          activeCollected = -1;
          renderHolding();
          saveAvatarSession(true);
          updateAvatar();
          return;
        }

        if (state.lastMove && now - state.lastMove > SPEED_HOLD_MS) {
          // Exponential ease toward 0 (smooth, no snap) after a short hold.
          const alpha = 1 - Math.exp(-0.8 / SPEED_DECAY_TAU);
          state.smoothSpeed = state.smoothSpeed * (1 - alpha);

          if (state.smoothSpeed < 0.5) state.smoothSpeed = 0;

          updateAvatar();
        }
      }, 800);
    }

    function startWeatherRefresh(){
      setInterval(() => {
        if (state.last) {
          fetchAvatarWeather(state.last.lat, state.last.lon);
        }
      }, 15 * 60 * 1000);
    }

    /* ── IMAGE LOADING (per form) ── */
    function filesForForm(f, name){
      const s = f.suffix;
      return {
        anim:    name + '-Anim' + s + '.png',
        shadow:  name + '-Shadow' + s + '.png',
        offsets: name + '-Offsets' + s + '.png'
      };
    }

    function loadImage(kind, f, key, url){
      const store = f.images[kind];
      const queue = f.pending[kind];

      if (Object.prototype.hasOwnProperty.call(store, key)) {
        return Promise.resolve(store[key]);
      }

      if (queue.has(key)) {
        return queue.get(key);
      }

      const promise = new Promise(resolve => {
        const img = new Image();

        img.onload = () => {
          store[key] = img;
          queue.delete(key);
          resolve(img);
        };

        img.onerror = () => {
          store[key] = null;
          queue.delete(key);
          resolve(null);
        };

        img.src = url;
      });

      queue.set(key, promise);
      return promise;
    }

    function loadForm(pi, stage){
      const f = forms[pi][stage];
      if (f.loadPromise) return f.loadPromise;

      f.loadPromise = new Promise(resolve => {
        const ps = [];

        f.metaList.forEach(meta => {
          const key = meta.copyOf || meta.name;
          const files = filesForForm(f, key);

          ps.push(loadImage('anim', f, key, f.dir + files.anim));
          ps.push(loadImage('shadow', f, key, f.dir + files.shadow));
          ps.push(loadImage('offsets', f, key, f.dir + files.offsets));
        });

        Promise.all(ps).then(() => {
          f.metaList.forEach(meta => {
            const key = meta.copyOf || meta.name;
            if (f.offsetCache.has(key)) return;
            const offImg = f.images.offsets[key];
            if (offImg && offImg.naturalWidth) {
              f.offsetCache.set(key, computeOffsets(meta, offImg));
            }
          });
          f.ready = true;
          resolve(f);
        });
      });

      return f.loadPromise;
    }

    function computeOffsets(meta, img){
      // PMDCollab sheets export a full animation grid (often an 8-row
      // canvas), which can hold more cells than the XML duration list.
      // Compute an anchor for every cell so any played frame resolves.
      const cols = Math.max(1, Math.round(img.naturalWidth / meta.w));
      const rows = Math.max(1, Math.round(img.naturalHeight / meta.h));
      const count = cols * rows;

      const offCanvas = document.createElement('canvas');
      offCanvas.width = meta.w;
      offCanvas.height = meta.h;
      const offCtx = offCanvas.getContext('2d');

      const result = [];

      for (let f = 0; f < count; f++) {
        const sx = (f % cols) * meta.w;
        const sy = Math.floor(f / cols) * meta.h;

        offCtx.clearRect(0, 0, meta.w, meta.h);
        offCtx.drawImage(
          img,
          sx,
          sy,
          meta.w,
          meta.h,
          0,
          0,
          meta.w,
          meta.h
        );

        let anchor = { x: meta.w / 2, y: meta.h / 2 };

        try {
          const data = offCtx.getImageData(0, 0, meta.w, meta.h).data;
          let sumX = 0;
          let sumY = 0;
          let n = 0;

          for (let y = 0; y < meta.h; y++) {
            for (let x = 0; x < meta.w; x++) {
              const i = (y * meta.w + x) * 4;
              const a = data[i + 3];
              const r = data[i];
              const g = data[i + 1];
              const b = data[i + 2];

              if (a > 16 && (r + g + b) > 32) {
                sumX += x + 0.5;
                sumY += y + 0.5;
                n++;
              }
            }
          }

          if (n > 0) {
            anchor = {
              x: sumX / n,
              y: sumY / n
            };
          }
        } catch(_) {
          anchor = { x: meta.w / 2, y: meta.h / 2 };
        }

        result.push(anchor);
      }

      return result;
    }

    function getOffset(meta, frameIndex){
      const key = meta.copyOf || meta.name;
      const offsets = curForm().offsetCache.get(key);

      if (offsets && offsets.length) {
        return offsets[frameIndex % offsets.length] || { x: meta.w / 2, y: meta.h / 2 };
      }

      return { x: meta.w / 2, y: meta.h / 2 };
    }

    function drawFrame(ts){
      if (!lastTs) lastTs = ts;

      const dt = Math.min(50, ts - lastTs);
      lastTs = ts;

      const f = curForm();
      const meta = resolveAnim(f, current.name);
      const key = meta.copyOf || meta.name;
      const durations = meta.d || [8];

      // PMDCollab sheets export a full animation grid (often an 8-row
      // canvas) that can hold more cells than the XML duration list, so
      // play every cell row-major and cycle the durations across them —
      // the same playback the official sprites.pmdcollab.org viewer uses.
      // Sheets whose first row repeats a single cell (e.g. red3 Charge)
      // would otherwise appear frozen.
      const animImg = f.images.anim[key];
      let frameCount = durations.length;
      if (animImg && animImg.naturalWidth) {
        const aCols = Math.max(1, Math.round(animImg.naturalWidth / meta.w));
        const aRows = Math.max(1, Math.round(animImg.naturalHeight / meta.h));
        frameCount = Math.max(1, aCols * aRows);
      }

      frameTime += dt;

      let duration = (durations[frame % durations.length] || 8) * (1000 / 60);

      while (frameTime >= duration) {
        frameTime -= duration;
        frame++;

        if (frame >= frameCount) {
          if (!current.loop) {
            frame = frameCount - 1;
          } else {
            frame = 0;
          }
        }

        duration = (durations[frame % durations.length] || 8) * (1000 / 60);
      }

      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.imageSmoothingEnabled = false;

      /* Sprite fills ~80/90% of the buffer — same ratios the original
         fixed 150px canvas used (120/150, 135/150), so it looks
         identical at default size and stays proportional at any tile
         width. */
      const scale = Math.min(canvas.height * 0.8 / meta.h, canvas.width * 0.9 / meta.w, 3);
      const dw = meta.w * scale;
      const dh = meta.h * scale;

      const offset = getOffset(meta, frame);

      let drawX;
      let drawY;

      if (OFFSET_MODE === 'vector') {
        drawX = (canvas.width - dw) / 2 + (offset.x - meta.w / 2) * scale;
        drawY = (canvas.height - dh) / 2 + (offset.y - meta.h / 2) * scale;
      } else {
        drawX = canvas.width / 2 - offset.x * scale;
        drawY = canvas.height / 2 - offset.y * scale;
      }

      const shadowImg = f.images.shadow[key];
      if (shadowImg && shadowImg.naturalWidth) {
        const sCols = Math.max(1, Math.round(shadowImg.naturalWidth / meta.w));
        const sRows = Math.max(1, Math.round(shadowImg.naturalHeight / meta.h));
        const sFrame = frame % (sCols * sRows);
        const sx = (sFrame % sCols) * meta.w;
        const sy = Math.floor(sFrame / sCols) * meta.h;

        ctx.globalAlpha = 0.65;
        ctx.drawImage(
          shadowImg,
          sx,
          sy,
          meta.w,
          meta.h,
          drawX,
          drawY + 1.5 * scale,
          dw,
          dh
        );
        ctx.globalAlpha = 1;
      }

      if (animImg && animImg.naturalWidth) {
        const aCols = Math.max(1, Math.round(animImg.naturalWidth / meta.w));
        const ax = (frame % aCols) * meta.w;
        const ay = Math.floor(frame / aCols) * meta.h;

        ctx.drawImage(
          animImg,
          ax,
          ay,
          meta.w,
          meta.h,
          drawX,
          drawY,
          dw,
          dh
        );
      } else {
        const boxSize = Math.min(canvas.width, canvas.height) * 0.6;
        const bx = (canvas.width - boxSize) / 2;
        const by = (canvas.height - boxSize) / 2;

        /* Follow the accent hue (T logo slider) — canvas colors can't use
           var(), so read the live value off the root element. */
        const accentHueNow = getComputedStyle(document.documentElement).getPropertyValue('--h').trim() || '141';
        ctx.fillStyle = 'hsl(' + accentHueNow + ' 73% 42% / 0.18)';
        ctx.strokeStyle = 'hsl(' + accentHueNow + ' 73% 42% / 0.55)';
        ctx.lineWidth = 2;

        if (ctx.roundRect) {
          ctx.beginPath();
          ctx.roundRect(bx, by, boxSize, boxSize, 12);
          ctx.fill();
          ctx.stroke();
        } else {
          ctx.fillRect(bx, by, boxSize, boxSize);
          ctx.strokeRect(bx, by, boxSize, boxSize);
        }

        ctx.fillStyle = 'rgba(255, 255, 255, 0.75)';
        ctx.font = Math.max(9, Math.round(canvas.width * 0.067)) + 'px Inter, sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(current.name, canvas.width / 2, canvas.height / 2 + 3);
      }

      requestAnimationFrame(drawFrame);
    }

    async function init(){
      /* ?test_collect=N pre-seeds the holding rail for layout/swap testing. */
      if (Number.isInteger(TEST_COLLECT) && TEST_COLLECT > 0) {
        for (let i = 0; i < TEST_COLLECT; i++) {
          collected.push(Math.floor(Math.random() * PATHS.length));
        }
      }
      renderHolding();

      updateAvatar();

      await loadForm(pathIdx >= 0 ? pathIdx : 0, formIdx);

      updateAvatar();

      if (TEST_MODE) {
        // Synthetic speed source — preview forms/speeds without GPS.
        if (Number.isInteger(TEST_WEATHER)) {
          state.weather = { code: TEST_WEATHER, tempC: 21, windKmh: 8, isDay: 1 };
        }
        state.hasFix = true;
        state.gpsOk = true;
        setInterval(() => {
          const t = Date.now() / 1000;
          state.smoothSpeed = Math.max(0, TEST_SPEED + Math.sin(t * 0.6) * 2.5);
          state.lastMove = Date.now();
          if (TEST_DRIVE) state.totalMiles += 1 / 48; // ~75 mi/h — watch evolutions happen
          updateAvatar();
        }, 500);
      } else {
        startDecay();
        startWeatherRefresh();
        startWatchdog();
        startPollFallback();
        startVisibilityWatch();

        registerWatch();

        // Warm the next stage's cache in case the drive runs long.
        setTimeout(() => {
          if (pathIdx >= 0 && formIdx + 1 < STAGES && !forms[pathIdx][formIdx + 1].loadPromise) {
            loadForm(pathIdx, formIdx + 1);
          }
        }, 120000);
      }

      requestAnimationFrame(drawFrame);
    }

    init();
  })();
  </script>
</body>
